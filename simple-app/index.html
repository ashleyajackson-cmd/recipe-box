<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b3328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipe Box">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eee6d3;
    --card: #fbf5e7;
    --card-edge: #efe3c8;
    --ink: #2b2620;
    --ink-soft: #756a58;
    --chalk: #2b3328;
    --chalk-text: #f2efe4;
    --herb: #55704f;
    --herb-dark: #3d5238;
    --herb-pale: #e2ead9;
    --tomato: #c1502e;
    --tomato-pale: #f4ddd3;
    --mustard: #b98123;
    --mustard-pale: #f2e5c8;
    --plum: #7a4a63;
    --plum-pale: #ecdde3;
    --line: rgba(43,38,32,0.14);
    --shadow: 0 2px 0 rgba(43,38,32,0.06), 0 8px 18px rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,38,32,0.05) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    padding:28px 20px 60px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:34px;
    margin:0;
    letter-spacing:-0.5px;
  }
  .tagline{color:var(--ink-soft); font-size:14px; margin-top:2px;}

  nav{display:flex; gap:6px;}
  .tab{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:14px;
    padding:10px 18px 9px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:1px;
  }
  .tab.active{
    background:var(--chalk);
    color:var(--chalk-text);
    border-color:var(--chalk);
  }

  .panel{
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:0 12px 12px 12px;
    box-shadow:var(--shadow);
    padding:22px;
    min-height:320px;
  }

  /* ---- controls ---- */
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  input[type=text], input[type=number], select, textarea{
    font-family:'Public Sans', sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  textarea{width:100%; resize:vertical; font-size:14px; line-height:1.5;}
  label{font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:4px;}
  .field{display:flex; flex-direction:column; gap:2px;}

  button{
    font-family:'Public Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--herb-dark);
    background:var(--herb);
    color:#fdfaf0;
    cursor:pointer;
  }
  button:hover{background:var(--herb-dark);}
  button.ghost{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  button.ghost:hover{background:var(--herb-pale); border-color:var(--herb);}
  button.danger{background:var(--tomato); border-color:#8f3a20;}
  button.danger:hover{background:#8f3a20;}
  button.small{padding:5px 10px; font-size:12px;}

  /* ---- recipe list ---- */
  .toolbar{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .search{flex:1; min-width:180px;}
  .search input{width:100%;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .big{font-family:'Fraunces', serif; font-size:20px; color:var(--ink); margin-bottom:6px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}

  .recipe-card{
    background:#fff;
    border:1px solid var(--card-edge);
    border-radius:4px 12px 12px 12px;
    padding:14px 14px 12px;
    position:relative;
    cursor:pointer;
    border-top-width:6px;
  }
  .recipe-card:hover{ border-color: var(--herb); }
  .recipe-card h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:0 0 4px; line-height:1.25;
  }
  .meta-line{font-size:12px; color:var(--ink-soft); display:flex; gap:10px; margin-bottom:8px;}
  .tags{display:flex; gap:5px; flex-wrap:wrap;}
  .pill{
    font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600;
    background:var(--herb-pale); color:var(--herb-dark);
  }

  .tag-herb{border-top-color:var(--herb);}
  .tag-tomato{border-top-color:var(--tomato);}
  .tag-mustard{border-top-color:var(--mustard);}
  .tag-plum{border-top-color:var(--plum);}
  .tag-gray{border-top-color:var(--ink-soft);}

  /* ---- recipe form / detail ---- */
  .card-title-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .form-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin-bottom:14px;}
  .ing-row{display:grid; grid-template-columns:70px 70px 1fr 32px; gap:8px; margin-bottom:6px; align-items:center;}
  .step-row{display:grid; grid-template-columns:28px 1fr 32px; gap:8px; margin-bottom:6px; align-items:start;}
  .step-num{
    width:28px;height:28px;border-radius:50%;background:var(--chalk);color:var(--chalk-text);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-top:3px;
  }
  .icon-btn{
    background:transparent;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;
  }
  .icon-btn:hover{color:var(--tomato);}
  .section-label{font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin:18px 0 8px;}

  .detail-ing{display:grid; grid-template-columns:90px 1fr; gap:4px 12px; font-size:14px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .qty{font-family:'IBM Plex Mono', monospace; font-weight:500; color:var(--herb-dark);}
  .detail-steps{margin:0; padding-left:0; list-style:none; counter-reset:step;}
  .detail-steps li{counter-increment:step; padding:8px 0 8px 34px; position:relative; font-size:14px; line-height:1.55; border-bottom:1px solid var(--line);}
  .detail-steps li:last-child{border-bottom:none;}
  .detail-steps li::before{
    content:counter(step); position:absolute; left:0; top:8px;
    width:22px;height:22px;border-radius:50%;background:var(--herb-pale);color:var(--herb-dark);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }

  /* ---- weekly menu ---- */
  .week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:20px;}
  .day-card{
    background:#fff; border:1px solid var(--card-edge); border-radius:8px; padding:10px 8px; min-height:120px;
    display:flex; flex-direction:column; gap:6px;
  }
  .day-label{font-family:'Fraunces', serif; font-weight:600; font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}
  .day-slots{display:flex; flex-direction:column; gap:6px;}
  .day-slot{display:flex; align-items:center; gap:4px;}
  .day-slot select{flex:1; min-width:0;}
  .day-select{width:100%; font-size:12px; padding:6px 6px;}
  .day-recipe{font-size:13px; font-weight:600; line-height:1.3; flex:1;}
  .day-recipe .meta{font-size:11px; color:var(--ink-soft); font-weight:400; margin-top:2px;}
  .add-slot{align-self:flex-start; margin-top:2px;}

  /* ---- shopping list ---- */
  .notepad{
    background:#fffef8; border:1px solid var(--card-edge); border-radius:4px;
    padding:6px 0;
  }
  .list-item{
    display:flex; align-items:center; gap:10px; padding:9px 16px;
    border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item.checked .item-name{text-decoration:line-through; color:var(--ink-soft);}
  .list-item input[type=checkbox]{width:17px; height:17px; accent-color:var(--herb);}
  .item-name{flex:1;}
  .item-amt{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft); min-width:70px; text-align:right;}
  .item-src{font-size:11px; color:var(--ink-soft); font-style:italic;}
  .section-head{
    font-family:'Fraunces', serif; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--herb-dark); padding:12px 16px 6px;
  }

  .modal-bg{
    position:fixed; inset:0; background:rgba(43,38,32,0.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card); border-radius:14px; max-width:640px; width:100%;
    max-height:85vh; overflow-y:auto; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }

  @media (max-width:640px){
    .week-strip{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Recipe box</h1>
      <div class="tagline">Keep what works. Plan the week. Shop once.</div>
    </div>
  </header>

  <nav>
    <div class="tab active" data-tab="recipes">Recipes</div>
    <div class="tab" data-tab="menu">This week</div>
    <div class="tab" data-tab="shopping">Shopping list</div>
  </nav>

  <div class="panel" id="panel-recipes"></div>
  <div class="panel" id="panel-menu" style="display:none;"></div>
  <div class="panel" id="panel-shopping" style="display:none;"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
const IMPORTED_RECIPES = [{"title": "Lemon chicken and potatoes", "servings": 6, "time": "1hour 10minutes", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "lbs", "name": "(1.36 kg) chicken thighs, bone in + skin on"}, {"amount": "2", "unit": "lbs", "name": "(0.91 kg) Yukon Gold potatoes"}, {"amount": "3/4", "unit": "cup", "name": "(177.44 ml) olive oil"}, {"amount": "2", "unit": "", "name": "medium lemons, juiced"}, {"amount": "4", "unit": "", "name": "large cloves garlic, minced"}, {"amount": "1½", "unit": "tsp", "name": "dried oregano"}, {"amount": "1", "unit": "tsp", "name": "dried thyme"}, {"amount": "1/2", "unit": "tsp", "name": "chilli pepper flakes"}, {"amount": "1/2", "unit": "tsp", "name": "paprika"}, {"amount": "2½", "unit": "tsp", "name": "salt"}, {"amount": "1/2", "unit": "tsp", "name": "black pepper"}], "steps": ["Preheat your oven to 450 F.", "Rinse and pat dry your chicken pieces.", "Peel and slice your potatoes into quarters.", "In a large bowl, toss to coat the chicken, potatoes, oil, lemon juice and spices listed. Transfer this into a 13×9\" baking dish, making sure the chicken pieces are touching the bottom of the pan. The potatoes can be in between and on top. Sprinkle everything with paprika. Cover the pan with parchment first and then aluminium foil tightly. Roast for 45 minutes.", "Uncover the pan and roast for another 15 minutes or until the chicken and potatoes get a nice brown, crispy, and golden brown exterior. The internal temperature of chicken should read 165 F.", "Do NOT forget to spoon the sauce from the bottom of the pan over your food when you serve it -- it's the best part!"], "notes": "Optional: Garnish with fresh chopped oregano and lemon slices. You can also use bone-in, skin-on chicken legs or a whole chicken (parts separated). Any potatoes will work, but I prefer Yukon Gold potatoes here."}, {"title": "Lemon parm chicken meatballs", "servings": 4, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "1", "unit": "pound", "name": "ground turkey or chicken"}, {"amount": "1/2", "unit": "cup", "name": "grated Parmesan"}, {"amount": "1/3", "unit": "cup", "name": "panko breadcrumbs"}, {"amount": "1", "unit": "", "name": "small shallot, minced"}, {"amount": "1", "unit": "", "name": "egg, lightly beaten"}, {"amount": "2", "unit": "", "name": "garlic cloves, grated"}, {"amount": "", "unit": "", "name": "Zest of 1 lemon"}, {"amount": "2", "unit": "tsp", "name": "fresh thyme leaves (or 1 teaspoon dried)"}, {"amount": "1", "unit": "tsp", "name": "salt"}, {"amount": "", "unit": "Pinch", "name": "red pepper flakes"}, {"amount": "", "unit": "", "name": "Olive oil, for drizzling"}, {"amount": "", "unit": "", "name": "Optional for serving: 2 cups arugula, more Parmesan cheese, lemon wedges"}], "steps": ["Preheat the oven to 375°F. Line a rimmed baking sheet with parchment paper.", "In a large bowl, mix 1 pound ground turkey, 1/2 cup parmesan, 1/3 cup panko, 1 small minced shallot, 1 egg, lightly beaten, 2 minced garlic cloves, the zest from one lemon, 2 teaspoons fresh thyme leaves, 1 teaspoon salt, and a pinch of red pepper flakes with your hands until just combined. Don't over-mix or they'll be tough!", "Gently roll turkey mixture into 8 to 10 meatballs and place on the lined baking sheet. The meat mixture will be very wet and sticky, that is correct! If it's sticking to your hands too much to make it possible to roll out the meatballs, wet your hands as you go. Drizzle a small amount of olive oil over the top of each meatball.", "Place the baking sheet in the oven for 15 to 20 minutes, or until the internal meatball temp is 160°F.", "Serve with arugula, more parmesan cheese, and lemon wedges.", "Notes: This is a great turkey burger mixture. 1 pound of meat = 4 burgers. Make the patties very thin, and cook them in 1 tablespoon of oil in a nonstick skillet over medium-high heat for 4 minutes per side. ## ##"], "notes": "Turkey---\\> ground chicken or turkey can be used interchangeably here. Beef is not a good sub. Parmesan---\\> any hard, grated cheese. Cheddar, manchego, Gouda, pecorino romano... Shallot---\\> 1/4 cup minced yellow onion. Egg---\\> you can make a flax egg, but an egg really helps keep these meatballs moist\\~ Garlic---\\> 1/2 teaspoon garlic powder. Lemon zest---\\> omit. Fresh thyme leaves---\\> 1 teaspoon dried thyme leaves, dried oregano, dried parsley, etc. Red pepper flakes---\\> omit if you don't like heat, or use a TINY bit of cayenne or chilli powder if you do like heat. Olive oil---\\> any neutral-flavoured cooking oil will work. Arugula---\\> this is basically just to make the meatballs look pretty and give them a simple green. Spinach or any green works instead."}, {"title": "Sheet pan honey mustard chicken with broccoli", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "½", "unit": "cup", "name": "/120 grams Dijon mustard"}, {"amount": "½", "unit": "cup", "name": "/165 grams honey"}, {"amount": "", "unit": "", "name": "Salt and pepper"}, {"amount": "1½", "unit": "pounds", "name": "broccoli (about 2 broccoli heads)"}, {"amount": "2", "unit": "pounds", "name": "boneless, skinless chicken thighs, each sliced into three even"}, {"amount": "", "unit": "", "name": "pieces"}, {"amount": "¼", "unit": "cup", "name": "extra-virgin olive oil"}], "steps": ["Heat the oven to 425 degrees. Place a large sheet pan in the oven.", "In a large mixing bowl, whisk together the mustard and honey until combined. Season with salt and a few cracks of black pepper. Reserve ¼ cup of honey mustard for serving and 3 tablespoons for brushing.", "Trim the broccoli florets into bite-sized pieces. Using a vegetable peeler, peel the outer layer of the broccoli stalks, trim the ends, then cut the rest of stalks into ½-inch-thick slices.", "Add the broccoli florets, sliced broccoli stalks and chicken to the bowl of honey mustard. Stir until evenly coated.", "Carefully remove the pan from the oven and evenly drizzle the oil on top. Arrange the broccoli and chicken in an even layer and drizzle any remaining honey mustard from the bowl on top. Lightly season the broccoli and chicken with salt. Cover tightly with aluminium foil and bake for 25 minutes.", "Remove the foil; brush the 3 reserved marinade on top of chicken and broccoli.", "Place an oven rack underneath the broiler. Set the broiler to high. Place the chicken and broccoli back in the oven. Broil for 5 minutes, until the chicken and broccoli develop char marks on their surface and the chicken cooks through (a thermometer in thickest part of a thigh should read 165F).", "Serve with reserved honey mustard on the side."], "notes": "The broccoli florets and stems are separated, and the stems are peeled and sliced into thin coins, which helps them cook at the same rate as the other ingredients. To ensure perfectly tender broccoli, the sheet pan gets tightly wrapped in aluminium foil to trap in steam. Once the chicken and broccoli are partially cooked, uncover, then douse in more honey mustard. This second round of sauce gets charred, sticky and caramelised under the broiler. Substitute some of the olive oil with toasted sesame oil and top with toasted sesame seeds for a nuttier flavor; replace some of the honey with hot honey; or top with lemon zest and juice at the end."}, {"title": "Coconut chicken curry", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "2½", "unit": "pounds", "name": "boneless, skinless chicken thighs"}, {"amount": "1", "unit": "tablespoon", "name": "ground paprika"}, {"amount": "½", "unit": "teaspoon", "name": "ground turmeric"}, {"amount": "2", "unit": "teaspoons", "name": "kosher salt, plus more as needed"}, {"amount": "⅓", "unit": "cup", "name": "canola oil"}, {"amount": "2", "unit": "", "name": "yellow onions, finely diced"}, {"amount": "4", "unit": "", "name": "garlic cloves, minced"}, {"amount": "1", "unit": "", "name": "(13-ounce) can of unsweetened coconut milk"}, {"amount": "1½", "unit": "tablespoons", "name": "fish sauce, plus more as needed"}, {"amount": "1", "unit": "teaspoon", "name": "Madras curry powder"}, {"amount": "½", "unit": "teaspoon", "name": "ground cayenne"}, {"amount": "", "unit": "", "name": "Cooked rice or noodles for serving"}, {"amount": "1", "unit": "cup", "name": "cilantro sprigs, for serving"}, {"amount": "1", "unit": "", "name": "lime or lemon, cut into wedges, for serving"}], "steps": ["Trim the chicken thighs of excess fat and cut into ½- to 1-inch pieces; transfer to a bowl. Add the paprika, turmeric and salt, and use your hands to mix well. Let the chicken marinate at room temperature while you prepare the other ingredients, or cover and refrigerate overnight.", "In a large pot, heat the oil over medium-high heat. Stir in the onions, lower the heat to medium-low and cook gently, stirring often to prevent scorching, until tender and translucent, 8 to 10 minutes. Add the garlic and continue to cook, stirring often, until most of the water from the onions has been cooked out and a glossy layer of oil has risen to the surface, about 5 minutes more.", "Add the marinated chicken and stir to release the spices into the onion. Pour in the coconut milk and bring to a near boil. Let the coconut milk simmer briskly for about 4 minutes to thicken a bit. Lower the heat to medium-low and add the fish sauce. Stir in 1 1⁄2 cups of water and bring to a near boil. The broth will thin out as the chicken starts to release its juices.", "Lower to a gentle simmer and cook, stirring occasionally, until the chicken is tender, 30 to 45 minutes. Droplets of paprika-red oil will rise to the surface. Stir in the curry powder and cayenne, simmer briefly and remove from the heat.", "If time permits, let the curry sit for at least 20 minutes before serving. This allows the chicken to soak in more flavors as the curry cools. Bring to a simmer again right before serving and taste, adding more salt or fish sauce if desired. Serve over rice or noodles, with bowls of cilantro and lime wedges."], "notes": "Curry powder is stirred into this braise only during the last minute of cooking, delivering a bright hit of spice on top of the paprika and turmeric mellowed into the slow-simmered chicken. This dish needs time on the stove but not much attention, and gets even better after resting in the fridge, making it an ideal weeknight meal that can last days."}, {"title": "Sheet-pan chicken with sweet potatoes and peppers", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "tablespoons", "name": "apple cider vinegar"}, {"amount": "1½", "unit": "teaspoons", "name": "honey"}, {"amount": "1", "unit": "", "name": "medium red onion, thinly sliced"}, {"amount": "1½", "unit": "teaspoons", "name": "kosher salt, more as needed"}, {"amount": "1 to 2", "unit": "cloves", "name": "garlic, grated or minced"}, {"amount": "1", "unit": "teaspoon", "name": "ground coriander chicken"}, {"amount": "½", "unit": "teaspoon", "name": "freshly ground black pepper"}, {"amount": "2", "unit": "pounds", "name": "bone-in, skin-on chicken thighs (4 to 6 thighs)"}, {"amount": "2½", "unit": "tablespoons", "name": "extra-virgin olive oil"}, {"amount": "12", "unit": "ounces", "name": "sweet potato (1 large), peeled and cut into ½-inch cubes"}, {"amount": "1", "unit": "", "name": "large red, yellow or orange bell pepper, thinly sliced"}, {"amount": "1½", "unit": "tablespoons", "name": "finely chopped fresh sage"}, {"amount": "¾", "unit": "teaspoon", "name": "sweet paprika"}, {"amount": "⅛", "unit": "teaspoon", "name": "cayenne"}, {"amount": "⅛", "unit": "teaspoon", "name": "ground allspice"}, {"amount": "", "unit": "", "name": "Cilantro leaves, for serving"}], "steps": ["In a small, shallow bowl, mix together vinegar and honey. Mix in half the red onion and a pinch of salt and set aside for garnish, tossing the mixture occasionally as the chicken cooks.", "In a large bowl, mix together 1 teaspoon salt, garlic, coriander and black pepper. Add chicken to the bowl and rub the mixture all over it. Let marinate for 30 minutes.", "Heat the oven to 425 degrees. In a large bowl, toss together 2 tablespoons oil, sweet potato, pepper, remaining onion, sage, remaining ½ teaspoon salt, paprika, cayenne and allspice. Spread vegetables out on a rimmed baking sheet.", "Add the remaining ½ tablespoon of oil to the marinated chicken and turn to coat. Place chicken pieces, skin-side up, among the vegetables, making sure chicken is surrounded by them, but not on top of them. (Chicken should rest directly on the baking sheet.)", "Roast for 15 minutes. Remove the pan from the oven and raise the heat to 450 degrees. Use a wide spatula to flip vegetables over (but not chicken). Drizzle chicken (but not vegetables) with 2 teaspoons of liquid from the onion-vinegar mixture. Roast until chicken is cooked through, 15 to 20 minutes longer.", "Top chicken and vegetables with a spoonful of onion-vinegar mixture and cilantro leaves."], "notes": "To counter the rich flavors, quick-pickled thinly sliced red onion adds a bright note at the end. If you prefer chicken breasts, choose bone-in, skin-on breasts and keep an eye on them. They'll cook faster. Remove them when ready, but let the vegetables roast until golden."}, {"title": "Pineapple-marinated chicken breasts", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "", "name": "packed tablespoons dark brown sugar"}, {"amount": "2", "unit": "tablespoons", "name": "rice vinegar"}, {"amount": "1", "unit": "tablespoon", "name": "soy sauce"}, {"amount": "1", "unit": "tablespoon", "name": "fish sauce"}, {"amount": "2", "unit": "tablespoons", "name": "olive oil, plus more for cooking"}, {"amount": "1", "unit": "teaspoon", "name": "kosher salt (Diamond Crystal)"}, {"amount": "1", "unit": "teaspoon", "name": "garlic powder"}, {"amount": "¼ to ½", "unit": "teaspoon", "name": "ground cayenne"}, {"amount": "½", "unit": "teaspoon", "name": "black pepper"}, {"amount": "1", "unit": "cup", "name": "diced fresh pineapple (½-inch chunks)"}, {"amount": "¼", "unit": "cup", "name": "finely diced red onion"}, {"amount": "2", "unit": "tablespoons", "name": "finely chopped fresh cilantro"}, {"amount": "2", "unit": "tablespoons", "name": "finely grated fresh pineapple, including accumulated juices"}, {"amount": "1½", "unit": "pounds", "name": "boneless, skinless chicken breasts, cut into 1½-inch chunks"}, {"amount": "", "unit": "", "name": "Cooked white rice for serving"}], "steps": ["In a large bowl, stir together the brown sugar, rice vinegar, soy sauce, fish sauce, 2 tablespoons olive oil, salt, garlic powder, ground cayenne and black pepper. Transfer 1 tablespoon of this marinade mixture to a separate medium bowl and add the diced pineapple, red onion and cilantro. This is your salsa; toss until well mixed and set aside.", "Add the grated pineapple and its juices to the marinade mixture in the large bowl, then add the chicken and toss to coat. Set aside to marinate at room temperature for 15 minutes (and no longer).", "Once the chicken is done marinating, heat a large nonstick skillet over medium-high heat and add enough olive oil to lightly coat the bottom of the pan. Add the chicken pieces, leaving any marinade behind, in a single layer so that they don't touch and let cook until the bottoms are browned, 2 to 3 minutes. Continue cooking, stirring occasionally, until browned on all sides and no longer pink on the inside, 4 to 5 minutes more.", "Serve the chicken over rice and top with the reserved pineapple salsa."], "notes": "Bromelain, the group of enzymes in fresh pineapple, is excellent at breaking down the connective tissues in thick, fibrous chicken breasts. In this simple marinade, grated pineapple completely alters the texture of the breast meat, resulting in something that's akin to luscious dark meat. Briefly marinating here is important: Leave it too long, and the chicken will fall apart during cooking. Fifteen minutes is the sweet spot. The accompanying pineapple salsa is a bright topping for the juicy morsels of aromatic chicken and rice."}, {"title": "Pressure cooker chicken tagine with butternut squash", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "2", "unit": "tablespoons", "name": "canola oil"}, {"amount": "1", "unit": "", "name": "large red onion, finely chopped"}, {"amount": "", "unit": "", "name": "Kosher salt"}, {"amount": "1", "unit": "", "name": "(4-inch) piece fresh ginger, peeled and minced (about ¼ cup)"}, {"amount": "6", "unit": "", "name": "large garlic cloves, chopped"}, {"amount": "", "unit": "", "name": "cinnamon stick"}, {"amount": "2", "unit": "teaspoons", "name": "sweet paprika"}, {"amount": "1", "unit": "teaspoon", "name": "ground turmeric"}, {"amount": "¾", "unit": "teaspoon", "name": "cumin"}, {"amount": "½", "unit": "teaspoon", "name": "hot smoked paprika"}, {"amount": "½", "unit": "teaspoon", "name": "ground ginger"}, {"amount": "¼", "unit": "teaspoon", "name": "ground cayenne"}, {"amount": "⅛", "unit": "teaspoon", "name": "ground cloves"}, {"amount": "", "unit": "", "name": "Black pepper"}, {"amount": "1", "unit": "tablespoon", "name": "tomato paste"}, {"amount": "1", "unit": "cup", "name": "chicken stock"}, {"amount": "¼", "unit": "cup", "name": "fresh lemon juice (from about 1 large lemon), plus more to taste"}, {"amount": "2", "unit": "pounds", "name": "boneless, skinless chicken thighs"}, {"amount": "8", "unit": "", "name": "dates, such as Medjool, pitted and halved"}, {"amount": "1", "unit": "", "name": "(2- to 2½-pound) butternut squash, peeled, halved lengthwise, seeded"}, {"amount": "", "unit": "", "name": "and cut into 1-by-3-inch wedges"}, {"amount": "1", "unit": "", "name": "small bunch flat-leaf parsley, chopped"}, {"amount": "4", "unit": "", "name": "scallions, thinly sliced"}, {"amount": "", "unit": "", "name": "Cooked couscous or pita for serving (optional)"}, {"amount": "", "unit": "", "name": "Plain yogurt, for topping (optional)"}, {"amount": "", "unit": "", "name": "Toasted almonds, for topping (optional)"}], "steps": ["Using the sauté setting, warm oil in the pot of a 6- to 8-quart pressure cooker. Add onion, season with salt, and cook, stirring occasionally, until the onion is softened and translucent, about 5 minutes. Add the fresh ginger and garlic and cook, stirring, until fragrant and softened, about 2 minutes. Add the cinnamon stick, sweet paprika, turmeric, cumin, smoked paprika, ground ginger, cayenne and cloves. Season generously with black pepper. Stir well.", "Add the tomato paste and stir until fully combined, fragrant and brick-red in colour, about 1 minute. Add the chicken stock and lemon juice, scraping any browned bits that have collected at the bottom of the pan. Turn off the heat. Add the chicken and the dates and stir to combine. Place the butternut squash wedges on top and season them generously with salt and pepper. Close the lid and cook on high pressure for 16 minutes.", "Let pressure release naturally for 10 min, then release the remaining pressure manually. Open the lid, add the parsley and scallions and gently fold everything together. (The butternut squash will fall apart slightly to thicken the sauce.) Taste and add lemon juice and salt, if necessary. Serve with couscous or pita and top with yogurt and toasted almonds, if desired. ##"], "notes": "This warmly spiced stew is inspired by a Moroccan tagine. The word tagine describes both the clay pot traditionally used to cook the dish and the dish itself. This simplified version combines chicken with dates, which mostly disappear into the stew, imparting a honeyed sweetness. Butternut squash wedges steam on top as the chicken cooks, then get stirred in at the end, thickening the sauce."}, {"title": "Pressure cooker coconut curry chicken", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "", "name": "to 4ripe tomatoes, halved through their equators"}, {"amount": "3", "unit": "tablespoons", "name": "ghee, unsalted butter or safflower oil"}, {"amount": "3", "unit": "tablespoons", "name": "virgin coconut oil"}, {"amount": "2", "unit": "cups", "name": "finely chopped onions"}, {"amount": "6", "unit": "", "name": "garlic cloves, grated on a Microplane or minced"}, {"amount": "2", "unit": "tablespoons", "name": "grated peeled fresh ginger"}, {"amount": "1", "unit": "teaspoon", "name": "cumin seeds"}, {"amount": "", "unit": "", "name": "13-inch cinnamon stick or ½ teaspoon ground cinnamon"}, {"amount": "8", "unit": "", "name": "cardamom pods, lightly crushed, or 1 teaspoon ground cardamom"}, {"amount": "2", "unit": "teaspoons", "name": "ground coriander"}, {"amount": "1", "unit": "tablespoon", "name": "kosher salt"}, {"amount": "1", "unit": "teaspoon", "name": "ground turmeric"}, {"amount": "¼", "unit": "teaspoon", "name": "crushed red pepper flakes"}, {"amount": "¼", "unit": "teaspoon", "name": "black pepper"}, {"amount": "2½", "unit": "pounds", "name": "boneless, skinless chicken thighs, cut into 1-inch chunks"}, {"amount": "1 to 2", "unit": "teaspoons", "name": "garam masala, to taste"}, {"amount": "½", "unit": "cup", "name": "canned unsweetened coconut milk"}, {"amount": "", "unit": "", "name": "Cooked basmati rice, for serving (optional)"}, {"amount": "", "unit": "", "name": "Plain yogurt, for serving (optional)"}, {"amount": "3", "unit": "tablespoons", "name": "finely chopped fresh cilantro, for garnish"}], "steps": ["Set a box grater over a bowl. Starting with their cut sides, grate tomatoes through the large holes of the box grater. Discard the skins. Measure 2 cups of tomato purée. Or just mash canned tomatoes", "Using the sauté function, heat the ghee and the coconut oil in the pressure cooker. Stir in the onions and cook, stirring often to encourage even browning, until they are caramelized, 12 to 18 minutes. Stir in the garlic, ginger and cumin seeds; cook until fragrant, about 2 minutes. Stir in the cinnamon and cardamom and cook for another minute. Then stir in the coriander, salt, turmeric, red pepper flakes, black pepper and finally the tomato purée.", "Add the chicken to the sauce, cover and cook on low pressure for 4 minutes. Let the pressure release naturally. If the sauce seems too thin, use a slotted spoon to transfer the chicken to a bowl and then simmer the sauce on the sauté setting until it has thickened to taste. (Note that the coconut milk will thin the sauce down further.) Stir in the garam masala and coconut milk, and let the curry sit for 20 minutes for the flavors to meld. Serve with the rice and yogurt, if desired. Garnish with cilantro."], "notes": "The highly spiced coconut sauce here is so good, you'll want to slather it on anything! And it's an adaptable medium for cooking other proteins (cubes of lamb, fish fillets, chunks of pork). For boneless chicken breasts to thighs, use them here, pressure-cooking them for 2 minutes instead of 4. Tell your guests to be aware of the cardamom pods so they don't accidentally bite into one, or use ground cardamom. And brands of garam masala vary in terms of their chile content. If you're unsure how hot your mix is, add it gradually tasting as you go. For a slow cooker, cook on high for 2-3 hrs or low for 4-5 hrs; add coconut milk during the last hour. To serve:"}, {"title": "Chicken with jammy tomatoes and pancetta", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "1½", "unit": "pounds", "name": "boneless, skinless chicken thighs"}, {"amount": "½", "unit": "teaspoon", "name": "kosher salt, plus more as needed"}, {"amount": "9", "unit": "", "name": "whole unpeeled garlic cloves"}, {"amount": "2", "unit": "tablespoons", "name": "extra-virgin olive oil, plus more for drizzling"}, {"amount": "1½", "unit": "tablespoons", "name": "fresh lemon juice, plus more for serving"}, {"amount": "1", "unit": "tablespoon", "name": "sweet or smoked paprika"}, {"amount": "1", "unit": "teaspoon", "name": "dried oregano"}, {"amount": "1", "unit": "teaspoon", "name": "brown sugar (optional)"}, {"amount": "¾", "unit": "teaspoon", "name": "ground cumin"}, {"amount": "1", "unit": "", "name": "pint cherry tomatoes (preferably different colors), halved"}, {"amount": "2", "unit": "ounces", "name": "diced pancetta or bacon"}, {"amount": "¼", "unit": "cup", "name": "torn fresh dill, parsley or other herbs, for serving"}, {"amount": "", "unit": "", "name": "Freshly ground black pepper"}], "steps": ["Heat the oven to 425 degrees. Season chicken all over with salt, and place on a rimmed baking sheet.", "Smash all the garlic cloves with the side of a knife and peel them. Finely grate one garlic clove and put it in a small bowl. Stir in the 2 tablespoons olive oil, 1½ tablespoons lemon juice, paprika, oregano, brown sugar (if using) and cumin. Pour over chicken, tossing to coat.", "Add tomatoes and remaining smashed, peeled garlic cloves to baking sheet, spreading them out around the chicken. Season tomatoes lightly with salt and drizzle with a little more olive oil. Scatter pancetta on top.", "Roast until chicken is golden and cooked through, about 30 to 35 minutes. After 15 minutes, stir the tomatoes and pancetta, but don't disturb the chicken.", "Transfer chicken to plates. Stir the tomatoes and pancetta around in the pan, scraping up all the delicious browned bits from the bottom and sides, and stir in the herbs and black pepper to taste. Taste and add salt, if needed, and a squeeze of fresh lemon juice, if you like. Spoon tomatoes, garlic and pancetta over the chicken to serve."], "notes": "In this relatively speedy sheet-pan dinner, boneless, skinless chicken thighs are seasoned with a savory, cumin-scented spice mix and roasted with whole garlic cloves and cherry tomatoes, which turn soft and sweet in the oven's heat. If you have ripe summer cherry tomatoes, you can skip the brown sugar. If you'd rather use boneless chicken breasts, reduce the cooking time by about 5 to 7 minutes. This makes a light meal on its own, but you can add rice or crusty bread, and maybe a salad, if you need something more substantial."}, {"title": "Chile-roasted chicken with honey, lemon and feta", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "pounds", "name": "bone-in, skin-on chicken thighs and drumsticks (to substitute"}, {"amount": "", "unit": "", "name": "breasts, see Tip)"}, {"amount": "", "unit": "", "name": "Salt and black pepper"}, {"amount": "2", "unit": "", "name": "large garlic cloves, finely grated or crushed to a paste"}, {"amount": "1", "unit": "tablespoon", "name": "honey"}, {"amount": "1", "unit": "tablespoon", "name": "extra-virgin olive oil, plus more for drizzling"}, {"amount": "¼", "unit": "teaspoon", "name": "red-pepper flakes, plus more for serving"}, {"amount": "2", "unit": "", "name": "fresh rosemary sprigs"}, {"amount": "1", "unit": "", "name": "lemon, preferably a Meyer lemon, thinly sliced and seeded"}, {"amount": "2", "unit": "ounces", "name": "feta, crumbled into large pieces (a heaping ½ cup)"}, {"amount": "", "unit": "", "name": "Chopped mint, dill or parsley, for serving"}], "steps": ["Season chicken all over with salt and pepper. In a large bowl, mix together garlic, honey, olive oil and ¼ teaspoon red-pepper flakes. Add chicken and toss well with your hands, spreading the garlic paste all over the chicken pieces. (Don't worry if the honey is a little clumpy.) Add rosemary sprigs and lemon slices and toss to combine. Let marinate at room temperature for 30 minutes, or up to 8 hours in the refrigerator.", "Heat the oven to 425 degrees. Line a sheet pan with a silicone liner or parchment paper.", "Spread chicken and lemons across a single layer in the lined pan, tucking in the rosemary sprigs. Drizzle oil generously over everything. Roast for 20 minutes.", "Using tongs, turn over the chicken pieces, and give the lemons a stir. Sprinkle feta on top. Continue to bake for 20 to 25 minutes longer, until the chicken is deeply bronzed and cooked through, and an instant-read thermometer inserted into the thickest part of the thigh or drumstick registers 165 degrees. Serve garnished with chopped herbs and more red-pepper flakes, if you like. TIP To substitute white meat, use bone-in, skin-on breasts and roast them for 25 to 30 minutes. Add the feta at the beginning and do not turn the chicken."], "notes": "A little sweet, spicy and citrusy, this easy chicken recipe hits all the right notes, making it the kind of weeknight dinner you'll put on repeat. The feta adds a creamy, salty bite that's softened by the lemon and honey, while rosemary and red-pepper flakes round out the flavors. Serve this with a loaf of crusty bread or flatbread for scooping up all the tangy pan juices. You won't want to leave a drop behind."}, {"title": "Slow-cooker butter chicken", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "3", "unit": "tablespoons", "name": "vegetable oil"}, {"amount": "1", "unit": "", "name": "medium yellow onion, diced"}, {"amount": "3", "unit": "cloves", "name": "garlic, finely chopped"}, {"amount": "3", "unit": "tablespoons", "name": "grated ginger"}, {"amount": "1", "unit": "tablespoon", "name": "garam masala"}, {"amount": "16-", "unit": "ounce", "name": "can of tomato paste"}, {"amount": "¾", "unit": "teaspoon", "name": "kosher salt"}, {"amount": "3", "unit": "pounds", "name": "boneless, skinless chicken thighs or breasts, cut into 2-inch"}, {"amount": "", "unit": "", "name": "pieces"}, {"amount": "1", "unit": "teaspoon", "name": "lime zest"}, {"amount": "1", "unit": "tablespoon", "name": "lime juice"}, {"amount": "1", "unit": "cup", "name": "coconut milk (if necessary, whisk to combine the liquid and solids"}, {"amount": "", "unit": "", "name": "before measuring)"}, {"amount": "½", "unit": "cup", "name": "chicken stock"}, {"amount": "¼", "unit": "cup", "name": "cilantro leaves, for garnish (optional)"}, {"amount": "", "unit": "", "name": "Cooked basmati or jasmine rice, for serving"}, {"amount": "", "unit": "", "name": "Naan, for serving (optional)"}], "steps": ["In a medium skillet, heat oil over medium-high heat. Add onions to skillet, and cook until softened, about 3 minutes. Reduce heat to medium, add garlic and ginger, and cook for another 2 minutes. Add garam masala, tomato paste and salt; cook and stir for 2 minutes.", "Place chicken pieces in a slow cooker, then add tomato paste mixture, lime zest and juice, coconut milk and chicken stock. Stir everything together, cover and cook on low heat for 4½ to 5 hours, until the chicken is cooked through. (You may let it cook for up to 7 hours if necessary, but the chicken may be very soft and shredded.) Garnish with cilantro and serve with basmati or jasmine rice, and naan if you have some."], "notes": "Not every version of butter chicken uses butter. Coconut milk gives this slow-cooker chicken its creamy richness. This is a fast recipe for the cook: Just prep it earlier in the day, even during your morning routine, getting your onion and spices going on the stove while simultaneously making lunches for grumpy children, folding dish towels, feeding the dogs and wondering once again why no one else has done any of the above. If you're preparing pork or beef in the slow cooker, you'll want to brown the meat first, but that's not necessary with boneless cuts of chicken. The meat will be cooked within 4 1⁄2 or 5 hours, but if you need to let it sit a little longer --- up to 7 hours total, on low heat --- it will still be delicious, though the chicken may be very soft and shredded a tad."}, {"title": "Broccoli stir-fry with chicken", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "2", "unit": "tablespoons", "name": "good-quality vegetable oil"}, {"amount": "2", "unit": "tablespoons", "name": "minced garlic"}, {"amount": "1", "unit": "tablespoon", "name": "minced fresh ginger"}, {"amount": "4", "unit": "", "name": "scallions, chopped"}, {"amount": "1", "unit": "pound", "name": "broccoli, trimmed and cut into bite-size pieces, the stems no"}, {"amount": "", "unit": "", "name": "more than ¼-inch thick"}, {"amount": "", "unit": "", "name": "Salt"}, {"amount": "1", "unit": "cup", "name": "water"}, {"amount": "8", "unit": "ounces", "name": "boneless, skinless chicken breasts or thighs, cut into ½- to"}, {"amount": "", "unit": "", "name": "¾-inch chunks or thin slices and blotted dry"}, {"amount": "2", "unit": "tablespoons", "name": "soy sauce"}, {"amount": "", "unit": "", "name": "Freshly ground black pepper"}], "steps": ["Put a large, deep skillet over medium-high heat. When it's hot, add half the oil, swirl it around, and immediately add half the garlic and ginger. Cook for 15 seconds, stirring, then add the broccoli and all but a sprinkling of the scallions. Raise heat to high, and cook, stirring, until broccoli is bright green and beginning to brown, 3 to 5 minutes.", "Sprinkle with salt; add 1 cup water. Stir and cook until almost all liquid evaporates and broccoli is almost tender, another minute or two more, then transfer everything to a plate.", "Turn heat to medium, add remaining oil, then remaining garlic and ginger. Stir, then add chicken and turn heat to high. Cook, stirring occasionally, until chicken has lost its pink color, three to five minutes.", "Turn heat to medium. Return broccoli and juices to the pan, and stir. Add soy sauce, sprinkle with more salt and some pepper; add a little more water if the mixture is dry. Raise heat to high and cook, stirring occasionally, until liquid is reduced slightly and you've scraped up all the bits of chicken. Taste and adjust seasoning, garnish with remaining scallion."], "notes": "-   Stir-fries work with virtually any combination of vegetables; protein-dense food (meat, poultry, fish, tofu, etc.) is optional. -   Use pork (like shoulder), shrimp, beef (like sirloin), or tofu instead of chicken; slice the meat thinly or the tofu into cubes. -   Use cabbage, cauliflower, asparagus, green beans, snow peas, carrots or spinach in place of either the broccoli or the mushrooms or both. Or use other mushrooms. -   Use fish sauce instead of soy sauce and finish with lime to give it Asian flavour. -   Use olive oil, skip the ginger, use onion instead of scallion, and substitute 1 tablespoon chopped rosemary or thyme to give it a Mediterranean flavor profile. -   Use coconut milk instead of water and 1 tablespoon curry powder instead of soy sauce to give it an Indian flavor profile."}, {"title": "Chicken piccata", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "4", "unit": "", "name": "boneless, skinless chicken breasts (about 1½ pounds), halved"}, {"amount": "", "unit": "", "name": "horizontally (see tip)"}, {"amount": "", "unit": "", "name": "Kosher salt and black pepper"}, {"amount": "", "unit": "", "name": "All-purpose flour, for dredging"}, {"amount": "6", "unit": "tablespoons", "name": "unsalted butter"}, {"amount": "3", "unit": "tablespoons", "name": "extra-virgin olive oil, plus more as needed"}, {"amount": "1", "unit": "", "name": "shallot, peeled and sliced lengthwise"}, {"amount": "1", "unit": "", "name": "lemon, halved (half thinly sliced and seeds removed; half juiced, about"}, {"amount": "2", "unit": "tablespoons", "name": ")"}, {"amount": "¾", "unit": "cup", "name": "chicken stock"}, {"amount": "4", "unit": "teaspoons", "name": "drained capers"}, {"amount": "", "unit": "", "name": "Coarsely chopped fresh parsley, for garnish (optional)"}], "steps": ["Season both sides of the chicken with salt and pepper. Dredge the chicken in flour and shake off any excess.", "In a large skillet, heat 3 tablespoons butter and the olive oil over medium-high heat until the butter has melted. Working in batches to avoid crowding the pan, add the chicken and sauté until golden brown and cooked through, about 3 minutes per side.", "Remove the chicken, place on a plate and repeat with the remaining pieces, adding more olive oil if needed.", "Once the chicken is cooked, add the shallot and lemon slices to the pan and sauté, stirring occasionally, until lightly caramelized and fragrant, 2 to 3 minutes. Add the stock and simmer until reduced by half, about 3 minutes.", "Reduce the heat to low, then stir in the remaining 3 tablespoons butter, capers and lemon juice, to taste. Season with salt and pepper to taste. Serve the chicken with the sauce poured over the top. Garnish with parsley if desired. TIP: Freezing the chicken breasts for 15 minutes will make slicing them through the middle easier."], "notes": "Chicken piccata is an Italian-American staple beloved for its piquant flavors cradled in a silky, butter-rich pan sauce. It also doesn't hurt that it cooks up very quickly. This version is mostly traditional except that it uses lemon two ways, calling for lemon slices to be caramelized (to soften their tang) and for a hit of fresh juice at the end (to brighten the whole dish). This ensures a sauce that's neither too rich, nor too puckery. Serve with a starch --- pasta, polenta, rice or white beans --- for sopping up the sauce, and a green vegetable, such as a kale salad, broccoli or green beans."}, {"title": "Garlic-ginger chicken breasts with cilantro and mint", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "8", "unit": "", "name": "garlic cloves, minced"}, {"amount": "2", "unit": "tablespoons", "name": "minced fresh ginger"}, {"amount": "1", "unit": "tablespoon", "name": "finely chopped fresh mint leaves, plus more for garnish"}, {"amount": "1", "unit": "tablespoon", "name": "finely chopped fresh cilantro leaves, plus more for garnish"}, {"amount": "3", "unit": "tablespoons", "name": "fresh lemon juice (from 1 lemon)"}, {"amount": "3", "unit": "tablespoons", "name": "plus 1 teaspoon olive oil"}, {"amount": "1", "unit": "tablespoon", "name": "ground coriander"}, {"amount": "1", "unit": "teaspoon", "name": "ground turmeric"}, {"amount": "1", "unit": "teaspoon", "name": "amchur (dry mango powder), optional"}, {"amount": "½", "unit": "teaspoon", "name": "red chile powder, like ground cayenne"}, {"amount": "¾", "unit": "teaspoon", "name": "kosher salt"}, {"amount": "4", "unit": "", "name": "boneless, skinless chicken breasts (½ to ¾ pound each)"}], "steps": ["Make the marinade: Add the garlic, ginger, mint, cilantro, lemon juice and 3 tablespoons oil to a large resealable bag. Seal the bag and massage to combine the ingredients into a paste. Add the coriander, turmeric, amchur (if using), red chile powder and salt, and seal the bag. Shake or massage to combine.", "Place the chicken in the marinade and seal bag. Use your hands to massage the marinade onto the chicken breasts until each breast is coated. Refrigerate at least 2 hrs or overnight.", "Warm a large lidded skillet over medium-high heat. Once the pan is hot, add the oil, swirling the pan to coat the entire surface. Reduce heat to medium, remove the chicken from the marinade and shake gently to remove any excess marinade. Add it to the pan. Working in batches if necessary, cook the breasts, undisturbed, until lightly golden underneath, 1 to 2 min, then flip them and cook until lightly golden on the second side, 1 to 2 min.", "Reduce the heat to low, cover, cook the chicken for 10 min. Turn off the heat (if you have an electric stove, take the pan off the heat) and let the chicken sit, covered, for 10 to 15 minutes, depending on the thickness of the breasts. Don't lift the lid, or you'll release steam that's cooking the chicken.", "Check to make sure the breasts are cooked through: There shouldn't be any pink in the middle. If you have a meat thermometer, the chicken should register at least 165F. Place the chicken on a cutting board, slice each breast into strips. Garnish with mint and cilantro."], "notes": "This chicken, which is the brainchild of my aunt Sonia, is legendary among our cousins. Until recently, though, no one knew what, exactly, went into it. Whenever my aunt would make it on a family vacation, she'd disappear for a half-hour and reemerge with a Ziploc bag filled with the marinade and the chicken breasts. No one (not even her only daughter, Isha) was allowed to know the contents."}, {"title": "Freds' chicken salad with balsamic dressing", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "14-", "unit": "pound", "name": "chicken (or a store-bought rotisserie chicken, in which case"}, {"amount": "", "unit": "", "name": "skip to the dressing below)"}, {"amount": "1½", "unit": "tablespoons", "name": "salt"}, {"amount": "½", "unit": "bunch", "name": "fresh thyme"}, {"amount": "1", "unit": "", "name": "lemon, quartered"}, {"amount": "2", "unit": "cloves", "name": "garlic, peeled"}, {"amount": "1", "unit": "tablespoon", "name": "extra-virgin olive oil"}, {"amount": "1", "unit": "teaspoon", "name": "ground black pepper"}, {"amount": "¼", "unit": "cup", "name": "balsamic vinegar"}, {"amount": "¼", "unit": "cup", "name": "Dijon mustard"}, {"amount": "¼", "unit": "cup", "name": "soy sauce"}, {"amount": "2", "unit": "tablespoons", "name": "sugar (optional)"}, {"amount": "1", "unit": "teaspoon", "name": "kosher salt"}, {"amount": "½", "unit": "teaspoon", "name": "ground black pepper"}, {"amount": "1", "unit": "cup", "name": "extra-virgin olive oil"}, {"amount": "1", "unit": "cup", "name": "fresh pears, diced in 1-inch pieces"}, {"amount": "1", "unit": "tablespoon", "name": "lemon juice"}, {"amount": "4", "unit": "", "name": "large handfuls mixed greens, such as a boxed mix with fresh herbs"}, {"amount": "1", "unit": "cup", "name": "string beans cut in 1-inch pieces, blanched (from about ¼ pound"}, {"amount": "", "unit": "", "name": "beans; see note)"}, {"amount": "1", "unit": "cup", "name": "cherry tomatoes, halved"}, {"amount": "½", "unit": "cup", "name": "minced onion"}, {"amount": "2", "unit": "", "name": "ripe avocados, cut into 1-inch cubes"}], "steps": ["Roast the chicken (if you're using a cooked, store-bought chicken, skip this step): Heat oven to 350 degrees. Place a rack in a roasting pan. Rub 1 tablespoon salt around the inside of the cavity, then stuff it with the thyme, lemon and garlic. Tie the legs closed with cooking twine. Rub olive oil over the entire bird, and sprinkle with ½ tablespoon salt and black pepper. Place on the rack and roast for 72 to 80 minutes. After 72 minutes, begin testing for doneness by inserting a meat thermometer into the leg, close to the bone. The chicken is done when the thermometer reads 165 degrees. Remove from the oven and set aside to cool.", "When cool enough to handle, remove the skin from the chicken. Use your hands to remove all the meat (remember, it will be hotter internally) and shred into 2-inch strips. If you're not going to make the salad for a few hours, place the meat in the refrigerator, but be sure to remove it and let it come to room temperature for 30 to 45 minutes before serving, to bring out the best flavour.", "Make the dressing: Place all the ingredients except the oil in a food processor and pulse for about 30 seconds, until everything is combined. With the machine on low, slowly drizzle in the oil until the dressing is emulsified.", "Assemble the salad: Drizzle pears with lemon juice to prevent them from browning. In a large mixing bowl, combine pears, greens, beans, tomatoes, onion, avocado and half the chicken meat. Add some of the dressing and toss to make sure everything is lightly coated, adding more dressing if needed. Divide the mixture equally among 4 or 6 plates. Lay the rest of the chicken on top and serve immediately, passing the remaining dressing in case people want to add more."], "notes": "This salad is a perennial favorite at Freds, the glittery restaurant inside Barneys New York. The recipe calls for a whole roasted chicken, so you'll need to build in time to allow one to cool after roasting, or you can use leftovers or a store-bought rotisserie chicken instead. When prepping the vegetables and pear, make sure the pieces are more or less the same size. And remember to sprinkle the pear with lemon juice to keep it from discoloring. Cut the avocado just before serving. To blanch the string beans, bring a small saucepan filled with about 2 inches of water to a simmer. Add the cut beans and cook 1 to 2 minutes (less for crunchier beans), until bright green and just beginning to soften. Using a slotted spoon, transfer beans to a plate to cool."}, {"title": "Pressure cooker Chipotle-honey chicken tacos", "servings": null, "time": "", "tags": ["chicken"], "ingredients": [{"amount": "1½", "unit": "pounds", "name": "boneless, skinless chicken thighs"}, {"amount": "1", "unit": "", "name": "to 4canned chipotles in adobo, finely chopped, plus 2 tablespoons"}, {"amount": "", "unit": "", "name": "adobo sauce"}, {"amount": "3", "unit": "tablespoons", "name": "honey"}, {"amount": "1", "unit": "teaspoon", "name": "onion powder"}, {"amount": "1", "unit": "teaspoon", "name": "garlic powder"}, {"amount": "1", "unit": "teaspoon", "name": "kosher salt, plus additional as needed"}, {"amount": "½", "unit": "teaspoon", "name": "ground cumin"}, {"amount": "1", "unit": "", "name": "(15-ounce) can of black beans, rinsed and drained"}, {"amount": "1", "unit": "", "name": "lime, juiced"}, {"amount": "", "unit": "", "name": "Warmed tortillas for serving"}, {"amount": "", "unit": "", "name": "Pickled onion, for serving (see Tip)"}, {"amount": "", "unit": "", "name": "Sliced or cubed avocado, for serving"}], "steps": ["Combine the chicken, chipotles, adobo sauce, honey, onion powder, garlic powder, salt and cumin in an electric pressure cooker. Stir well. Cover and set the steam valve to a sealed position. Cook on high pressure for 13 minutes. Let the pressure release naturally for 5 minutes; then release the remaining pressure manually. Open the lid.", "Remove chicken to a bowl or cutting board using tongs. Shred the chicken with two forks. To reduce the sauce, set to sauté and simmer for 5 minutes. Add the chicken back to pot.", "Stir in the black beans and a squeeze of lime juice, set to sauté and let the beans warm through, 2 to 3 minutes. Taste and add more salt or lime juice if necessary. Serve in tortillas with pickled onions and avocado. TIP: To make quick-pickled onions, thinly slice a red onion and put the slices in a lidded heat-proof container. Bring about 1 1⁄2 cups cider or white vinegar to a boil. Add about 3 heaping spoonfuls of sugar and a big pinch of salt and whisk to dissolve. (You can also add a pinch of red pepper flakes, a bay leaf or some dried oregano, if you like.) Pour the hot vinegar over the onions and let them cool. They're ready to use right away or can be stored in the refrigerator for up to 2 weeks. # Fish"], "notes": "If you have an electric pressure cooker, you can throw together a big batch of spicy chicken and black bean tacos in about 30 minutes. Smoky canned chipotles in adobo and honey do most of the heavy lifting here, combining to create a glossy, spicy-sweet sauce. Chipotles can pack varying levels of heat, so if you want your tacos on the milder side, use only one or two peppers. You can always drizzle with hot sauce at the table. The pickled onions are not absolutely necessary, but they add acidity and crunch that contrast nicely with the spicy shredded chicken."}, {"title": "Red snapper en papillote", "servings": 2, "time": "30 minutes", "tags": ["fish"], "ingredients": [{"amount": "2", "unit": "", "name": "sheets of parchment paper, approximately 12 x 15 inches each"}, {"amount": "1", "unit": "cup", "name": "broccoli rabe or another bitter green"}, {"amount": "½", "unit": "cup", "name": "fennel, medium-sliced"}, {"amount": "2", "unit": "", "name": "red snapper fillets, 6--8 ounces each, skin removed"}, {"amount": "", "unit": "", "name": "Olive oil, for drizzling"}, {"amount": "", "unit": "", "name": "Sea salt, to taste"}, {"amount": "", "unit": "", "name": "Freshly ground black pepper, to taste"}, {"amount": "2", "unit": "tablespoons", "name": "chopped green olives"}, {"amount": "2", "unit": "tablespoons", "name": "capers"}, {"amount": "2", "unit": "", "name": "garlic cloves, thinly sliced"}, {"amount": "2", "unit": "tablespoons", "name": "sliced scallions"}, {"amount": "2", "unit": "tablespoons", "name": "julienned red bell pepper"}, {"amount": "¼", "unit": "cup", "name": "sliced mushrooms, optional"}, {"amount": "2", "unit": "", "name": "fennel fronds"}, {"amount": "4", "unit": "", "name": "lemon slices"}, {"amount": "1", "unit": "teaspoon", "name": "chopped fresh parsley, for serving"}], "steps": ["Heat the oven to 425°F (220°C).", "Place the two sheets of parchment paper side by side on a work surface.", "Divide the broccoli rabe between the two sheets, placing it on the lower half of each sheet so there is room to fold the parchment over.", "Place the sliced fennel on top of the broccoli rabe.", "Place one snapper fillet over each portion of vegetables. The vegetables will lift the fish slightly, allowing steam to circulate underneath.", "Drizzle the fish lightly with olive oil and season with salt and black pepper.", "Divide the olives, capers, garlic, scallions, red pepper, mushrooms, if using, and fennel fronds between the two fillets.", "Top each fillet with 2 lemon slices.", "Fold the top half of each parchment sheet over the fish.", "Starting at the edge nearest you, make a series of small, firm folds, creasing each one well so the packet stays closed.", "Fold in the ends as you would wrap a parcel, making triangular folds and continuing with small overlapping folds until the packet is fully sealed.", "Take care not to pierce the parchment, as the trapped steam is what cooks the fish.", "Place the packets on a baking sheet.", "Bake for about 15 minutes, depending on the thickness of the fish. The fish should be opaque and flake easily when tested.", "Transfer each packet to a plate and open carefully, allowing the steam to escape away from your face.", "Sprinkle with chopped parsley and serve immediately with your preferred side dishes."], "notes": "-   Another firm white fish may be substituted for red snapper. -   The cooking time will vary depending on the thickness of the fillets. -   Other fresh herbs or spices may be added before sealing the packets. -   Serve the fish directly in the parchment for the best presentation and aroma. ##"}, {"title": "Sheet-pan roasted salmon Niçoise salad", "servings": null, "time": "", "tags": ["fish"], "ingredients": [{"amount": "1", "unit": "pound", "name": "baby Yukon Gold potatoes, halved"}, {"amount": "8", "unit": "tablespoons", "name": "extra-virgin olive oil"}, {"amount": "2", "unit": "teaspoons", "name": "kosher salt, plus more to taste"}, {"amount": "1¼", "unit": "teaspoons", "name": "black pepper"}, {"amount": "2", "unit": "", "name": "large eggs"}, {"amount": "2", "unit": "tablespoons", "name": "red-wine vinegar"}, {"amount": "2", "unit": "teaspoons", "name": "Dijon mustard"}, {"amount": "1", "unit": "teaspoon", "name": "minced garlic (about 1 clove)"}, {"amount": "1", "unit": "", "name": "anchovy fillet, minced (optional)"}, {"amount": "6", "unit": "ounces", "name": "haricots verts or green beans, trimmed"}, {"amount": "1½", "unit": "cups", "name": "cherry tomatoes"}, {"amount": "½", "unit": "cup", "name": "pitted olives, preferably Niçoise or Kalamata"}, {"amount": "4", "unit": "", "name": "(6-ounce) center-cut, skin-on salmon fillets"}, {"amount": "5", "unit": "ounces", "name": "tender salad greens, like baby red and green leaf lettuce"}], "steps": ["Heat the oven to 400 degrees and place a rack near the top of the oven. Place the potatoes on a sheet pan, add 1 tablespoon olive oil, ½ teaspoon salt and ½ teaspoon pepper and toss. Arrange the potatoes so the cut sides are facing down and roast for 20 minutes.", "While the potatoes roast, fill a medium saucepan with water and bring to a boil. Add the eggs and cook over medium heat for exactly 6 minutes. Remove the eggs, and when they are cool enough to handle, peel and quarter them.", "Make the dressing: In a large bowl, whisk together vinegar, 1 teaspoon Dijon, garlic, anchovy (if using), ½ teaspoon salt, ½ teaspoon pepper. Slowly whisk in 4 tablespoons of olive oil and set aside.", "Add the haricots verts, tomatoes and olives to the sheet pan with the potatoes, along with 2 tablespoons olive oil and ½ teaspoon salt. Using tongs, toss well, then move the vegetables to the sides to create space in the center of the sheet pan. Pat the salmon fillets dry with a paper towel and place them, skin-side down, in the center of the sheet pan.", "Brush fillets with remaining 1 tablespoon olive oil and 1 teaspoon Dijon mustard, and sprinkle with ½ teaspoon salt and ¼ teaspoon pepper. Roast on the top rack in the oven for 10 minutes. Turn the broiler to high and broil for 2 to 3 minutes to lightly brown the salmon. (If you don't have a broiler, roast salmon for an additional 2 to 3 minutes instead.) Salmon should flake easily and be cooked in center.", "Add the greens to the large bowl with the dressing, and toss gently. Place greens on a large platter, leaving a narrow border at the platter's edges. Place the salmon fillets in the middle of the platter, then arrange the roasted vegetables and eggs around them. Sprinkle it with salt and serve."], "notes": ""}, {"title": "Green goddess salmon with potatoes and snap peas", "servings": null, "time": "", "tags": ["fish"], "ingredients": [{"amount": "", "unit": "", "name": "Yield:4 servings"}, {"amount": "1½", "unit": "pounds", "name": "small new or baby potatoes, halved or quartered if large"}, {"amount": "4", "unit": "tablespoons", "name": "olive oil"}, {"amount": "", "unit": "", "name": "Fine sea salt and black pepper"}, {"amount": "1", "unit": "", "name": "(1½-pound) piece skin-on center-cut salmon"}, {"amount": "1", "unit": "", "name": "packed cup parsley leaves"}, {"amount": "1", "unit": "", "name": "packed cup mixed herbs, such as chives, mint, dill, basil or cilantro"}, {"amount": "", "unit": "", "name": "plus a few sprigs of dill, for garnish"}, {"amount": "2", "unit": "", "name": "anchovy fillets"}, {"amount": "1", "unit": "", "name": "to 2garlic cloves"}, {"amount": "1", "unit": "", "name": "lemon, zested and halved"}, {"amount": "½", "unit": "cup", "name": "whole-milk yogurt"}, {"amount": "½", "unit": "cup", "name": "mayonnaise"}, {"amount": "8", "unit": "ounces", "name": "snap peas, trimmed and halved on the bias (about 2 cups)"}, {"amount": "4", "unit": "", "name": "small cucumbers, halved lengthwise and cut on the bias into 1-inch"}, {"amount": "", "unit": "", "name": "pieces (about 1 ¼ pounds)"}], "steps": ["Heat the broiler to high with the rack about 6 inches from the broiler. On a sheet pan lined with aluminium foil, toss the potatoes with 2 tablespoons oil, season with salt and pepper and spread out in an even layer. Broil until crispy and brown and just getting tender, about 10 minutes, turning with a spatula halfway through.", "Meanwhile, rub the remaining 2 tablespoons oil on both sides of the fish and season generously with salt and pepper. Remove the sheet pan from the oven, move the potatoes to the edges and nestle the fish between them, skin-side up. Broil until the skin is crispy, about 5 minutes. With a large spatula, flip the fish and continue to broil until the fish flakes easily but the center is still pink and glossy, 3 to 5 minutes. (If the potatoes are done after cooking the fish on the first side, pull them from the oven and transfer to a large serving bowl. If not, leave them until the fish is cooked to your desired doneness.)", "While the fish cooks, combine the parsley, mixed herbs, anchovy, garlic, lemon zest, yogurt and mayonnaise in a blender and purée until thick and uniformly green. Taste and season with salt and pepper as needed.", "Remove the fish and potatoes from the oven. Scrape the potatoes into a large bowl and toss with the snap peas and cucumbers; squeeze half the lemon over the top, season with salt and pepper and toss again. Cut the remaining lemon half into 4 wedges.", "Transfer the fish and vegetables to a platter and serve the dressing on the side; or divide the fish and vegetables among four plates and dollop with dressing. Sprinkle with dill and serve with lemon wedges."], "notes": "A sheet pan and a broiler are the secret to many easy weeknight meals. In this particularly vibrant dish, they impart a complex grill-like flavor to salmon and potatoes, which are broiled simultaneously on the same sheet pan. While they cook, you'll blend together a lively green goddess dressing of fresh herbs, yogurt, mayonnaise, garlic and anchovies. When the oven timer chimes, toss the roasted potatoes with raw cucumbers and snap peas. Serve alongside the just-flaky salmon and dollop with the verdant dressing. The crunchy vegetables, warm potatoes, tender fish and creamy dressing make for an unexpected though delightful combination. (For the dressing, tarragon, dill, parsley or cilantro will provide a familiar flavor to this classic sauce, but mint or arugula will work, too.)"}, {"title": "Tilapia with smoked paprika butter and broccoli in foil packets", "servings": null, "time": "", "tags": ["fish"], "ingredients": [{"amount": "4", "unit": "tablespoons", "name": "unsalted butter, at room temperature"}, {"amount": "1", "unit": "tablespoon", "name": "Spanish smoked paprika"}, {"amount": "", "unit": "", "name": "finely grated zest from 1 small lemon (reserving juice for broccoli)"}, {"amount": "1", "unit": "teaspoon", "name": "whole-grain or Dijon mustard"}, {"amount": "1/4", "unit": "teaspoon", "name": "kosher salt, or to taste"}, {"amount": "4", "unit": "", "name": "tilapia fillets, 6 ounces each"}, {"amount": "", "unit": "", "name": "kosher salt + freshly ground black pepper, to taste"}, {"amount": "1", "unit": "", "name": "large (or 2 small) heads of broccoli (about 1 pound), cut or thinly"}, {"amount": "", "unit": "", "name": "sliced into very small florets, about 1/4 to 1/2-inch thick (about 4"}, {"amount": "", "unit": "", "name": "heaping cups once chopped)"}, {"amount": "2", "unit": "teaspoons", "name": "lemon juice (from lemon you zested)"}, {"amount": "2", "unit": "teaspoons", "name": "olive oil"}], "steps": ["Heat the oven to 400° F. Alternatively, heat your grill to medium-high.", "Make smoked paprika butter: mix all the ingredients together in a small bowl. Set aside.", "Season both sides of tilapia fillets with kosher salt and pepper, to taste. Toss broccoli with lemon juice and olive oil in a medium bowl, and season to taste with salt and pepper.", "On a large sheet pan or baking sheet, lay out four 12-inch sheets of foil. Divide broccoli evenly among the four sheets (about 1 cup on each sheet), then top with a tilapia fillet and a tablespoon of butter, smeared evenly over the top of the fillet. Tightly fold or crimp the edges of the foil together several times to create an airtight packet.", "Place the sheet pan with the four packets in the oven and bake for about 12 to 15 min, or until the thickest part of the tilapia is opaque and cooked through. At about 10 min, open one of the packets to check for doneness to be safe. If the tilapia isn't done, reseal and return packets to the oven.", "Remove from the oven and carefully open the packets. Transfer the contents to plates, or place the foil packets on plates so each person can open them at the table. Alternatively, tuck the contents into toasted rolls; see ingredient list for sandwich ideas. # Meat"], "notes": "The ingredients in the foil packets can be easily changed up. Slip in shaved fennel or strips of roasted red pepper with the broccoli, or swap out the broccoli for thinly sliced Brussels sprouts or spinach. The foil packets can be assembled in advance, and then baked or grilled to serve. Feel free to serve the fish and vegetables straight out of the foil packet."}, {"title": "Steak marinade", "servings": null, "time": "", "tags": ["meat"], "ingredients": [{"amount": "⅓", "unit": "cup", "name": "plus 1 teaspoon soy sauce"}, {"amount": "3", "unit": "tablespoons", "name": "rice vinegar"}, {"amount": "2", "unit": "tablespoons", "name": "sesame oil"}, {"amount": "1", "unit": "", "name": "(1¼-inch) piece fresh ginger, peeled and finely grated (about 2"}, {"amount": "", "unit": "teaspoons", "name": ")"}, {"amount": "3", "unit": "", "name": "garlic cloves, peeled and finely grated (about 2 teaspoons)"}, {"amount": "1½", "unit": "teaspoons", "name": "ground coriander"}, {"amount": "1½", "unit": "teaspoons", "name": "ground cumin"}, {"amount": "1½", "unit": "pounds", "name": "boneless steak, any tender cut (preferably bavette, sirloin"}, {"amount": "", "unit": "", "name": "tip, flap, rib-eye, flank or sirloin)"}, {"amount": "1", "unit": "tablespoon", "name": "neutral oil, for cooking (if using a pan)"}], "steps": ["Combine the soy sauce, vinegar, sesame oil, ginger, garlic, coriander and cumin in a large bowl or resealable freezer bag. (You should have ¾ cup of marinade.) Add the steak and massage the marinade into the meat, then chill in the refrigerator for at least 30 minutes, or preferably for at least 3 hours or up to 2 days. (The marinade will permeate the meat more powerfully over time, resulting in a more robust flavor.)", "Remove the meat from the refrigerator about 1 hour before cooking to bring it to room temperature. Heat a large heavy skillet, grill or grill pan over high heat. If using a pan, add the neutral oil to the pan. (No oil is needed for the barbecue or griddle pan.) When the pan or grill is hot, use tongs to remove the steak from the marinade, allowing excess to fall away before placing the steaks on the pan or grill. Depending on the thickness of your steak (and the doneness you prefer), cook a 1-inch-thick steak for about 3 minutes per side until medium-rare. For thinner steaks or alternative cuts, reduce the cooking time to about 2 minutes per side, and increase the cooking time as needed for thicker cuts.", "Remove the steak and let it rest for 5 minutes. Transfer to a cutting board and thinly slice the meat against the grain. Serve warm, room temperature or even cold, depending on your preference."], "notes": "Soy, coriander and cumin join ginger and garlic in this simple, umami-laden marinade. It's a perfect match for any tender cut of beef, such as bavette, rib-eye or flank steak which have a loose, visible grain primed for soaking up marinades. This recipe imparts its flavor in as little as 30 minutes, though the meat benefits from any additional marinating time --- and can sit for up to two days. The steak chars as it cooks, and the exterior caramelizes to create a crisp, powerfully savory crust."}, {"title": "Greek meatballs", "servings": null, "time": "", "tags": ["meat"], "ingredients": [{"amount": "½", "unit": "cup", "name": "(lightly packed) grated red or yellow onion (from about ½ large"}, {"amount": "", "unit": "", "name": "onion)"}, {"amount": "1", "unit": "", "name": "medium tomato, grated (about 5 ounces)"}, {"amount": "1", "unit": "pound", "name": "lean ground beef"}, {"amount": "½", "unit": "pound", "name": "ground lamb or pork"}, {"amount": "½", "unit": "cup", "name": "panko bread crumbs"}, {"amount": "1", "unit": "", "name": "large egg, lightly beaten"}, {"amount": "⅓", "unit": "cup", "name": "finely chopped fresh mint"}, {"amount": "⅓", "unit": "cup", "name": "finely chopped fresh parsley"}, {"amount": "2", "unit": "", "name": "large garlic cloves, grated or very finely minced"}, {"amount": "1", "unit": "teaspoon", "name": "dried oregano"}, {"amount": "1", "unit": "teaspoon", "name": "ground coriander"}, {"amount": "½", "unit": "teaspoon", "name": "ground cumin"}, {"amount": "", "unit": "", "name": "Salt and pepper"}, {"amount": "¼", "unit": "cup", "name": "olive oil"}, {"amount": "", "unit": "", "name": "Tzatziki, salad and pita (all optional), for serving"}], "steps": ["Place the grated onion and tomato in a fine-mesh sieve over the sink and stir a few times, pressing on the mixture to drain the excess liquid. (Some moisture should remain; do not squeeze in a dish towel.) Transfer the remaining onion and tomato to a large bowl.", "Add the beef, lamb, panko, egg, mint, parsley, garlic, oregano, coriander and cumin, plus 1 1⁄2 teaspoons salt and ½ teaspoon pepper; mix gently but thoroughly.", "Using a 2-tablespoon scoop or two spoons, form meatballs that are about 1 1⁄2 inches wide. Place them on a plate, cover and chill for at least 30 minutes and up to 24 hours to allow the meatballs to firm up.", "In a large (12-inch) skillet, heat the oil over medium-high. When the oil is hot (it should sizzle immediately if you drop a bread crumb in the pan), fry the meatballs in 2 to 3 batches, flipping occasionally and lowering the heat as needed, until browned all over and just cooked through, 5 to 7 minutes.", "Transfer the cooked meatballs to a paper towel-lined plate, and serve hot or warm with any combination of tzatziki, salad and pita, if desired."], "notes": "These meatballs are inspired by keftedes, a traditional Greek meatball made with beef and sometimes pork or lamb and seasoned with a mix of herbs and spices. While variations of keftedes abound, many include fresh breadcrumbs, grated onion and tomato, along with lots of fresh mint and parsley. The tomato lends the meatballs a hint of sweetness and acidity, and also helps make them moist and tender. The breadcrumbs go into the meatball mix on their own and soak up the flavorful juices from the onion and tomato. Serve with homemade tzatziki, a simple salad and pita on the side, or in tomato sauce."}, {"title": "Bolognese sauce (Marcella Hazan's)", "servings": null, "time": "", "tags": ["meat"], "ingredients": [{"amount": "1", "unit": "tablespoon", "name": "vegetable oil"}, {"amount": "3", "unit": "tablespoons", "name": "butter plus 1 tablespoon for tossing the pasta"}, {"amount": "½", "unit": "cup", "name": "chopped onion"}, {"amount": "⅔", "unit": "cup", "name": "chopped celery"}, {"amount": "⅔", "unit": "cup", "name": "chopped carrot"}, {"amount": "¾", "unit": "pound", "name": "ground beef chuck (or you can use 1 part pork to 2 parts beef)"}, {"amount": "", "unit": "", "name": "Salt"}, {"amount": "", "unit": "", "name": "Black pepper, ground fresh from the mill"}, {"amount": "1", "unit": "cup", "name": "whole milk"}, {"amount": "", "unit": "", "name": "Whole nutmeg"}, {"amount": "1", "unit": "cup", "name": "dry white wine"}, {"amount": "1½", "unit": "cups", "name": "canned imported Italian plum tomatoes, cut up, with their juice"}, {"amount": "1¼ to 1½", "unit": "pounds", "name": "pasta"}, {"amount": "", "unit": "", "name": "Freshly grated Parmigiano-Reggiano at the table"}], "steps": ["Put the oil, butter and chopped onion in the pot and turn the heat on to medium. Cook and stir the onion until it has become translucent, then add the chopped celery and carrot. Cook for about 2 minutes, stirring vegetables to coat them well.", "Add ground beef, a large pinch of salt and a few grindings of pepper. Crumble the meat with a fork, stir well and cook until the beef has lost its raw, red colour.", "Add milk and let it simmer gently, stirring frequently, until it has bubbled away completely. Add a tiny grating --- about ⅛ teaspoon --- of nutmeg, and stir.", "Add the wine, let it simmer until evaporated, then add tomatoes and stir thoroughly to coat all ingredients well. When tomatoes begin to bubble, turn the heat down so that the sauce cooks at the laziest of simmers, with just an intermittent bubble. Cook, uncovered, for 3 hours or more, stirring from time to time. While the sauce is cooking, you are likely to find that it begins to dry out and the fat separates from the meat. To keep it from sticking, add ½ cup of water whenever necessary. At the end, however, no water at all must be left, and the fat must separate from the sauce. Stir to mix the fat into the sauce, taste and correct for salt.", "Toss with cooked, drained pasta, adding the tablespoon of butter, and serve with freshly grated Parmigiano-Reggiano on the side. \\"], "notes": ""}, {"title": "Slow cooker chili", "servings": null, "time": "", "tags": ["meat"], "ingredients": [{"amount": "2", "unit": "tablespoons", "name": "olive oil"}, {"amount": "1", "unit": "", "name": "large yellow or red onion, finely chopped"}, {"amount": "", "unit": "", "name": "Kosher salt"}, {"amount": "2", "unit": "pounds", "name": "ground beef, 80 per cent lean, 20 per cent fat"}, {"amount": "8", "unit": "", "name": "garlic cloves, finely chopped"}, {"amount": "1", "unit": "", "name": "(6-ounce) can tomato paste"}, {"amount": "1", "unit": "tablespoon", "name": "sweet paprika"}, {"amount": "2", "unit": "teaspoons", "name": "chipotle powder"}, {"amount": "2", "unit": "teaspoons", "name": "ground cumin"}, {"amount": "2", "unit": "teaspoons", "name": "garlic powder"}, {"amount": "2", "unit": "teaspoons", "name": "onion powder"}, {"amount": "2", "unit": "teaspoons", "name": "mustard powder"}, {"amount": "2", "unit": "teaspoons", "name": "hot smoked paprika"}, {"amount": "½", "unit": "teaspoon", "name": "cayenne powder"}, {"amount": "½", "unit": "teaspoon", "name": "ground cinnamon"}, {"amount": "¼", "unit": "teaspoon", "name": "ground cloves"}, {"amount": "12", "unit": "ounces", "name": "(1½ cups) pilsner beer, such as Modelo Especial"}, {"amount": "1", "unit": "", "name": "(14-ounce) can of diced or crushed tomatoes in juice"}, {"amount": "¼", "unit": "cup", "name": "cider vinegar"}, {"amount": "2", "unit": "tablespoons", "name": "maple syrup or dark brown sugar"}, {"amount": "2", "unit": "tablespoons", "name": "soy sauce"}, {"amount": "2", "unit": "teaspoons", "name": "beef stock bouillon paste, such as Better Than Bouillon"}, {"amount": "1½", "unit": "
