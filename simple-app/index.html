teaspoons", "name": "unsweetened cocoa powder"}, {"amount": "2", "unit": "", "name": "(14-ounce) cans kidney beans, drained and rinsed"}, {"amount": "2", "unit": "", "name": "(14-ounce) cans pinto beans, drained and rinsed"}, {"amount": "1", "unit": "tablespoon", "name": "Worcestershire sauce"}, {"amount": "", "unit": "", "name": "Hot sauce, grated sharp Cheddar, sliced scallions, sour cream and"}, {"amount": "", "unit": "", "name": "crushed tortilla chips, for serving"}], "steps": ["Heat the oil in a large Dutch oven over medium. Add the onion, season with salt, and cook, stirring occasionally, until the onion is softened and translucent, about 8 minutes. Increase the heat to medium-high, add the beef and garlic, season with salt and cook, breaking the beef into crumbles with a spatula, until the beef has lost its pink color, 8 to 10 minutes. Stir in the tomato paste and cook until slightly darkened and caramelized, about 1 minute. Stir in all the spices and cook until fragrant, about 1 minute. Add the beer and stir, scraping the bottom of the pan.", "Transfer the beef mixture into a 5- to 8-quart slow cooker. Stir in the tomatoes, vinegar, maple syrup, soy sauce, beef bouillon paste, cocoa, beans and ½ cup water. Cover and cook on low for at least 4 hours and up to 6 hours. (The chili can hold well on warm for an additional 2 hours.)", "When ready to serve, stir in the Worcestershire sauce. If the chili is too thick, stir in a bit of water until the texture is to your liking. Season to taste with salt. Serve in bowls and pass the toppings at the table. Tip: You can also cook the chili in a Dutch oven on your stovetop in about 1 hour. In step 2, add 1 cup water instead of ½ cup and let the mixture come to a simmer over medium-high. (Because the cooking liquid reduces further on the stovetop, this method starts with more water.) Reduce the heat to low, cover, and cook until the meat is tender, stirring occasionally, about 35 minutes. # # Pasta"], "notes": ""}, {"title": "Creamy miso pasta", "servings": null, "time": "", "tags": ["pasta"], "ingredients": [{"amount": "", "unit": "", "name": "Kosher salt"}, {"amount": "16", "unit": "ounces", "name": "spaghetti, linguine or bucatini"}, {"amount": "6", "unit": "tablespoons", "name": "unsalted butter"}, {"amount": "3", "unit": "tablespoons", "name": "white (or red) miso"}, {"amount": "4", "unit": "ounces", "name": "Parmesan, finely grated (1 packed cup)"}, {"amount": "", "unit": "", "name": "Kizami nori, furikake or thinly sliced seaweed snacks, for garnish (optional)"}], "steps": ["Bring a large pot of salted water to a boil. Add the pasta and cook, stirring occasionally, until al dente. Reserve 1 1⁄2 cups of pasta water, then drain the pasta.", "Add the butter, miso and 1 1⁄4 cups pasta water to the pot and whisk over medium heat until the miso breaks down and the liquid is uniform, 1 to 2 minutes. Add the pasta and Parmesan and cook, stirring vigorously with tongs until cheese is melted and sauce emulsifies. (The key word here is \"vigorously.\" To achieve a silky smooth pasta instead of a gloppy one, put your cacio e pepe skills to work.)", "Divide among shallow bowls and sprinkle with nori or furikake, if using."], "notes": "This one-pot pasta comes together in minutes, and requires zero prep and minimal cleanup. It builds on the classic combination of pasta, butter and cheese with a spoonful of miso paste for complexity. But you could experiment with using any other condiments or spices you have on hand, such as red pesto, curry paste or ground turmeric in place of the miso. To achieve a silky smooth pasta, you'll need to put your cacio e pepe skills to work: Vigorously toss the pasta, grated cheese and pasta water together to achieve a properly emulsified sauce. Top with shrimp, edamame, frozen peas or any steamed vegetable. The optional nori or furikake imparts an unexpected flavor of the sea, and it's worth using if you have it on hand."}, {"title": "Spicy cherry tomato pasta", "servings": 4, "time": "", "tags": ["pasta"], "ingredients": [{"amount": "3 to 6", "unit": "cloves", "name": "garlic, thinly sliced"}, {"amount": "1", "unit": "", "name": "medium shallot, very finely minced"}, {"amount": "4", "unit": "tablespoons", "name": "extra-virgin olive oil"}, {"amount": "2", "unit": "teaspoons", "name": "chilli flakes/red pepper flakes or a minced red Fresno chile (reduce this if you don't want your sauce to be spicy! see the notes"}, {"amount": "", "unit": "", "name": "section below recipe for more)"}, {"amount": "2", "unit": "bunches", "name": "of fresh basil, leaves and stems separated"}, {"amount": "2", "unit": "", "name": "heaping tablespoons tomato paste"}, {"amount": "2", "unit": "", "name": "pints (600g) cherry tomatoes, halved"}, {"amount": "", "unit": "", "name": "Sea salt and black pepper"}, {"amount": "1/2", "unit": "cup", "name": "(or 150 ml) white wine (or water)"}, {"amount": "1", "unit": "", "name": "(1 pound) package of spaghetti"}, {"amount": "", "unit": "", "name": "Pasta water, reserved from the cooking pot"}, {"amount": "", "unit": "", "name": "Pecorino Romano or Parmigiano Reggiano, finely grated, for garnish"}], "steps": ["Thinly slice 3 cloves of garlic (if you love garlic, you can add an extra clove or 2) and finely mince 1 shallot. You want the shallot really finely minced -- no large pieces of onion, just keep running that knife through until it looks like it's been grated through a microplane.", "Add 4 tablespoons extra-virgin olive oil to a large skillet off heat. Add the prepped garlic and shallot along with 2 teaspoons of chilli flakes/red pepper flakes (or less if you don't want that much spice --- see notes below recipe for more) and 2 bunches of basil stems (6-12 stems). These contain heaps of flavor, which will infuse nicely. Save the basil leaves for later.", "Turn the heat under the pan on to medium-high and allow everything to sizzle and sauté for 2 to 3 minutes until it's all nice and fragrant. You aren't looking for any color or browning on the onion or garlic, so keep an eye on it and reduce heat if needed. Remove and discard the basil stems.", "Add in 2 heaping tablespoons of tomato paste and stir to combine. Continue to sauté everything for another 1 to 2 minutes. The tomato paste will start to darken and stick to the bottom of the pan -- that's exactly what you're after. This is extra flavor that will seep into the sauce during the next few steps.", "Halve 2 pints of cherry tomatoes. Add the cherry tomatoes to the skillet and season with some sea salt and black pepper, to taste. Stir everything together for a minute so that it's all coated in the tomato paste and the ingredients are evenly dispersed.", "Pour in 1/2 cup (150 ml) white wine (or water). Stir to combine and allow it to simmer away and reduce for around 2 minutes.", "Cover the skillet with a lid and reduce the heat down to medium. This will create a nice steamy environment for the tomatoes to soften and break down, and prevent any unwanted splattering!", "Let simmer for 15 to 20 minutes, then remove the lid and take a peek. The tomatoes should have broken down nicely and released lots of their juices. Use a spatula or potato masher to mash the tomatoes down gently to extract all their additional flavor (it will only take a few presses). The tomato skins will have loosened and should be scattered throughout the sauce. Optionally, you can fish the tomato skins out using tongs (I do this because I find the result worth it, but it's tedious, and the sauce is delicious either way).", "Taste and adjust seasoning as needed. Add more sea salt if the flavors are dull, or more red pepper flakes if you want additional spice. Let things gently bubble away on medium-low, uncovered, as you move on to the next step.", "Bring a large pot of heavily salted water to a boil over high heat. I advise using about half the amount of water as the box of noodles tells you to --- this will give your pasta water a higher concentration of starch, which will help your tomato sauce become more cohesive later. Once boiling, add 1 pound of spaghetti and cook for 7 minutes, or until very al dente --- 2 minutes less than the lower end of your package instructions.", "Once al dente, use tongs to transfer the pasta directly to the tomato sauce --- no need to drain it; the starchy pasta water is welcome here. Add in an additional ladle of your pasta water and allow the pasta to finish cooking in the tomato sauce. You want it to be bubbling away nicely and for the pasta to absorb all of that goodness.", "After 3 to 4 minutes, the sauce should have thickened slightly, and the pasta should be cooked but still nice and al dente. Use the pasta water to adjust consistency if you want it slightly looser.", "Turn off the heat, then add in some torn basil leaves and give everything a good stir. Adding the fresh basil at this stage will impart a really delicate herbal note.", "Use your tongs to grab a hefty amount of the pasta and place the tip of the tongs into the middle of a large ladle --- begin twirling and continue to twirl until you have a nice, neat serving, then add to a plate. Alternatively, carefully pour out all the spaghetti into one large serving bowl and serve family-style.", "Top with any remaining tomato sauce and garnish with some extra-virgin olive oil, finely grated pecorino Romano (or Parmigiano Reggiano), and a few fresh leaves of basil."], "notes": "-   I don't want it to be spicy: 2 teaspoons of chilli/red pepper flakes will have a good bit of heat. If you're feeding kids or people who don't love spice, reduce it! -   If you want mild heat, use 1/4 teaspoon or less for the whole recipe. -   If you want gentle warmth, use 1/2 to 1 teaspoon. -   If you want noticeable spice, use 1 1/2 to 2 teaspoons. -   Prep ahead: Pre-chop/mince your garlic and onion up to 2 days ahead of time and store them in the fridge in an airtight container. You can also pre-slice your cherry tomatoes and store them in the fridge. -   Love your leftovers/feeding 1 or 2: Reheat leftovers in a skillet over medium heat and stir in a splash of water at a time as needed until it's saucy again. Taste and re-season with salt and pepper if needed. You could also easily halve this recipe! -   Freezer-friendly: This sauce freezes well for up to 6 months. Just whip it out any time you're craving a really delicious pasta --- it's a game changer on a rushed night. -   Must have meat: If you want to cook some meat to accompany your pasta, here are some great options: basil balsamic grilled chicken, the most perfect grilled chicken, shrimp cooked on the stovetop in olive oil with salt and pepper, grilled shrimp, Crash's pork tenderloin, or meatballs -   Gimme some greens: Make a simple side salad! -   Dairy-free/gluten-free: To eliminate dairy, use a plant-based Parm for the garnish or just omit it. And to avoid gluten, use any GF noodle you love! Cook it just as you would the spaghetti -   Garlic: 3 to 6 minced frozen garlic cubes (thawed), 3 to 6 teaspoons pre-minced garlic, 1/2 teaspoon garlic powder -   Shallot: 1 small or 1/2 large red or yellow onion, scallions (white parts only, thinly sliced), or thinly sliced and washed leeks -   EVOO: Olive oil, avocado oil, sunflower or grapeseed oil, or butter (butter would yield richer flavor) -   Basil: Basil's pretty key to the flavors here, but if needed, you could sub fresh parsley, oregano, thyme, or tarragon. -   Chilli flakes/red pepper flakes: Smoked or sweet paprika or a minced fresh hot pepper like red Fresno chile, serrano, or jalapeño -   Tomato paste: Skip it if needed -   Cherry tomatoes: As a substitute for the cherry tomatoes, grab a 28 ounce can of high-quality plum tomatoes and crush them with your hands. Once well crushed, add them when you add the cherry tomatoes. Alternatively, you can use diced heirloom tomatoes, but cut them in half and try to squeeze out as much of their liquidy insides as you can first, or else it'll take ages for your sauce to thicken. -   White wine: Any white wine, but NF recommends sauvignon blanc if you've got it. Or use water. -   Spaghetti: Angel hair, linguine, or any other noodle (short or long) you have in the house! Gluten-free or another noodle alternative work great here --- reserve the pasta water just as you would spaghetti. -   Pecorino Romano: Parmigiano Reggiano, Grana Padano, asiago, vegan Parm, or omit"}, {"title": "One-pan orecchiette puttanesca", "servings": 4, "time": "", "tags": ["pasta"], "ingredients": [{"amount": "1/4", "unit": "cup", "name": "olive oil (50ml), plus 2 tablespoons for garnish"}, {"amount": "6", "unit": "", "name": "garlic cloves, crushed"}, {"amount": "1", "unit": "", "name": "(15-ounce) can (400g tin) of chickpeas, drained well and patted dry"}, {"amount": "2", "unit": "teaspoons", "name": "hot smoked paprika (or any smoked paprika)"}, {"amount": "2", "unit": "teaspoons", "name": "ground cumin"}, {"amount": "3/4", "unit": "tablespoon", "name": "tomato paste"}, {"amount": "2/3", "unit": "cup", "name": "(40g) roughly chopped fresh parsley"}, {"amount": "2", "unit": "teaspoons", "name": "lemon zest (from 1 medium lemon)"}, {"amount": "3", "unit": "tablespoons", "name": "baby (AKA non-pareil) capers (or any capers)"}, {"amount": "1/2", "unit": "cup", "name": "(80g) pitted green olives, such as Nocellara or Castelvetrano"}, {"amount": "", "unit": "", "name": "roughly chopped"}, {"amount": "1 1/2", "unit": "cups", "name": "(250g) small, sweet cherry tomatoes"}, {"amount": "2", "unit": "teaspoons", "name": "caster sugar (or granulated sugar)"}, {"amount": "1/2", "unit": "tablespoon", "name": "caraway seeds, lightly toasted and crushed (try to find"}, {"amount": "", "unit": "", "name": "toasted seeds at the store --- if they don't sell any, you can toast"}, {"amount": "", "unit": "", "name": "your own)"}, {"amount": "8", "unit": "ounces", "name": "(250g) dried orecchiette (AKA, half a bag)"}, {"amount": "2", "unit": "cups", "name": "(500ml) vegetable or chicken stock"}, {"amount": "3/4", "unit": "cup", "name": "(200ml2) of water"}, {"amount": "", "unit": "", "name": "Kosher salt and black pepper"}], "steps": ["Add the first 6 ingredients (1/4 cup olive oil, 6 crushed garlic cloves, 1 can of drained and patted-dried chickpeas, 2 teaspoons smoked paprika, 2 teaspoons ground cumin, and 3/4 tablespoon tomato paste) along with 1/2 teaspoon kosher salt to a large sauté pan and place over medium-high heat.", "Cook for 12 minutes, stirring every now and then, until the chickpeas are slightly crisp --- you may need to turn down the heat a little if they start to colour too much. Remove 1/3 of the chickpeas and set aside to use as a garnish.", "While your chickpeas are cooking, in a small bowl, combine 2/3 cup roughly chopped fresh parsley, 2 teaspoons lemon zest, 3 tablespoons baby capers, and 1/2 cup roughly chopped pitted green olives.", "Also, while your chickpeas are frying: If your caraway seeds aren't already toasted, add 1/2 tablespoon caraway seeds to a small skillet over medium heat and toast for about 5 minutes, stirring occasionally, until they turn fragrant and a slightly darker shade. Once toasted, transfer them to a cutting board and use a rolling pin or wine bottle to crush them. (You could also crush them using a mortar and pestle, or in a bowl with the back of a cooking spoon.)", "When your chickpeas are done cooking (and you've removed some for garnish), add 2/3 of the parsley mixture to the sauté pan along with 1 1/2 cups cherry tomatoes, 2 teaspoons sugar, and the toasted, crushed caraway seeds. Cook for 2 min over medium-high heat, stirring often.", "Add 8 ounces (half a bag of) orecchiette, 2 cups of stock, 3/4 teaspoon kosher salt, and 3/4 cup (200ml) of water to the pan and bring to a simmer. Reduce the heat to medium, cover with the lid, and cook for 12 to 14 minutes, or until the pasta is al dente.", "If you open the lid at the end of that cooking time and there's no liquid left but your pasta isn't al dente yet, add a little bit more water, close the lid, and cook for another minute or 2 and check again. Conversely, if you open the lid and you still have liquid left but your pasta is ready, keep the lid off, crank the heat up to high, and stir constantly to quickly cook that liquid off without overcooking the noodles.", "Stir in the remaining parsley mixture, drizzle with the remaining 2 tablespoons of olive oil, and garnish with the crispy chickpeas and a good grind of black pepper."], "notes": "-   A note about olives: Yotam's recipe initially called for 125g of Nocellara olives, pits included. If you buy pre-pitted (it will save you time and effort!) the measurement will be 80g, or 1/2 cup pitted olives. If you are using olives with pits, you'll still use 1/2 cup --- you can remove the pits efficiently by smashing the olives with the side of your knife and then just plucking out the pits. -   I'm making this during winter: Amazing --- it's a perfect cozy winter dish. If you can't find tasty fresh cherry tomatoes at the store, use a 14.5 ounce can of diced, crushed, chopped, whole plum, or whole cherry tomatoes instead. If using whole plum tomatoes, break them apart using your spatula while cooking. Alternatively, just grab those less-than-ideal cherry tomatoes from the store and add an extra pinch of sugar to sweeten things up. -   Feeding picky eaters: If they are sensitive to spice, you can use smoked paprika instead of \"hot\" smoked paprika. You could also halve the paprika or omit it entirely if you want to play it safe. If your kids aren't into olives and capers, you can fish out some of the cooked noodles and plate those alone with some crispy chickpeas and whatever fruit they love. -   Feeding a crowd: Use a large Dutch oven or pot and double it! Increase the cook time of both the chickpeas and pasta by a few minutes. -   Must have meat and greens: This pasta is very filling as is, but if you want extra protein (or if you want to stretch the meal to feed more people --- this will nearly double its yield), here's an idea: In a separate skillet over medium-high heat, brown 1/2 pound ground Italian sausage. Once it has browned, stir in 3 cups finely chopped kale or spinach and continue cooking until wilted, 3 to 5 minutes, adding splashes of stock or water as needed to help wilt the kale. Stir this mixture into the pasta before serving. -   Gimme some greens: If you just want some extra greens, stir a handful or 2 of torn spinach in at the end of cooking your pasta --- it will wilt right in. -   Love your leftovers: Leftovers will keep for up to 4 days stored in an airtight container in the fridge. Reheat in a saucepan over medium heat, adding more stock or water as needed to loosen things up. -   Cook this soon: Use up the second half of that orecchiette by making spring pea pasta. -   Vegetarian/dairy-free: Already is! -   Gluten-free: As is typically the case with one-pot pasta recipes, we don't recommend swapping in GF pasta as written. If you're using gluten-free pasta, boil it separately per package directions, until al dente. Make the sauce as written, but only add half the amount of stock. Check on it as it simmers --- if the sauce needs more liquid, add more stock. If it's too liquidy at the end of cooking, take the lid off, crank the heat up, and cook stirring constantly until it has absorbed into the sauce. Once the sauce and pasta are both cooked, pour the noodles into the sauce, stir, and dig in! While you're shopping, also check labels for your capers, olives, and stock as some brands may use a brine or additives that contain gluten. -   Olive oil: Avocado oil, grapeseed oil, sunflower oil, EVOO, or another oil you have. Use the tastiest oil you've got --- like a nice EVOO --- for the garnish. -   Chickpeas: A can of any other white bean like cannellini or navy. Omit if you hate/can't do beans! -   Hot smoked paprika: Regular smoked paprika, chili powder, or sweet paprika (but if you want some heat, add a shake of cayenne or red pepper flakes with it). If you don't have any paprika, you could add a teaspoon of garam masala for some extra flavor complexity, or just omit. -   Ground cumin: Ground coriander or garam masala -   Tomato paste: Tomato sauce but double it, or omit -   Parsley: FYI, we recommend Italian/flat-leaf parsley over curly parsley. If you have no parsley, you could use basil or cilantro, or omit the herb. -   Lemon zest: There's no sub --- omit if you need to. -   Capers: Extra olives, or minced cornichons -   Olives: Double the capers -   Cherry tomatoes: A 14.5 ounce can of diced, crushed, chopped, or whole cherry (ideal!) tomatoes. If you can't do tomatoes, you can leave them out for a totally different yet still tasty pasta. -   Caster sugar: Granulated or brown sugar -   Caraway seeds: Fennel seeds, whole cumin seeds, or coriander seeds (all of these should be toasted --- do that yourself while cooking, or buy them toasted from the store). If you really don't feel like cooking, you can omit the ground seed --- though like Ottolenghi said in the intro, it is a lovely touch! -   Orecchiette: Another small-shaped pasta like penne, farfalle, fusilli, or rigatoni. See notes for a GF swap. -   Vegetable or chicken stock: 2 teaspoons vegetable- or chicken-flavored Better Than Bouillon plus 2 cups of water, or chicken or veggie broth # Vegetarian"}, {"title": "Spicy black bean and sweet potato chili", "servings": null, "time": "1 hour", "tags": ["vegetarian"], "ingredients": [{"amount": "¼", "unit": "cup", "name": "coconut oil or vegetable oil"}, {"amount": "1", "unit": "", "name": "large yellow or red onion, finely chopped"}, {"amount": "", "unit": "", "name": "Kosher salt and black pepper"}, {"amount": "6", "unit": "", "name": "garlic cloves, smashed and roughly chopped"}, {"amount": "2", "unit": "", "name": "packed tablespoons light brown sugar"}, {"amount": "2", "unit": "teaspoons", "name": "ground cumin"}, {"amount": "2", "unit": "teaspoons", "name": "garlic powder"}, {"amount": "2", "unit": "teaspoons", "name": "onion powder"}, {"amount": "¾", "unit": "cup", "name": "orange juice"}, {"amount": "1", "unit": "", "name": "to 4chipotles from a can of chipotles in adobo, finely chopped, plus 3"}, {"amount": "", "unit": "tablespoons", "name": "adobo sauce"}, {"amount": "1½", "unit": "pounds", "name": "sweet potatoes (4 to 5 small-medium or about 2 large), scrubbed"}, {"amount": "", "unit": "", "name": "and cut into 1-inch pieces"}, {"amount": "2", "unit": "", "name": "(15-ounce) cans black beans, drained"}, {"amount": "1", "unit": "", "name": "(28-ounce) can crushed or diced tomatoes, preferably fire-roasted"}, {"amount": "", "unit": "", "name": "Juice of 1 lime (about 1½ tablespoons)"}, {"amount": "1", "unit": "", "name": "(10-ounce) bag frozen corn"}, {"amount": "", "unit": "", "name": "Sliced avocado and red onion, for topping"}], "steps": ["In a large Dutch oven, warm the oil over medium-high heat. Add the onion, season with salt and cook, stirring occasionally, until the onion is translucent, about 5 minutes. Add the garlic and cook, stirring and adjusting the heat as needed to avoid burning, until fragrant, about 1 minute.", "Add brown sugar, cumin, garlic and onion powders, stir to combine. Add the orange juice and let it simmer. Add the chipotles and adobo sauce, sweet potatoes, beans, tomatoes and lime juice. Season generously with black pepper and 2 teaspoons of salt. Stir in 1 1⁄4 cups of water and bring to a boil.", "Once the chili comes to a boil, decrease the heat to low to maintain a simmer. Cover the pot and cook until the sweet potatoes are tender, 30 to 45 minutes.", "Just before serving, stir in the corn and let it warm through. Taste and add more salt and pepper if necessary. Top with avocado and red onion."], "notes": "This thick, smoky vegan chili comes together in just under an hour, and most of that time is hands-off simmering. You can use any kind of sweet potato here --- keep in mind that the orange or garnet \"yam\" you see at the grocery store is actually a sweet potato --- but you could also switch it up and use any peeled sweet winter squash, like butternut or kabocha. The recipe calls for either coconut oil or vegetable oil. If you'd like a mild coconut flavor, which plays well with the orange juice, choose unrefined or virgin coconut oil; for a neutral flavor, choose refined coconut oil or any vegetable oil. Use one chipotle chile for a very mild chili, and four if you like yours very spicy."}, {"title": "Pressure cooker sweet potato-coconut curry soup", "servings": null, "time": "", "tags": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "tablespoons", "name": "coconut oil, preferably unrefined virgin"}, {"amount": "1", "unit": "", "name": "large yellow or red onion, chopped"}, {"amount": "½", "unit": "teaspoon", "name": "kosher salt, plus more for seasoning"}, {"amount": "5", "unit": "", "name": "large garlic cloves, crushed"}, {"amount": "1", "unit": "", "name": "(4-ounce) jar red curry paste (½ cup), plus more to taste"}, {"amount": "1", "unit": "tablespoon", "name": "packed light brown sugar, plus more to taste"}, {"amount": "1", "unit": "teaspoon", "name": "ground turmeric"}, {"amount": "2½", "unit": "pounds", "name": "sweet potatoes or yams, peeled and cut into 1- to 2-inch pieces"}, {"amount": "1", "unit": "", "name": "(13-ounce) can full-fat coconut milk"}, {"amount": "¾", "unit": "cup", "name": "smooth natural peanut butter"}, {"amount": "1", "unit": "", "name": "medium bunch baby kale or spinach (6 to 8 ounces), stemmed (if needed)"}, {"amount": "", "unit": "", "name": "and chopped"}, {"amount": "", "unit": "", "name": "Juice of 1 lime, plus more to taste"}, {"amount": "", "unit": "Pinch", "name": "of ground cayenne (optional)"}, {"amount": "", "unit": "", "name": "Chopped roasted, salted peanuts, for serving"}], "steps": ["Using the sauté setting, heat the coconut oil in the pot of a 6- to 8-quart pressure cooker. Add the onion, season with a generous pinch of salt and cook, stirring occasionally, until softened and translucent, about 5 minutes. Add the garlic and cook until fragrant, 1 minute. Add the curry paste and stir until combined, 1 minute. Stir in the brown sugar and turmeric, then add the sweet potatoes, 2½ cups water and ½ teaspoon salt. Cover and cook on high pressure for 25 minutes.", "Release the pressure naturally for 10 minutes, then release the remaining pressure manually. Open the lid. Stir thoroughly, allowing some of the sweet potatoes to fall apart and thicken the soup. Add the coconut milk and peanut butter.", "Using an immersion blender, purée the soup. Add the kale and lime juice and stir to combine. Cook until the greens are wilted and tender, 3 to 5 minutes. Taste the soup and add cayenne, more salt, brown sugar, lime juice or curry paste as desired. Serve in bowls with peanuts on top."], "notes": "This creamy soup makes the most of a few supermarket staples: red curry paste, coconut milk and peanut butter. Since curry pastes vary in heat and salt, be sure to taste this soup at the end and adjust the flavor as you like. The rich soup is quite thick, so if you prefer a looser soup, stir in a little extra water until it reaches your ideal consistency. Chile-lime flavored peanuts, available at some grocery stores, are particularly good for topping, but roasted salted peanuts also work beautifully."}, {"title": "Slow-cooker curried sweet potato soup with coconut and kale", "servings": null, "time": "", "tags": ["vegetarian"], "ingredients": [{"amount": "2½", "unit": "pounds", "name": "sweet potatoes, peeled and cut into 1- to 2-inch chunks"}, {"amount": "1", "unit": "", "name": "medium yellow or red onion, chopped"}, {"amount": "5", "unit": "", "name": "large garlic cloves"}, {"amount": "2", "unit": "tablespoons", "name": "coconut oil, preferably unrefined virgin"}, {"amount": "2", "unit": "tablespoons", "name": "packed light brown sugar"}, {"amount": "1", "unit": "teaspoon", "name": "turmeric"}, {"amount": "½", "unit": "teaspoon", "name": "kosher salt, plus more to taste"}, {"amount": "1", "unit": "", "name": "(4-ounce) jar red curry paste (½ cup)"}, {"amount": "1", "unit": "", "name": "(13-ounce) can full-fat coconut milk"}, {"amount": "1", "unit": "cup", "name": "smooth peanut butter"}, {"amount": "", "unit": "", "name": "Juice of 1 lime, plus more to taste"}, {"amount": "5", "unit": "ounces", "name": "/1 medium bunch baby kale or spinach, stemmed and chopped"}, {"amount": "", "unit": "", "name": "Roasted, salted peanuts, for topping"}], "steps": ["Combine the sweet potatoes, onion, garlic, oil, sugar, turmeric and salt in a 5- to 8-quart slow cooker. Add more than half of the jar of curry paste (about ⅓ cup) and 1 cup of water. Stir to combine all the ingredients and cook on low until the potatoes are quite tender, about 8 hours.", "Add the coconut milk, peanut butter, remaining curry paste and 2 1⁄2 cups of water to the slow cooker. Using an immersion blender, purée the soup until it is uniformly creamy. Add the lime juice and the kale, and stir to combine. Cook on low until the greens are wilted and tender, about 10 minutes. Stir in more warm water if you would like a looser texture. Taste and add more lime juice or salt if necessary. Serve in bowls with peanuts on top. # Pork"], "notes": "This creamy Thai-inspired soup is all about balance: When the contrasting flavors are in harmony, it is outrageously delicious. (It is also vegan if there's no fish or shrimp in your curry paste.) Supermarket curry pastes are a great shortcut to flavor for weeknights, but salt and spice levels can vary greatly among brands. So taste at the end, and adjust: You may need to add curry paste, sugar or lime juice to your liking. Chile-lime flavored peanuts, available at some grocery stores, are particularly good for topping --- snap them up if you happen to see them. Otherwise, roasted salted peanuts will work."}, {"title": "Pressure cooker BBQ pulled pork", "servings": null, "time": "", "tags": ["pork"], "ingredients": [{"amount": "1", "unit": "tablespoon", "name": "garlic powder"}, {"amount": "1", "unit": "tablespoon", "name": "onion powder"}, {"amount": "2", "unit": "teaspoons", "name": "hot or sweet smoked paprika"}, {"amount": "2", "unit": "teaspoons", "name": "kosher salt, plus more to taste"}, {"amount": "1", "unit": "teaspoon", "name": "black pepper, plus more to taste"}, {"amount": "3 to 4", "unit": "pounds", "name": "boneless pork shoulder, trimmed of skin and excess fat and"}, {"amount": "", "unit": "", "name": "cut into 4 large chunks"}, {"amount": "2", "unit": "tablespoons", "name": "vegetable oil"}, {"amount": "1", "unit": "", "name": "yellow onion, chopped"}, {"amount": "1", "unit": "", "name": "(12-ounce) can of dark soda, like Dr Pepper, root beer, cola or birch"}, {"amount": "", "unit": "", "name": "beer"}, {"amount": "½ to 1½", "unit": "cups", "name": "homemade or store-bought barbecue sauce"}, {"amount": "", "unit": "", "name": "Hot sauce (optional)"}], "steps": ["Mix the garlic and onion powders, smoked paprika, salt and pepper in a large bowl. Add the pork and turn to coat in the spice mix. Put the oil in a 6- or 8-quart electric pressure cooker and turn on the sauté setting to warm the oil. (Use the \"normal\" heat setting if your pressure cooker has that option.) Working in batches, add the pork; brown on two sides, about 2 min per side. If the bottom of the pan gets too dark, turn the heat down to \"less,\" if your pot has that option, or turn it off entirely and allow the pork to continue searing. Turn it back on if the pot cools too much.", "Add the onion to the pot. Add the soda and stir to thoroughly scrape up the browned bits at the bottom of the pot. Close the lid and cook on high pressure for one hour. Turn off the pressure cooker and allow the pressure to release naturally for 15 minutes. Open the lid. Using tongs or a slotted spoon, remove the pork and onion bits to a large serving bowl. Using two forks, coarsely shred the meat. Add ½ cup barbecue sauce and a few spoonfuls of the cooking liquid to moisten. (Discard remaining cooking liquid.) Taste and add salt, pepper, hot sauce, and more barbecue sauce as you like. Serve with soft rolls and extra sauce on the side."], "notes": "A pressure cooker provides a nifty shortcut to perfect pulled pork. This recipe calls for braising the meat in a dark soda like Dr Pepper or Coca-Cola, and the results are lush and tender --- savory, slightly sweet and tangy. Once the pork is done, you can customize it to your taste using your favorite barbecue and hot sauces. Adding lots of black pepper and a few dashes of Southern-style hot sauce, like Crystal, Louisiana or Tabasco, is a very good idea. Like many braises, the pork improves overnight and can be cooked up to three days in advance; shred and warm it gently on the stovetop before tossing it with sauce and serving. The pork makes satisfying sandwiches on soft rolls (try coleslaw as a topping), but it could also be used in tacos or served over grits. (You can find the slow-cooker version of this recipe here.)"}, {"title": "Carnitas (Mexican pulled pork)", "servings": 10, "time": "8 hours 25 minutes", "tags": ["pork"], "ingredients": [{"amount": "4--5", "unit": "pounds", "name": "pork shoulder, cut into large 4-inch pieces"}, {"amount": "1", "unit": "tablespoon", "name": "kosher salt"}, {"amount": "4", "unit": "teaspoons", "name": "ground cumin"}, {"amount": "2", "unit": "teaspoons", "name": "chilli powder"}, {"amount": "2", "unit": "teaspoons", "name": "garlic powder"}, {"amount": "2", "unit": "teaspoons", "name": "dried oregano, preferably Mexican oregano"}, {"amount": "2", "unit": "teaspoons", "name": "onion powder"}, {"amount": "1", "unit": "teaspoon", "name": "freshly ground black pepper"}, {"amount": "4", "unit": "tablespoons", "name": "fresh orange juice, from about 1 large orange"}, {"amount": "2", "unit": "tablespoons", "name": "fresh lime juice, from about 1 lime"}, {"amount": "", "unit": "", "name": "Chopped fresh cilantro"}, {"amount": "", "unit": "", "name": "Fresh lime wedges"}], "steps": ["Season the pork shoulder on all sides with the salt, cumin, chilli powder, garlic powder, oregano, onion powder, and black pepper.", "Pour the orange juice and lime juice into the slow cooker.", "Place the seasoned pork on top of the juices.", "Cover and cook on low for 8 hours, or on high for 4--5 hours, until the pork is fall-apart tender.", "Using a slotted spoon, transfer the pork to a large rimmed baking sheet.", "Shred the meat with two forks.", "Position an oven rack directly beneath the broiler and heat the broiler to high.", "Pour ½--1 cup of the cooking liquid over the shredded pork and toss to coat.", "Broil for 8--10 minutes, stirring halfway through, until the edges are browned and crisp.", "Garnish with chopped cilantro and additional lime juice, if desired. Serve in tacos, gorditas, tostadas, burritos, nachos, saladas, or bowls.", "Add the seasoned pork, orange juice, and lime juice to the pressure cooker.", "Add 1 cup chicken, beef, or vegetable broth.", "Close the lid and set the valve to sealing.", "Cook on high pressure for 50 minutes.", "Allow the pressure to release naturally for 15 minutes, then release the remaining pressure manually.", "Shred and crisp the pork under the broiler as described above.", "Heat the oven to 325°F (165°C).", "Add the seasoned pork, orange juice, lime juice, and 1 cup chicken, beef, or vegetable Broth to a large Dutch oven or oven-safe pot.", "Cover and braise for about 4 hours, until the pork is fall-apart tender.", "Shred and crisp the pork under the broiler as described above."], "notes": "Carnitas are tender, juicy pieces of slow-cooked pork with crisped edges. They are ideal for tacos, burritos, tostadas, nachos, salads, and other family meals. Slow-cooker method: Pressure-cooker method Oven method -   Pork shoulder gives the juiciest result because of its higher fat content. -   To use pork loin, add 2--4 tablespoons olive oil, coconut oil, or another preferred fat, plus -   1 cup broth or water. The finished meat will be leaner and less juicy than pork shoulder. -   The broiling step is important for creating the characteristic crisp edges. -   Cool the carnitas completely in the refrigerator. -   Transfer to an airtight freezer bag, leaving about 2 inches of space at the top for expansion. -   Freeze for up to 6 months. ##"}, {"title": "Saucy pork bowls", "servings": 4, "time": "", "tags": ["pork"], "ingredients": [{"amount": "2", "unit": "pounds", "name": "sweet potatoes, peeled and cut into 1-inch cubes"}, {"amount": "2", "unit": "tablespoons", "name": "olive oil (or neutral oil like avocado)"}, {"amount": "1", "unit": "teaspoon", "name": "kosher salt"}, {"amount": "", "unit": "", "name": "Several grinds of black pepper"}, {"amount": "1", "unit": "cup", "name": "shredded carrots"}, {"amount": "2", "unit": "", "name": "Persian cucumbers or 1/2 English cucumber, thinly sliced"}, {"amount": "1/2", "unit": "cup", "name": "rice vinegar"}, {"amount": "1", "unit": "tablespoon", "name": "granulated sugar"}, {"amount": "", "unit": "pinch", "name": "kosher salt"}, {"amount": "4", "unit": "", "name": "green onions, thinly sliced (white and green parts)"}, {"amount": "1", "unit": "tablespoon", "name": "sesame oil"}, {"amount": "1", "unit": "pound", "name": "ground pork (preferably 80/20)"}, {"amount": "1", "unit": "teaspoon", "name": "garlic powder (or 4 cloves garlic, grated or minced)"}, {"amount": "1/2", "unit": "teaspoon", "name": "ground ginger (or 1-inch fresh ginger, grated or minced)"}, {"amount": "3", "unit": "tablespoons", "name": "low-sodium soy sauce"}, {"amount": "1", "unit": "tablespoon", "name": "honey or brown sugar"}, {"amount": "1", "unit": "tablespoon", "name": "rice vinegar"}, {"amount": "1 to 3", "unit": "teaspoons", "name": "sriracha"}, {"amount": "1/3", "unit": "cup", "name": "mayo or plain yogurt"}, {"amount": "1 to 3", "unit": "teaspoons", "name": "sriracha, for serving"}, {"amount": "", "unit": "", "name": "Optional: a few handfuls of greens (arugula, mixed greens, or thinly sliced kale)"}, {"amount": "", "unit": "", "name": "Toasted peanuts, cashews, pepitas, or sesame seeds, for topping"}], "steps": ["Preheat the oven to 425F.", "Peel and cut the sweet potatoes into 1-inch cubes and add to a sheet pan. Toss with olive oil, salt, and black pepper and spread into a single layer. Roast for 25 to 30 minutes, until tender inside and crispy at the edges.", "While the sweet potatoes roast, mix the shredded carrots, sliced cucumbers, rice vinegar, sugar, and a pinch of salt in a bowl. Set aside as the quick-pickle.", "Heat the sesame oil in a large skillet over medium-high heat. Add the ground pork and half the sliced scallions and cook, breaking up the pork, until browned and cooked through, 6 to 8 minutes, until excess liquid evaporates and the pork starts to crisp up.", "Add the garlic powder and ginger to the pork and cook for 1 minute until fragrant. Add the soy sauce, honey, rice vinegar, and sriracha. Stir and cook 2 to 3 minutes until the sauce thickens and coats the pork. Remove from heat.", "To make the sriracha mayo, mix the mayo (or yogurt) with sriracha to taste.", "Divide the roasted sweet potatoes among 4 bowls. Add a handful of greens if using. Top with the ground pork, quick-pickled carrots and cucumbers, extra scallion, crushed peanuts, and a dollop of sriracha mayo."], "notes": "Serves 4. Cook time about 40 minutes."}, {"title": "Mustard-glazed pork tenderloin", "servings": null, "time": "", "tags": ["pork"], "ingredients": [{"amount": "1½", "unit": "pounds", "name": "pork tenderloins"}, {"amount": "3", "unit": "tablespoons", "name": "brown sugar"}, {"amount": "2", "unit": "tablespoons", "name": "grainy mustard"}, {"amount": "2", "unit": "teaspoons", "name": "chopped fresh or dried rosemary"}, {"amount": "2", "unit": "tablespoons", "name": "dry sherry"}], "steps": ["Pat the tenderloins dry with paper towels.", "Combine the remaining ingredients in a bowl and stir. Add pork tenderloins and turn to coat well with marinade. Marinate for 15 minutes or as long as overnight.", "Heat a large cast iron skillet or grill pan over medium-high heat until smoking. (Alternatively, heat a charcoal or gas grill to high; bank coals or turn off the burner on one side.) Season tenderloins with salt and pepper. Brush pan with olive oil and add tenderloins; reduce heat to medium-low. Cook, turning tenderloins every 3 to 4 minutes, until deeply caramelized on all sides and until desired internal temperature, about 20 to 25 minutes. (You can also broil the tenderloins in the oven --- about 10 minutes on one side, then turn and cook for about 5 minutes on the other.)", "Remove and lightly tent with foil; let rest for about 10 minutes before cutting into ¼- to ½-inch slices. # Sides"], "notes": "This savory-sweet treatment for pork tenderloin was brought to The Times in 1989 by the inimitable Marian Burros. With just five ingredients --- pork, brown sugar, whole-grain mustard, rosemary and sherry --- you have an extremely simple though supremely satisfying dish. We like ours served with mashed sweet potatoes and a pile of sautéed greens, and the leftovers make great sandwiches."}, {"title": "Mango slaw", "servings": null, "time": "", "tags": ["sides"], "ingredients": [{"amount": "1", "unit": "", "name": "(8-ounce) bag coleslaw (about 3 cups)"}, {"amount": "2", "unit": "", "name": "large, slightly firm mangoes (about 1¾ pounds), peeled, pitted and"}, {"amount": "", "unit": "", "name": "thinly sliced (about 2 cups)"}, {"amount": "½", "unit": "cup", "name": "chopped fresh cilantro"}, {"amount": "2", "unit": "tablespoons", "name": "freshly squeezed lime juice"}, {"amount": "1", "unit": "tablespoon", "name": "honey or agave syrup"}, {"amount": "¼", "unit": "teaspoon", "name": "celery salt"}, {"amount": "¼", "unit": "teaspoon", "name": "freshly ground black pepper"}], "steps": ["In a large bowl, combine all ingredients. Toss with tongs or a fork to combine.", "Refrigerate for at least 1 hour. Serve cold."], "notes": "There is absolutely nothing new about coleslaw, but there is something slightly intriguing about coleslaw with mangos. Often, when we think of coleslaw, we think of it as a side for fish and chips, barbecue or heavy, mayonnaise-drenched cabbage. But just think about the cool, crunchy sweetness of the cabbage, carrots and mango, paired with the spicy kick of jerk chicken. What's a better combination? You also don't have to serve it as a side: It can be tucked into a sandwich or wrap. One of the best things about this recipe is that all the ingredients are readily available, and there are many shortcuts you can take, like using a bagged mix. Who wants to ruin their knuckles on a box grater or break out the food processor?"}, {"title": "Oat and yogurt flatbread with green sauce and tomatoes", "servings": null, "time": "25 minutes", "tags": ["sides"], "ingredients": [{"amount": "1", "unit": "cup", "name": "(100 g) oat flour, plus more for dusting"}, {"amount": "½", "unit": "cup", "name": "(120 ml) thick yogurt, such as Turkish or Greek-style yogurt"}, {"amount": "½", "unit": "teaspoon", "name": "baking powder"}, {"amount": "1", "unit": "teaspoon", "name": "salt"}, {"amount": "", "unit": "", "name": "Olive oil, for the pan"}, {"amount": "1", "unit": "", "name": "large handful mixed fresh parsley and mint"}, {"amount": "½", "unit": "cup", "name": "(100 ml) olive oil"}, {"amount": "1", "unit": "tablespoon", "name": "apple cider vinegar"}, {"amount": "2", "unit": "tablespoons", "name": "fresh lemon juice"}, {"amount": "3--4", "unit": "", "name": "jalapeño slices"}, {"amount": "½", "unit": "", "name": "garlic clove, optional"}, {"amount": "1", "unit": "tablespoon", "name": "capers"}, {"amount": "", "unit": "", "name": "Salt, to taste"}, {"amount": "1", "unit": "cup", "name": "Turkish or Greek-style yogurt"}, {"amount": "4--8", "unit": "", "name": "ripe tomatoes, depending on size"}, {"amount": "1", "unit": "tablespoon", "name": "za'atar"}], "steps": ["Stir together the oat flour, baking powder, and salt in a bowl.", "Add the yogurt and stir until the mixture comes together into a sticky ball. Cover and leave to rest for 15 minutes. This allows the oat flour to hydrate and makes the dough easier to roll.", "Dust a clean work surface with oat flour and scrape out the dough. Shape it into a ball. If it feels very sticky, work in a little more oat flour. A small amount of potato starch or cornstarch can also help make the dough less sticky and more pliable.", "Divide the dough into 4 equal pieces and shape each piece into a ball. Keep the portions covered while you work so they do not dry out.", "Roll each ball into an oval about ⅛ inch (½ cm) thick.", "Heat a cast-iron or heavy skillet over medium heat. Brush the pan lightly with olive oil.", "Cook each flatbread for about 2 minutes on the first side, until golden with darker spots. Turn and cook for about 1 minute on the second side.", "Transfer the cooked flatbread to a clean kitchen towel and wrap loosely to keep warm while you cook the remaining pieces.", "Add the herbs, olive oil, vinegar, lemon juice, jalapeño, garlic, and capers to a food processor.", "Pulse a few times until coarsely combined. Do not blend completely smooth.", "Taste and adjust with more salt, lemon juice, vinegar, herbs, or olive oil as needed.", "If you do not have a food processor, finely chop the herbs, jalapeño, and garlic, then stir everything together in a bowl. A mortar and pestle also works well.", "Spread a thick layer of yogurt over each warm flatbread.", "Sprinkle generously with za'atar.", "Thinly slice the tomatoes and arrange them over the yogurt.", "Drizzle with the green sauce.", "Cut into slices and serve immediately."], "notes": "MAKES 4 small flatbreads or 2 large flatbreads These quick skillet flatbreads use oat flour and yogurt instead of wheat flour and yeast. They are soft, lightly nutty, and easy to make, with no proofing time required. Serve them topped with yogurt, ripe tomatoes, za'atar, and a bright herb sauce, or use them as a quick pizza base, breakfast bread, or accompaniment for dips and sauces. -   The recipe can be scaled up or down using a volume ratio of approximately 2 parts oat flour to 1 part yogurt. -   To make oat flour, blend rolled oats in a blender or food processor until finely ground. -   A little potato starch or cornstarch can make the dough softer and easier to handle. -   All-purpose flour can be substituted for oat flour using the same ratio and method. -   When good tomatoes are unavailable, try toppings such as scrambled eggs, pesto, roasted broccoli rabe, or other roasted vegetables. -   The flatbreads also work well as breakfast sandwiches, quick pizza bases, or breads for scooping up sauces."}, {"title": "Tomato, cucumber and corn salad", "servings": null, "time": "", "tags": ["sides"], "ingredients": [{"amount": "1 to 1¼", "unit": "pounds", "name": "ripe tomatoes, cut in small dice"}, {"amount": "", "unit": "", "name": "½European cucumber, 2 Persian cucumbers or 1 regular cucumber, peeled if"}, {"amount": "", "unit": "", "name": "waxy, seeded if the seeds are large, and cut in small dice"}, {"amount": "2", "unit": "", "name": "ears corn, steamed for 4 minutes and kernels removed from the cob"}, {"amount": "1", "unit": "", "name": "to 2serranos or jalapeño pepper, minced (seeded for a milder salad)"}, {"amount": "", "unit": "", "name": "or ½ teaspoon Aleppo pepper"}, {"amount": "", "unit": "", "name": "Salt to taste"}, {"amount": "¼", "unit": "cup", "name": "chopped cilantro"}, {"amount": "2", "unit": "tablespoons", "name": "rice vinegar"}, {"amount": "1", "unit": "tablespoon", "name": "fresh lime juice or lemon juice"}, {"amount": "2", "unit": "tablespoons", "name": "extra virgin olive oil"}, {"amount": "", "unit": "", "name": "Optional: 1 ounce feta, crumbled (about ¼ cup)"}], "steps": ["Mix together all of the ingredients. Let sit in or out of the refrigerator for 15 minutes before serving, then toss again."], "notes": "Advance preparation: This will hold for a few hours in the refrigerator."}, {"title": "Crunchy edamame salad with peanut sauce", "servings": null, "time": "", "tags": ["sides"], "ingredients": [{"amount": "", "unit": "", "name": "For the Peanut Sauce"}, {"amount": "1/3", "unit": "cup", "name": "creamy natural peanut butter"}, {"amount": "3", "unit": "tablespoons", "name": "coconut aminos (or reduced-sodium tamari or reduced-sodium"}, {"amount": "", "unit": "", "name": "soy sauce)"}, {"amount": "", "unit": "", "name": "Juice of 1 lime"}, {"amount": "1", "unit": "tablespoon", "name": "toasted sesame oil"}, {"amount": "1", "unit": "tablespoon", "name": "sriracha (optional)"}, {"amount": "1", "unit": "teaspoon", "name": "ground ginger"}, {"amount": "", "unit": "", "name": "For the Bowls"}, {"amount": "9", "unit": "ounces", "name": "shelled edamame, thawed if frozen"}, {"amount": "2", "unit": "cups", "name": "(6 ounces) shredded or thinly sliced cabbage"}, {"amount": "1 1/2", "unit": "cups", "name": "(5 ounces) shredded carrots"}, {"amount": "1", "unit": "", "name": "English cucumber, sliced into thin 2-3 inch matchsticks"}, {"amount": "6", "unit": "", "name": "green onions, thinly sliced"}, {"amount": "1/2", "unit": "cup", "name": "cilantro, finely chopped"}, {"amount": "1/4", "unit": "cup", "name": "chopped peanuts, optional for topping"}], "steps": ["Make the peanut sauce: add the peanut butter, coconut aminos, lime juice, sesame oil, sriracha, ginger, and 3 tablespoons of warm water to a large mixing bowl. Whisk until fully combined. Add additional warm water, one tablespoon at a time, as needed to thin until the peanut sauce is completely smooth.", "Assemble the salad: add the edamame, cabbage, carrots, cucumber, green onion, and cilantro to the mixing bowl. Toss the mix and coat the vegetables in the sauce.", "Serve: enjoy immediately with a sprinkle of peanut on top or store in a sealed container in the refrigerator for up to 4 days. # Holiday meals Christmas eve menu Roast Chicken Simple herb roast (lemon, garlic, rosemary or thyme) One large chicken (4--5 lb) or two smaller ones if you want leftovers for lunch the next day Roasted carrots and potatoes Leek & Greens Gratin Bitter, Leafy Salad with Lemon & Mustard Apple Cinnamon Galette Christmas day menu Rosemary or Porcini-Marinated Beef Tenderloin Mashed potatoes Brown Buttered Squash with Dates & Walnuts Chapati Sauce (optional but nice) Norwegian Cloudberry Cream Breakfasts, lunches & snacks (both days) Christmas Eve Breakfast", "Eggs or whatever we have and pastries on the way to the beach Christmas Day Breakfast", "Waffles", "Scrambled Eggs", "Bacon", "Toast", "Butter", "Orange juice", "Coffee, tea Lunches (both days)", "Leftover roast chicken sandwiches", "Fruit, cheese, bread, ham Snacks", "Clementines", "Nuts roasted rosemary", "Cheese + crackers", "Cut vegetables for kids"], "notes": "This crunchy edamame salad is all about texture and big, bold flavor. Crisp cabbage, sweet carrots, cool cucumber, and fresh herbs get tossed in a creamy peanut sauce with just the right balance of tang, spice, and nuttiness. It's a quick, vegan-friendly meal you can whip up in 15 minutes---and it's sturdy enough to hold up for meal prep all week."}, {"title": "Bitter, leafy salad", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "1", "unit": "", "name": "large head escarole, romaine or chicories like radicchio (if you don't"}, {"amount": "", "unit": "", "name": "mind the"}, {"amount": "", "unit": "", "name": "bitterness), torn into large pieces"}, {"amount": "1 1/2", "unit": "cups", "name": "parsley"}, {"amount": "¾", "unit": "cup", "name": "finely chopped chives"}, {"amount": "¼", "unit": "cup", "name": "tarragon or dill (optional)"}, {"amount": "3", "unit": "tablespoons", "name": "whole grain mustard"}, {"amount": "2", "unit": "tablespoons", "name": "fresh lemon juice or white wine vinegar, plus more"}, {"amount": "", "unit": "", "name": "Kosher salt, freshly ground black pepper"}, {"amount": "", "unit": "", "name": "Olive oil, for drizzling"}], "steps": ["Toss escarole, parsley, chives and tarragon together in a large bowl.", "To serve, whisk mustard and lemon juice together in a small bowl and season with salt and lots of black pepper. Spoon over lettuces and herbs, tossing to combine. Drizzle with olive oil and another seasoning of salt, pepper and more lemon juice if needed."], "notes": "This is an extremely simple salad meant to provide clean, crunchy relief from the fantastically heavy things on the table. You can use whatever mix of herbs and sturdy greens you can get your hands on here, all with varying degrees of bitterness (escarole, endive, radicchio, castelfranco, even hearty arugula would be nice). Use plenty of lemon juice or vinegar to make it adequately tangy, and do not skimp on black pepper. Just avoid anything that wilts as soon as it's dressed, as this salad should stick around on the table as long as possible. The lettuces and herbs can be combined in advance- just keep them either refrigerated or in a large bowl covered with a damp paper towel to prevent leaves from drying out. I don't love leftover salad, but honestly, since this one is made of escarole, you \\could\\ save it to wilt and eat with fried eggs the next day, or wilt into your turkey soup (you're making turkey soup, right?)"}, {"title": "Tangy fruit salad", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "2", "unit": "", "name": "oranges, peel and pith removed, thinly sliced"}, {"amount": "1-1 ½", "unit": "pounds", "name": "apples, persimmons, pears and or/ asian pears, thinly"}, {"amount": "", "unit": "", "name": "sliced"}, {"amount": "1", "unit": "", "name": "lemon, halved"}, {"amount": "", "unit": "", "name": "Kosher salt and freshly ground black pepper"}, {"amount": "", "unit": "", "name": "Aleppo-style pepper, optional"}, {"amount": "", "unit": "", "name": "Sumac, optional"}, {"amount": "", "unit": "", "name": "Olive oil, for drizzling"}], "steps": ["Arrange oranges and sliced apples, persimmons and/or pears on a large serving platter or inside a large shallow bowl.", "Squeeze the lemon over the fruit and season with salt and pepper, followed by aleppo-style pepper or sumac, if you have it and feel so compelled. Drizzle with olive oil before serving."], "notes": "Another sort of \"do whatever you want\" style salad, here to take the place (only in our minds, never our hearts) of the canned cranberry sauce (although this is not an either/or thing). Pomegranate seeds, halved figs, or whatever other autumnal fruit would be great here, just be sure to include the citrus and at least one crunchy tree fruit (apple, pear), for adequate acidity and ample crunchiness. I would do this at the last possible minute to prevent fruit from drying out or oxidizing. Sorry! If you don't mind slightly softer fruit, it's fine the next day for breakfast with yogurt/granola/etc."}, {"title": "Brown buttered squash, dates and walnuts", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "2", "unit": "pounds", "name": "squash, such as honeynut, butternut, kabocha or acorn"}, {"amount": "", "unit": "", "name": "quartered, seeds removed"}, {"amount": "6", "unit": "tablespoons", "name": "olive oil, divided"}, {"amount": "", "unit": "", "name": "Kosher salt, freshly ground black pepper"}, {"amount": "6", "unit": "tablespoons", "name": "unsalted butter"}, {"amount": "1", "unit": "cup", "name": "/ 4 ounces walnut halves or pieces, pecans, hazelnuts or almonds"}, {"amount": "", "unit": "", "name": "coarsely chopped"}, {"amount": "4", "unit": "ounces", "name": "of dates, about 9, pitted and torn in half"}, {"amount": "2", "unit": "tablespoons", "name": "thyme, marjoram or oregano leaves"}, {"amount": "", "unit": "", "name": "Flaky sea salt"}], "steps": ["Preheat the oven to 425°. Place squash on a rimmed baking sheet and drizzle with 4 tablespoons olive oil and season with salt and pepper. Make sure all the squash is cut-side down and roast, without turning, until completely tender and deeply caramelized on the underside (squash will never quite look caramelized on top, only where it meets the sheet tray. To check for doneness, the skin of the squash should look like a slightly deflated balloon, but you can also use a spatula to peek on the cut-side to check it for browning), 45--50 minutes (the squash can be roasted ahead, if you want to reheat in the oven closer to serving, pop into a 425° oven for 10--15 minutes).", "Meanwhile, melt butter in a small pot or skillet over medium heat. Once it starts to foam but before it's brown, add the remaining 2 tablespoons olive oil and walnuts. The nuts will foam up and disappear into the butter- don't forget about them.", "Swirl the pot, stirring constantly and continue to cook the walnuts in the browning butter. Eventually, the walnuts will toast and the butter will brown, 4--6 minutes. Remove from heat, add the dates and season with salt and pepper; remove from heat (this walnut/date mixture can be done ahead, just rewarm gently over medium heat before serving).", "To serve, transfer squash to a large serving platter or shallow bowl. Spoon walnut/date mixture over and scatter with thyme, flaky salt and another good grind of black pepper. DO AHEAD: Brown butter/walnut/date mixture can be made hours in advance; rewarm before serving. Squash can be roasted a few hours in advance,(its good room-temp, but great rewarmed). LEFTOVERS: I don't love how the butter solidifies when chilled, but even still, I would absolutely cut this squash up and eat it in a salad the next day. Or re-warm and eat with your leftover turkey."], "notes": "These squash have EVERYTHING: sweetness, saltiness, crunchiness, chewiness. They're saucy and tender and you don't have to peel the squash."}, {"title": "Frizzled green beans, mushrooms and onions", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "1", "unit": "pound", "name": "green beans, stems trimmed"}, {"amount": "1- 1 ½", "unit": "pounds", "name": "mixed mushrooms such as oyster, maitake, chicken of the"}, {"amount": "", "unit": "", "name": "woods, or baby"}, {"amount": "", "unit": "", "name": "bella, halved lengthwise or quartered if large"}, {"amount": "2", "unit": "", "name": "small red or yellow onions, cut through the root into ½\" wedges"}, {"amount": "⅓", "unit": "cup", "name": "olive oil, plus more for drizzling"}, {"amount": "2", "unit": "tablespoons", "name": "soy sauce or tamari"}, {"amount": "", "unit": "", "name": "Kosher salt, freshly ground pepper"}, {"amount": "2", "unit": "tablespoons", "name": "fresh oregano or marjoram leaves"}], "steps": ["Preheat the oven to 425°. Combine green beans, mushrooms, onion, olive oil and soy sauce together on a rimmed baking sheet (if doubling, use two sheets). Season with salt and pepper and toss. Roast, tossing once or twice, and adding more olive oil if needed, until the mushrooms are deeply browned and the green beans are tender and browned in spots, about 45 minutes.", "Remove from heat and toss with parsley, chives and oregano. Drizzle with more olive oil and give another crack of black pepper before serving. Do ahead Trim the green beans a day or two ahead of time, store them in a resealable bag Refrigerated. Everything can be roasted a few hours in advance, rewarmed before serving or go room-temp (I would!). Leftovers Best eaten out of the container, cold. Or turned into a salad over greens. If you must rewarm, a quick sauté in a skillet over medium--high heat should do the trick."], "notes": "Ever have a green bean casserole? It's good, but I think these are better (!). Lightly frizzled, tons of meaty flavor, mushrooms and green beans get roasted at the same time at the same temperature with olive oil and a little soy sauce (for salty flavor amplification, an ingredient in the OG green bean casserole recipe!). Finish with herbs if you're not otherwise making an Herby salad to accompany."}, {"title": "Leek and greens gratin", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "¼", "unit": "cup", "name": "plus 2 tablespoons olive oil"}, {"amount": "2", "unit": "", "name": "medium leeks (about 1 1/2 lbs), white and greens thinly sliced, rinsed"}, {"amount": "1", "unit": "", "name": "large (or 2 medium) bunch of curly or Tuscan kale or Swiss chard (about 1 lb), thick stems"}, {"amount": "", "unit": "", "name": "removed, leaves torn into bite-sized pieces"}, {"amount": "", "unit": "", "name": "Kosher salt, freshly ground black pepper"}, {"amount": "", "unit": "", "name": "Crushed chilli flakes (optional)"}, {"amount": "1 ½", "unit": "cups", "name": "heavy cream"}, {"amount": "1", "unit": "cup", "name": "finely grated parmesan, pecorino, white cheddar or gruyere"}, {"amount": "1 ½", "unit": "cups", "name": "fresh coarse bread crumbs or 1 cup panko"}], "steps": ["Heat ¼ cup olive oil in your largest skillet or heavy bottomed pot over medium--high heat. Add leeks and season with salt and pepper. Cook, stirring occasionally until the leeks are bright green and totally tender, almost melty, 10--15 minutes (they shouldn't get any color, but if they do, that's okay).", "Working with one handful at a time, add some kale and season with salt and pepper. Stir and let wilt between additions, repeating until you've added all the kale and it's nice and wilted, 5--8 minutes.", "Add crushed red pepper flakes if using, followed by heavy cream. Let the cream bubble up around the edges and use a spatula to scrape up any brown bits that may have formed while cooking the leeks and kale. Remove from heat, stir in the cheese and transfer everything to a 2-quart baking dish (you can do this part ahead of time, even a day or two; just cover and refrigerate until ready to top with bread crumbs and bake).", "When ready to bake, preheat the oven to 425°. Combine bread crumbs and remaining 2 tablespoons olive oil in a medium bowl. Season with salt and pepper and toss until crumbs are thoroughly saturated and evenly mixed. Scatter over leek and greens; bake until breadcrumbs are golden and bubbling nicely around the edges, 15--20 min. Remove from the oven and serve. DO AHEAD: The leek and greens mixture can be made the day before, if you must (wrap it tightly so it doesn't dry out). Same with bread crumb mixture. I wouldn't bake it till you're nearly ready to eat. LEFTOVERS: Weirdly great cold? Also, just a regular re-warm will do the trick here. If you have a microwave, great. If not, transfer the leftovers into an oven-safe container and heat in a 350° oven."], "notes": ""}, {"title": "Creamy buttermilk potatoes", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "2", "unit": "pounds", "name": "russet potatoes, peeled and cut into large chunks"}, {"amount": "2", "unit": "pounds", "name": "Yukon Gold or other creamy potato, peeled and cut into large"}, {"amount": "", "unit": "", "name": "chunks"}, {"amount": "", "unit": "", "name": "Kosher salt"}, {"amount": "1 ½", "unit": "cups", "name": "heavy cream"}, {"amount": "1", "unit": "cup", "name": "buttermilk, whole or 2% milk"}, {"amount": "4", "unit": "", "name": "garlic cloves, smashed"}, {"amount": "", "unit": "", "name": "Freshly ground black pepper"}, {"amount": "½", "unit": "cup", "name": "(1 stick) unsalted butter, plus more for serving"}, {"amount": "½", "unit": "cup", "name": "finely chopped chives"}], "steps": ["Place potatoes in a large pot and cover with about 2\" of salted water (salted like you're making pasta). Bring them to a boil and cook until all the potatoes are completely softened and tender (test one with a fork; it should be easily smashed), 45--60 minutes (I have a small burner, and it takes a while; if you have a large burner, it will not take as long). For what it's worth: if you're picking between overcooking and undercooking, I say overcook here (undercooked bits = lumps that never soften).", "Meanwhile, combine cream, buttermilk, and garlic in a medium pot and season with salt and lots of black pepper. Bring to a simmer and reduce heat to the lowest possible setting. Simmer the mixture until garlic cloves are completely softened, and the cream mixture is reduced by about ¼, 15--20 minutes; remove from heat.", "Drain potatoes and return them to the pot in which they were boiled. Using the back of a wooden spoon or other wooden-spoon-like implement, smash/crush the potatoes until they're totally mashed (a few lumps are fine by me). Want to use a ricer or potato masher? Go for it!", "Pour the hot cream mixture over the potatoes, followed by the butter and mix until well blended, but not gloopy or gummy. Season with salt and pepper before transferring to a serving bowl and topping with chives, more pepper and another knob of butter. DO AHEAD A helpful thing my mom would do is peel and cut the potatoes the night before and store them in the pot of salted water (don't even have to refrigerate). Potatoes continue to absorb liquid as they sit, so if you make these the day before you'll certainly have to add more liquid when reheating, which is fine, but will be a different texture. Just make them a few hours before dinner, keep them on the stove, and rewarm when you're ready to eat."], "notes": "Equal parts Yukon Gold and russet, heavy cream and lots of buttermilk. To be sure you don't end up with lumpy-in-a-bad-way potatoes, just make sure the potatoes are as tender as tender can be (without being waterlogged). You could finish with sour cream or more herbs."}, {"title": "Classic celery stuffing", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "1", "unit": "", "name": "large loaf good, crusty bread, preferably sourdough or ciabatta (about"}, {"amount": "1¼", "unit": "pounds", "name": ")"}, {"amount": "½", "unit": "cup", "name": "olive oil"}, {"amount": "8", "unit": "tablespoons", "name": "(1 stick) unsalted butter"}, {"amount": "8", "unit": "", "name": "garlic cloves, thinly sliced"}, {"amount": "2", "unit": "", "name": "medium yellow onions, thinly sliced (or 2 large leeks, thinly sliced)"}, {"amount": "", "unit": "", "name": "Kosher salt and freshly ground black pepper"}, {"amount": "4", "unit": "cups", "name": "celery, chopped, leaves reserved for garnish if available"}, {"amount": "1", "unit": "cup", "name": "dry white wine"}, {"amount": "2 ½", "unit": "cups", "name": "low-sodium chicken, turkey or vegetable broth"}, {"amount": "3", "unit": "", "name": "large eggs"}, {"amount": "1", "unit": "cup", "name": "finely chopped parsley or celery leaves"}, {"amount": "½", "unit": "cup", "name": "finely chopped chives"}, {"amount": "2", "unit": "tablespoons", "name": "finely chopped marjoram, oregano or thyme (optional)"}], "steps": ["Using your hands, tear bread, crust and all, into 1 1/2- to 2-inch pieces. (Alternatively, you can cut the bread with a knife, but I prefer the way the craggy bits toast and soak up the goods.) Place chunks on a rimmed baking sheet, and let sit uncovered at room temperature for 12 to 24 hours. If you're short on time, you can toast the chunks in a 300-degree oven instead, tossing occasionally, until dried out (but not browned) on the outside.", "Heat oven to 375°. In a large skillet over medium-high heat, combine olive oil and butter. Once butter has melted, add the garlic and onions. Season with salt and pepper and cook, stirring occasionally, until onions are totally softened, 10 to 12 minutes.", "Add celery, and season with salt and pepper. Cook, stirring occasionally until bright green and tender, 4 to 6 minutes. Add white wine, and cook until reduced by about half, 3 to 4 minutes.", "Whisk together broth and eggs in a medium bowl. Place bread in a large bowl (you want a lot of room for mixing, so go big), and add the egg mixture over everything and toss a few times (I like to use my hands here, but a wooden spoon is good, too). Let sit a minute or two and give another toss. Repeat twice until all the liquid has absorbed and evenly distributed to each and every piece of bread.", "Add the onion and celery mixture, parsley, chives and marjoram, if using. Stir to coat so that everything is evenly distributed, trying not to totally crush the bread.", "Transfer mixture to a 2 1/2- to 3-quart baking dish (a 9-by-13 pan also works, so does a cast iron, so does...), making sure not to pack it too tightly. (You want to keep the bread in the stuffing as light as possible.)", "Cover with foil and bake until the stuffing is sizzling at the edges and completely cooked through, 40--45 minutes. If it's not yet time to serve, remove stuffing from the oven and set aside. (If you are nearly ready to serve, proceed directly to the next step and continue without pausing.)", "When ready to serve, remove foil and increase temperature to 425 degrees. Bake stuffing until crispy, crunchy and impossibly golden brown on top, 20 to 25 minutes. Scatter with celery leaves, if using, and serve."], "notes": "This stuffing is a perfect food and if you don't like celery, I'm sorry! Sure, you could use fennel instead, but don't leave the vegetable out altogether---it provides flavor (fantastic flavor if you ask me), but also moisture to prevent the stuffing from drying out. Don't skip the second bake---that's when the magic (crispiness) happens. The bread can and should be torn a day or two ahead. The knife work for all the vegetables (slicing, etc) can be done the day before (store in a resealable bag, refrigerated). It can be baked the first time a few hours before dinner, then crisped up before dinner. I don't love baking it the night before, but if you are determined to do that, then go ahead! Re-crisping stuffing in a skillet with more butter might even be better than the first time. Top it with fried eggs, maybe? Also, great cold out of the container."}, {"title": "Porcini and rosemary-crusted beef tenderloin with port wine sauce", "servings": 6, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "1", "unit": "", "name": "center-cut beef tenderloin (about 3 pounds)"}, {"amount": "", "unit": "", "name": "Kosher salt"}, {"amount": "1", "unit": "ounce", "name": "dried porcini mushrooms"}, {"amount": "2", "unit": "tablespoons", "name": "finely chopped fresh rosemary leaves"}, {"amount": "1", "unit": "teaspoon", "name": "black peppercorns"}, {"amount": "", "unit": "", "name": "Olive oil"}, {"amount": "½", "unit": "ounce", "name": "dried porcini mushrooms"}, {"amount": "¾", "unit": "cup", "name": "water, for reconstituting the mushrooms"}, {"amount": "3", "unit": "tablespoons", "name": "unsalted butter, divided"}, {"amount": "1", "unit": "", "name": "medium shallot, finely chopped"}, {"amount": "1", "unit": "cup", "name": "port wine"}, {"amount": "1", "unit": "cup", "name": "full-bodied red wine"}, {"amount": "2", "unit": "", "name": "fresh rosemary sprigs"}, {"amount": "½", "unit": "teaspoon", "name": "salt, or to taste"}], "steps": ["Season the tenderloin generously all over with salt. Refrigerate for at least 4 hours and up to 24 hours. Remove the beef from the refrigerator 30 minutes before roasting.", "Heat the oven to 400°F (200°C).", "Combine the dried porcini, chopped rosemary, and peppercorns in a spice grinder. Grind to a coarse powder. The mushrooms must be completely dry and brittle to grind properly. If necessary, dry them briefly in a low oven until crisp.", "Rub the beef with olive oil, then coat it evenly with the porcini-rosemary mixture.", "Heat 1 tablespoon olive oil in a wide skillet over medium-high heat until shimmering. Add the beef and brown it on all sides, about 8 minutes total.", "Transfer the beef to a roasting pan. Roast until an instant-read thermometer inserted into The thickest part registers 125°F (52°C), about 30 minutes for medium-rare.", "Transfer the tenderloin to a cutting board, tent loosely with foil, and rest for 15 minutes.", "Slice the beef into ¼-inch slices and serve with the port wine sauce.", "While the beef cooks, soak the dried porcini in ¾ cup water until softened. Strain the soaking liquid through an unbleached paper towel or coffee filter into a small bowl. Reserve the liquid and coarsely chop the mushrooms.", "Using the same skillet in which the beef was browned, melt 1 tablespoon butter over medium heat. Add the shallot and chopped porcini. Cook until the shallot is translucent, about 2 minutes.", "Add the port, scraping up the browned bits from the bottom of the pan. Add the red wine, reserved mushroom liquid, and rosemary sprigs.", "Bring to a boil and cook, uncovered, until the sauce has reduced by about half, to approximately 1½ cups. Season with ½ teaspoon salt, or to taste.", "Strain the sauce through a fine-mesh sieve into a small saucepan, pressing firmly on the solids. Discard the solids.", "Warm the sauce over medium heat. Whisk in the remaining 2 tablespoons butter, 1 tablespoon at a time. Keep warm until serving."], "notes": "This roast is worth celebrating. Dried porcini mushrooms are ground to a powder with fresh rosemary, creating an umami-rich crust for the beef. It is excellent on its own, but served with a port wine reduction infused with rosemary and porcini, it becomes an elegant dinner worthy of a holiday celebration. For the juiciest meat and crispest crust, salt the tenderloin well in advance. The sauce uses a combination of port and red wine, but the red wine may be replaced with additional port. -   Trussing the tenderloin before browning can help it cook evenly and produce neatly shaped -   slices. -   The sauce is a relatively thin reduction rather than a thick gravy. -   The red wine may be replaced with an additional port."}, {"title": "Ina Garten's skillet-roasted lemon chicken", "servings": null, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "2", "unit": "teaspoons", "name": "fresh thyme leaves"}, {"amount": "1", "unit": "teaspoon", "name": "whole fennel seeds"}, {"amount": "1", "unit": "tablespoon", "name": "kosher salt, plus more for serving"}, {"amount": "1", "unit": "teaspoon", "name": "freshly ground black pepper"}, {"amount": "⅓", "unit": "cup", "name": "good olive oil"}, {"amount": "1", "unit": "", "name": "lemon, ends removed, halved through the stem, and sliced ¼ inch thick"}, {"amount": "1", "unit": "", "name": "yellow onion, halved and sliced ¼ inch thick"}, {"amount": "2", "unit": "", "name": "large garlic cloves, thinly sliced"}, {"amount": "1", "unit": "", "name": "whole chicken (about 4 pounds), backbone removed and butterflied"}, {"amount": "½", "unit": "cup", "name": "dry white wine, such as Pinot Grigio"}, {"amount": "", "unit": "", "name": "Juice of 1 lemon"}, {"amount": "", "unit": "", "name": "Minced fresh rosemary, optional"}], "steps": ["Heat the oven to 450°F (230°C).", "Place the thyme, fennel seeds, 1 tablespoon salt, and 1 teaspoon pepper in a mini food processor or spice grinder. Process until finely ground.", "Pour the olive oil into a small measuring cup. Stir in the herb mixture and set aside.", "Arrange the lemon slices in a 12-inch cast-iron skillet. Scatter the onion and garlic evenly over the lemon.", "Place the chicken skin-side down on top of the onion. Brush it with about half of the seasoned oil.", "Turn the chicken skin-side up. Pat the skin thoroughly dry with paper towels, then brush it with the remaining seasoned oil.", "Roast for 30 minutes.", "Pour the wine into the skillet around the chicken, taking care not to pour it over the skin. Return the skillet to the oven and roast for another 10--15 minutes, until a thermometer inserted into the thickest part of the breast registers 155--160°F (68--71°C).", "Remove the skillet from the oven. Sprinkle the chicken with the lemon juice. Cover the skillet tightly with aluminum foil and rest for 10--15 minutes.", "Cut the chicken into quarters or eighths. Season with additional salt and serve hot with the pan juices, roasted lemon, onion, and garlic."], "notes": "A butterflied chicken roasts over sliced lemon, onion, and garlic in a cast-iron skillet. Thyme, fennel seed, olive oil, and white wine create a deeply flavored pan sauce, while the roasted lemon slices become soft and caramelized enough to eat with the chicken. Assemble the chicken in the skillet and refrigerate for a few hours before roasting. -   The roasted lemon slices are intended to be eaten with the chicken. -   For an additional herbal note, sprinkle the cooked chicken with minced fresh rosemary before -   covering it to rest. ##"}, {"title": "Very good turkey with tangy roasted shallots", "servings": 10, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "12-16", "unit": "lb", "name": "turkey"}, {"amount": "½", "unit": "cup", "name": "kosher salt"}, {"amount": "½", "unit": "cup", "name": "light brown sugar"}, {"amount": "3--4", "unit": "tablespoons", "name": "coarsely ground black pepper\\*"}, {"amount": "", "unit": "", "name": "OPTIONAL ADDITIONS: ½ cup finely chopped rosemary or thyme, ¼ cup"}, {"amount": "", "unit": "", "name": "crushed fennel seed or red pepper flakes, 2"}, {"amount": "", "unit": "tablespoons", "name": "finely grated garlic or lemon zest"}, {"amount": "1", "unit": "bunch", "name": "oregano, marjoram and/or thyme"}, {"amount": "2", "unit": "heads", "name": "garlic, halved crosswise"}, {"amount": "2", "unit": "pounds", "name": "shallots or small red onions, halved lengthwise, quartered if"}, {"amount": "", "unit": "", "name": "large, peeled if you like"}, {"amount": "", "unit": "", "name": "Olive oil, for drizzling"}, {"amount": "2", "unit": "tablespoons", "name": "red or white wine vinegar"}], "steps": ["Combine the kosher salt, brown sugar, and cracked pepper, along with any other seasonings you'd like to add in a small bowl.", "Place the turkey on a rimmed baking sheet lined with a wire rack. Remove the giblets (the bagged heart, kidneys and liver, and the neck) from the cavity. Using paper towels, pat the turkey dry on all sides. Very tenderly rub the brine all over the turkey, making sure to distribute the seasoning evenly to all the bits and parts, inside and out, but don't worry about getting under the skin.", "Refrigerate the turkey, uncovered, for at least 12 and up to 48 hours.", "Remove the turkey from the fridge and transfer it to a clean baking sheet (or rinse the one it was on). Let sit at room temperature for 2-3 hours.", "Preheat the oven to 325°.", "Stuff the turkey cavity with any celery leaves, quartered onions, a halved head of garlic, leek tops, parsley stems, oregano and thyme you have lying around. Rest the turkey on top of some oregano or thyme if you have any to spare and a halved head of garlic. Scatter the shallots around the turkey. Drizzle everything with olive oil and season the shallots with a little salt and pepper. Truss the turkey's legs with some cooking twine if you'd like.", "Transfer the turkey to the oven and roast, rotating the sheet pan and basting the turkey once or twice, for 3 ½ --4 hours, or until the turkey is deeply golden brown and the internal temperature is 165 degrees (a few degrees shy of 165 is OK, it will come to temp as it rests). Remove from the oven and let rest for at least an hour before carving.", "Transfer the shallots to a serving bowl and drizzle with vinegar."], "notes": "This is a recipe for the most basic version of a well-seasoned turkey, which is sometimes all you want. Know that if you're looking for a little more, some things that would be a great addition to include are listed below (Chopped rosemary or thyme! Crushed fennel seed or red pepper flakes! Finely grated garlic or lemon zest!). While I don't recommend going above a 16 pound turkey, y
