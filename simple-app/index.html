ou can always adjust the seasoning to accommodate a larger bird by doubling the dry brine. As for the time, you'll need to increase the time in the oven by up to an hour, depending on how large the bird is."}, {"title": "Excellent gravy", "servings": null, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "¼", "unit": "cup", "name": "unsalted butter"}, {"amount": "¼", "unit": "cup", "name": "all purpose flour or 3 tablespoons Wondra flour"}, {"amount": "4", "unit": "cups", "name": "liquid (pan drippings + turkey stock)"}, {"amount": "1--2", "unit": "teaspoons", "name": "dijon mustard"}, {"amount": "1", "unit": "tablespoon", "name": "soy sauce or tamari, plus more"}, {"amount": "", "unit": "", "name": "A few sprigs of thyme (optional)"}], "steps": ["In a small pot, heat the butter over medium heat. When it's melted, but before it begins to brown, add the flour and cook, whisking constantly, until the roux sizzles, thickens, and turns golden, about 3 minutes (it will look thin, not thick).", "Add the liquid a little at a time, whisking constantly to incorporate completely between additions (it'll look a little wonky and clumpy at first, which is fine---it'll all come together!), whisking until all the liquid is incorporated. Bring to a simmer, then add dijon and soy sauce to taste---it should be tangy, salty and deeply meaty. Add a few sprigs of thyme if using and simmer until the gravy reaches your desired thickness, adding more stock if it's thicker than you'd like."], "notes": "Makes about 3 1/2 cups"}, {"title": "Turkey stock", "servings": null, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "3", "unit": "pounds", "name": "turkey wings"}, {"amount": "2", "unit": "tablespoons", "name": "olive oil, plus more"}, {"amount": "", "unit": "", "name": "Turkey liver and neck"}, {"amount": "2", "unit": "", "name": "large or 3 medium carrots, chopped"}, {"amount": "2", "unit": "", "name": "large unpeeled onions, or a mix of onions and shallots, chopped"}, {"amount": "½", "unit": "bunch", "name": "celery, chopped"}], "steps": ["Preheat the oven to 450 degrees.", "Place the turkey wings on a sheet pan. Drizzle with neutral oil or olive oil and season with salt and pepper. Roast, flipping once halfway through, for about 40 minutes.", "Heat 2 tablespoons of olive oil in a large stock pot over medium heat. Add turkey neck and liver and cook, flipping once, until golden on both sides, about 6-8 minutes. Add carrots, onions, and celery. Season with salt and pepper. Add roasted turkey wings.", "Pour a little water onto the sheet pan you roasted the turkey wings on. Using a fish spatula or wooden spoon, scrape up all the browned bits and add that to the stock, too.", "Cover with 16 cups of water. Season with more salt and simmer gently until stock is reduced and very flavorful, about 3--3 ½ hours. Taste and adjust seasonings.", "Using tongs, remove the wings and set aside in a bowl for snacking on later. Then, ladle the vegetables and remaining turkey parts into a sieve or colander set over a large bowl. Let them sit for a minute or two so any remaining liquid drains into the bowl, then carefully pour the rest of the stock through the sieve. Transfer to quart containers and refrigerate."], "notes": "Makes about 4 quarts"}, {"title": "Apple cinnamon galette", "servings": null, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "1", "unit": "", "name": "disc the only pie crust"}, {"amount": "4", "unit": "tablespoons", "name": "(½ stick) unsalted butter"}, {"amount": "⅓", "unit": "cup", "name": "light brown sugar"}, {"amount": "½", "unit": "teaspoon", "name": "ground cinnamon"}, {"amount": "1 1/2", "unit": "lbs", "name": "unpeeled crisp, tart apples such as pink lady or honeycrisp"}, {"amount": "", "unit": "", "name": "thinly sliced. (2"}, {"amount": "", "unit": "pounds", "name": "if you're coring the apple)"}, {"amount": "1", "unit": "", "name": "egg, beaten"}, {"amount": "", "unit": "", "name": "Granulated sugar, for sprinkling"}, {"amount": "", "unit": "", "name": "Flaky salt, for sprinkling"}], "steps": ["Preheat the oven to 375 degrees.", "On a lightly floured surface, roll out the crust into a circle about 15-16 inches in diameter. Transfer to a parchment-lined baking sheet and put in the refrigerator while you prepare the filling.", "Melt the butter in a small pot or skillet over medium-high heat. Cook, stirring or whisking occasionally until the butter starts to brown and foam, 2 to 3 minutes, scraping up all the browned bits on the bottom of the pot. Remove the pot from heat to cool, and use a whisk or fork to scrape up all the browned bits on the bottom of the pot. Set aside.", "Combine the brown sugar and cinnamon in a small bowl.", "Arrange the apples in an even layer over the pie crusts, leaving about a 2\" border. Pour or brush brown butter over the apples, then sprinkle with the brown sugar mixture. Fold the edges of the crust up over the apples, then brush the edges with an egg wash and sprinkle with granulated sugar and flaky salt.", "Transfer to the oven and bake until deeply golden, about 60 to 75 minutes."], "notes": "Truthfully, at the end of a meal where you simply can't eat another thing, there is nothing better than a thin, perfect, buttery crust topped with a layer thinly sliced apples, brushed with browned butter and sprinkled with cinnamon laced brown sugar (and some flaky salt!). Use the crust recipe below (which is The Only Pie Crust, alternatively titled, The Only Tart/Galette Crust), or whatever pie crust you have confidence in."}, {"title": "The only pie crust", "servings": null, "time": "", "tags": ["holiday"], "ingredients": [{"amount": "2 ½", "unit": "cups", "name": "all-purpose flour, plus more for rolling"}, {"amount": "2", "unit": "teaspoons", "name": "sugar"}, {"amount": "1", "unit": "teaspoon", "name": "kosher salt"}, {"amount": "1 ¼", "unit": "cups", "name": "(2 ½ sticks) unsalted butter, cut into 1-inch pieces, chilled"}, {"amount": "1", "unit": "tablespoon", "name": "apple cider vinegar or white distilled vinegar"}, {"amount": "¼", "unit": "cup", "name": "ice water"}], "steps": ["In a large bowl, whisk the flour, sugar, and salt together. Add the butter and toss to coat it in the flour mixture. Using your hands, smash the butter between your palms and fingertips, mixing it into the flour, creating long, thin, flaky, floury, buttery bits. Once most of the butter is incorporated and there are no large chunks remaining, dump the flour mixture onto a work surface.", "Combine the vinegar with the ice water and drizzle it over the flour-butter mixture. Run your fingers through the mixture like you're running your fingers through your hair, just to evenly distribute the water through the flour until the dough starts coming together.", "Knead the dough a few more times, just to gather up any dry bits from the bottom and place them on the top to be incorporated. Once you've got a shaggy mass of dough (it will not be smooth and it certainly will not be shiny), knead it once or twice more and divide it in half. Pat each piece into a flat disk, about 1 inch thick. Wrap each disk individually in plastic wrap and refrigerate for at least 2 hours."], "notes": "Makes two crusts This dough can be made up to 4 days ahead, tightly wrapped, and stored in the refrigerator; or made 1 month ahead, tightly wrapped in a resealable plastic bag, and frozen."}, {"title": "Sweetgreen chicken pesto parm bowl", "servings": 2, "time": "50 min (20 min prep, 30 min cook)", "tags": ["salad", "chicken"], "ingredients": [{"amount": "4", "unit": "cups", "name": "spinach"}, {"amount": "2", "unit": "cups", "name": "water"}, {"amount": "1", "unit": "cup", "name": "quinoa"}, {"amount": "1", "unit": "cup", "name": "cherry tomatoes"}, {"amount": "1/4", "unit": "cup", "name": "parmesan"}, {"amount": "2", "unit": "", "name": "chicken breasts"}, {"amount": "2", "unit": "tbsp", "name": "olive oil (for chicken)"}, {"amount": "2", "unit": "tsp", "name": "umami seasoning (for chicken)"}, {"amount": "2", "unit": "cups", "name": "broccoli"}, {"amount": "1", "unit": "tbsp", "name": "olive oil (for broccoli)"}, {"amount": "1", "unit": "tsp", "name": "umami seasoning (for broccoli)"}, {"amount": "", "unit": "pinch", "name": "red pepper flakes"}, {"amount": "1", "unit": "", "name": "slice bread"}, {"amount": "1", "unit": "tbsp", "name": "olive oil (for breadcrumbs)"}, {"amount": "1", "unit": "tsp", "name": "za'atar"}, {"amount": "1", "unit": "cup", "name": "basil"}, {"amount": "1/4", "unit": "cup", "name": "olive oil (for vinaigrette)"}, {"amount": "2", "unit": "tbsp", "name": "apple cider vinegar"}, {"amount": "2", "unit": "tsp", "name": "umami seasoning (for vinaigrette)"}, {"amount": "1", "unit": "tsp", "name": "garlic"}], "steps": ["Preheat the oven to 425F. Toss the chicken breasts with olive oil and umami seasoning, spread on a lined baking sheet, and roast about 20 minutes until they reach 165F internally.", "Slice the roasted chicken into bite-sized cubes.", "Toss the broccoli with olive oil, umami seasoning, and red pepper flakes. Roast on a lined baking sheet for about 15 minutes (can go in at the same time as the chicken).", "Bring the water to a boil in a pot, stir in the quinoa, cover, reduce heat to low, and cook 15-20 minutes.", "Halve the cherry tomatoes.", "Pulse the bread in a food processor into small breadcrumbs. Toast in a pan over medium heat with olive oil and za'atar, stirring constantly, until golden.", "Blend the basil, olive oil, apple cider vinegar, umami seasoning, and garlic in a food processor until smooth to make the vinaigrette.", "In a large bowl, toss the spinach and cooked quinoa with the vinaigrette. Divide between two bowls and top with the roasted chicken, cherry tomatoes, roasted broccoli, parmesan, and za'atar breadcrumbs."], "notes": "Sweetgreen-style copycat bowl."}, {"title": "Sweetgreen harvest bowl", "servings": 4, "time": "", "tags": ["salad", "chicken"], "ingredients": [{"amount": "8", "unit": "cups", "name": "kale, deveined, washed and chopped"}, {"amount": "2", "unit": "cups", "name": "wild rice, cooked"}, {"amount": "2", "unit": "cups", "name": "chicken breast, cooked and cubed"}, {"amount": "1", "unit": "tsp", "name": "umami seasoning"}, {"amount": "1", "unit": "tbsp", "name": "olive oil (for sweet potatoes)"}, {"amount": "1", "unit": "cup", "name": "sweet potatoes, roasted in cubes"}, {"amount": "1", "unit": "cup", "name": "apples, chopped"}, {"amount": "1/4", "unit": "cup", "name": "goat cheese, crumbled"}, {"amount": "1/4", "unit": "cup", "name": "almonds, chopped"}, {"amount": "1/2", "unit": "cup", "name": "plain Greek yogurt (0% fat)"}, {"amount": "1/4", "unit": "cup", "name": "balsamic vinegar"}, {"amount": "1", "unit": "tsp", "name": "Dijon mustard"}, {"amount": "1", "unit": "tsp", "name": "honey"}, {"amount": "", "unit": "", "name": "juice from half a lemon"}, {"amount": "1/4", "unit": "tsp", "name": "salt"}, {"amount": "1/4", "unit": "tsp", "name": "freshly ground black pepper"}, {"amount": "2", "unit": "tbsp", "name": "olive oil (for dressing)"}], "steps": ["Cook the wild rice according to package directions (use chicken stock instead of water for more flavor).", "Preheat the oven to 375F. Line two baking sheets with parchment. Put the chicken breasts on one and the sweet potatoes on the other. Toss the sweet potatoes with olive oil, season both the chicken and sweet potatoes generously with salt and pepper, and sprinkle the chicken with umami seasoning. Roast both for about 30 minutes, until the chicken reaches 165F internally.", "Meanwhile, chop the kale, apples, and almonds and set aside.", "For the dressing, combine the yogurt, balsamic vinegar, Dijon, honey, lemon juice, salt, and pepper in a small bowl. Whisk in the olive oil slowly until emulsified.", "Combine all the salad ingredients in a large bowl, pour the dressing over the top, and toss to combine."], "notes": "Sweetgreen-style copycat bowl."}, {"title": "Sweetgreen inspired harvest bowl chickpea salad", "servings": null, "time": "", "tags": ["salad", "vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "name": "dry wild rice, rinsed"}, {"amount": "1", "unit": "", "name": "large sweet potato, peeled and diced into 1/2-inch cubes"}, {"amount": "1", "unit": "tbsp", "name": "olive oil (for sweet potato)"}, {"amount": "", "unit": "", "name": "kosher salt"}, {"amount": "", "unit": "", "name": "ground black pepper"}, {"amount": "4", "unit": "cups", "name": "shredded curly kale (about 6 ounces)"}, {"amount": "1", "unit": "", "name": "15-ounce can chickpeas, drained and rinsed"}, {"amount": "1", "unit": "", "name": "red apple, cored and diced into 1/2-inch cubes"}, {"amount": "4", "unit": "oz", "name": "crumbled goat cheese"}, {"amount": "1/4", "unit": "cup", "name": "balsamic vinegar"}, {"amount": "1", "unit": "tbsp", "name": "Dijon mustard"}, {"amount": "1", "unit": "tbsp", "name": "maple syrup"}, {"amount": "1", "unit": "tsp", "name": "garlic powder"}, {"amount": "3/4", "unit": "tsp", "name": "kosher salt (for dressing), plus more to taste"}, {"amount": "1/2", "unit": "tsp", "name": "ground black pepper (for dressing)"}, {"amount": "3", "unit": "tbsp", "name": "olive oil (for dressing)"}], "steps": ["Preheat the oven to 400F. Bring 2 1/2 cups of water to a boil in a saucepan over medium-high heat.", "Add the rinsed wild rice, reduce heat to low, cover, and simmer until the water is absorbed, 35 to 40 minutes.", "Meanwhile, toss the diced sweet potato with olive oil, salt, and pepper on a large sheet pan. Spread in one even layer and roast until slightly crisp, 18 to 20 minutes.", "While the potatoes roast, make the dressing: blend the balsamic vinegar, Dijon, maple syrup, garlic powder, salt, pepper, and 2 tablespoons warm water until combined, about 30 seconds. While still blending, stream in the olive oil until the dressing is light brown and emulsified, about 30 more seconds. Taste and add more salt if needed.", "Add the kale to a large bowl and drizzle with some of the dressing (start with half if you don't want too much). Toss to coat. Add the cooked wild rice, roasted sweet potatoes, chickpeas, diced apple, and goat cheese, and gently toss to combine. Add more dressing to taste and serve."], "notes": "Sweetgreen-style copycat bowl, vegetarian."}, {"title": "Lemon blueberry cake", "servings": 8, "time": "", "tags": ["dessert", "baking"], "ingredients": [{"amount": "150", "unit": "g", "name": "unsalted butter, cubed, at room temperature (about 1/2 cup + 2 tbsp)"}, {"amount": "200", "unit": "g", "name": "granulated sugar (about 1 cup)"}, {"amount": "1", "unit": "", "name": "lemon, zested"}, {"amount": "2", "unit": "tbsp", "name": "fresh lemon juice, divided (1 tbsp for batter, 1 tbsp for glaze)"}, {"amount": "1", "unit": "tsp", "name": "pure vanilla extract"}, {"amount": "3", "unit": "", "name": "large eggs, at room temperature"}, {"amount": "90", "unit": "g", "name": "all-purpose flour (about 2/3 cup)"}, {"amount": "110", "unit": "g", "name": "almond flour (about 3/4 cup + 2 tbsp)"}, {"amount": "1/2", "unit": "tsp", "name": "baking powder, preferably aluminum-free"}, {"amount": "1/4", "unit": "tsp", "name": "salt"}, {"amount": "200", "unit": "g", "name": "blueberries, fresh or frozen (about 7 oz)"}, {"amount": "70", "unit": "g", "name": "powdered sugar (about 1/2 cup + 1 tbsp)"}], "steps": ["Preheat the oven to 400F (200C). Butter an 8 1/2 x 4 1/2-inch loaf pan and line the bottom with a piece of parchment paper.", "Beat the butter, granulated sugar, lemon zest, and 1 tablespoon of the lemon juice on high speed for 3-4 minutes, until light and fluffy.", "Scrape down the bowl, then beat in the vanilla and eggs one at a time on low speed. The batter may look a little curdled at this point — that's normal.", "In a separate bowl, whisk together the flour, almond flour, baking powder, and salt. Add to the batter in three additions, mixing until just combined.", "Gently fold in three-quarters of the blueberries with a spatula, taking care not to overmix or smash the berries.", "Scrape the batter into the prepared pan, smooth the top, and bake for 15 minutes. Scatter the remaining blueberries over the top and bake for another 15 minutes.", "Loosely cover the pan with foil and keep baking until a toothpick inserted in the center comes out clean, usually another 10-15 minutes (about 25-45 minutes total baking time — check with a toothpick rather than going by time alone).", "Let the cake cool in the pan for 10 minutes, then turn it out, peel off the parchment, and let it cool completely on a wire rack.", "Whisk the powdered sugar with the remaining tablespoon of lemon juice and pour the glaze over the cooled cake, smoothing it with a spatula or the back of a spoon."], "notes": "Adapted from Ottolenghi Simple by Yotam Ottolenghi (via David Lebovitz). If using frozen blueberries, keep them frozen until you use them, including the ones added on top in step 6 — don't thaw. No almond flour on hand? Grind about 110g sliced or slivered almonds with the flour in a food processor instead."}, {"title": "Tamar's banana bread (or muffins)", "servings": null, "time": "25-40 min bake", "tags": ["dessert", "baking"], "ingredients": [{"amount": "2", "unit": "", "name": "eggs"}, {"amount": "1/3", "unit": "cup", "name": "oil or butter"}, {"amount": "3 to 4", "unit": "", "name": "ripe bananas, mashed (go with 4 if you can)"}, {"amount": "2/3", "unit": "cup", "name": "sugar (half brown sugar works well; use a little less if using more bananas)"}, {"amount": "1", "unit": "tsp", "name": "vanilla"}, {"amount": "1 3/4", "unit": "cups", "name": "gluten-free flour"}, {"amount": "3/4", "unit": "tsp", "name": "baking soda"}, {"amount": "1", "unit": "tsp", "name": "baking powder (or cream of tartar)"}, {"amount": "1/2", "unit": "tsp", "name": "salt"}, {"amount": "1", "unit": "tsp", "name": "cinnamon"}, {"amount": "3/4", "unit": "cup", "name": "chopped nuts (optional)"}, {"amount": "3/4", "unit": "cup", "name": "dark chocolate chips (optional)"}, {"amount": "", "unit": "", "name": "a little extra sugar, for sprinkling on top"}], "steps": ["Preheat the oven to 350F. Grease a bread pan or line muffin tins.", "Mash the bananas in a big bowl, then mix in the eggs and the oil or melted butter.", "Add the sugar and vanilla and mix.", "Mix in the dry ingredients and stir gently — don't overstir.", "Fold in the nuts and chocolate chips, if using.", "Pour into the pan or tins and sprinkle a little sugar over the top.", "Bake about 25-40 minutes (gluten-free flour tends to bake faster), until golden and a toothpick comes out clean."], "notes": "Tamar's own recipe. Eat a lot and smile :)"}, {"title": "Chinese-style beef and broccoli", "servings": 4, "time": "", "tags": ["meat", "dinner"], "ingredients": [{"amount": "2", "unit": "tbsp", "name": "sesame seeds"}, {"amount": "1", "unit": "tsp", "name": "five-spice powder (optional)"}, {"amount": "2", "unit": "tbsp", "name": "coconut oil"}, {"amount": "1", "unit": "lb", "name": "ground beef (minimum 20% fat)"}, {"amount": "1", "unit": "", "name": "medium onion, sliced"}, {"amount": "2", "unit": "", "name": "medium carrots, cut into matchsticks"}, {"amount": "2", "unit": "", "name": "medium heads broccoli, cut into small florets, stalks sliced (after cutting off the tough outer layer)"}, {"amount": "1", "unit": "", "name": "red pepper, deseeded and sliced"}, {"amount": "1", "unit": "tbsp", "name": "fresh root ginger, grated"}, {"amount": "4", "unit": "", "name": "garlic cloves, finely diced"}, {"amount": "3", "unit": "tbsp", "name": "soy sauce (optional)"}, {"amount": "1 1/2", "unit": "tbsp", "name": "fish sauce (nam pla)"}, {"amount": "", "unit": "", "name": "sea salt and white pepper, to taste"}, {"amount": "1", "unit": "tbsp", "name": "coconut flour, for thickening the sauce (optional)"}, {"amount": "", "unit": "", "name": "juice of 1/2 lemon, or 2 tbsp apple cider vinegar"}, {"amount": ": "1/4", "unit": "cup", "name": "tahini (70g)"}, {"amount": "2", "unit": "tsp", "name": "za'atar"}], "steps": ["Set the tomatoes in a sieve over a bowl and let them drain for 20 minutes. Transfer the tomatoes to a large bowl (discard the drained liquid), then add the cucumbers, red pepper, green onions, cilantro, lemon juice, olive oil, and about 1/2 teaspoon salt. Mix to combine.", "When ready to serve, move the salad to a serving bowl, add the feta, and mix gently. Pour the tahini over the top and finish with the za'atar and a final sprinkle of salt."], "notes": "From a cookbook — serves 4 as a starter or side. Best with a creamy, pourable tahini (Israeli, Palestinian, or Lebanese brands tend to work better here than Greek or Cypriot ones). Good with just the feta blocks alongside, or served with grilled lamb or rice and lentils."}, {"title": "Roasted whole cauliflower with green tahini sauce", "servings": 4, "time": "", "tags": ["sides", "vegetarian"], "ingredients": [{"amount": "1", "unit": "", "name": "jumbo cauliflower, with all leaves intact (2 3/4 lb/1.3kg)"}, {"amount": "3", "unit": "tbsp", "name": "unsalted butter, at room temperature"}, {"amount": "2", "unit": "tbsp", "name": "olive oil"}, {"amount": "", "unit": "", "name": "flaked sea salt"}, {"amount": "1", "unit": "", "name": "lemon, cut into wedges, to serve"}, {"amount": "rounded 1/4", "unit": "cup", "name": "tahini, for the sauce (80g)"}, {"amount": "3/4", "unit": "cup", "name": "parsley, roughly chopped, for the sauce (15g)"}, {"amount": "1", "unit": "", "name": "small garlic clove, crushed, for the sauce"}, {"amount": "1/3", "unit": "cup", "name": "water, for the sauce (80ml)"}, {"amount": "3", "unit": "tbsp", "name": "lemon juice, for the sauce"}, {"amount": "", "unit": "", "name": "flaked sea salt, for the sauce"}], "steps": ["Using scissors, lightly trim the leaves at the top of the cauliflower so that about 2 inches (5cm) of the actual cauliflower head is exposed.", "Fill a pan large enough to fit the whole cauliflower three-quarters full with salted water. Bring to a boil, then carefully lower in the cauliflower, exposed head down — it's fine if the base sticks out a bit. Bring back to a boil and cook for 6 minutes, then use a slotted spoon to transfer the cauliflower to a colander, exposed head down. Let it drain and cool for 10 minutes.", "Preheat the oven to 375F.", "Mix together the butter and oil. Set the cauliflower on a medium baking sheet, exposed head facing up, and spread the butter-oil mixture all over it, followed by about 1 1/4 teaspoons flaked salt. Roast for 1 1/2 to 2 hours, basting with the oil 5-6 times during cooking, until the cauliflower is very tender and dark golden brown with crisp, charred leaves.", "Remove from the oven and let it rest for 5 minutes, then cut into wedges (or pull it apart by hand). Serve with the lemon wedges and a sprinkle of salt, or with the green tahini sauce.", "For the green tahini sauce: put the tahini in a food processor with the parsley and garlic. Blitz for about a minute, until the tahini turns green, then add the water and lemon juice and season with about 1/4 teaspoon flaked salt. Keep blitzing until you have a smooth sauce with the consistency of heavy cream — add a touch more tahini if it's too thin, or a splash more water if it's too thick."], "notes": "From a cookbook — serves 4. The tahini sauce is entirely optional and keeps in the fridge up to 3 days; a squeeze of lemon or a dollop of crème fraîche work well instead. Traditionally broken apart by hand and dipped, or cut into wedges and eaten with a knife and fork."}, {"title": "Sweet potato mash with lime salsa", "servings": 4, "time": "", "tags": ["sides", "vegetarian"], "ingredients": [{"amount": "2 lb 2", "unit": "oz", "name": "sweet potatoes (1kg), unpeeled, cut in half lengthwise"}, {"amount": "1/4", "unit": "cup", "name": "olive oil (60ml), divided"}, {"amount": "", "unit": "", "name": "salt"}, {"amount": "1/4", "unit": "cup", "name": "basil leaves, finely chopped (5g)"}, {"amount": "1/4", "unit": "cup", "name": "cilantro, finely chopped (5g)"}, {"amount": "1/2", "unit": "clove", "name": "garlic, crushed"}, {"amount": "2", "unit": "", "name": "limes: finely zest to get 2 tsp, then juice to get 1 tbsp"}, {"amount": "", "unit": "", "name": "black pepper"}], "steps": ["Preheat the oven to 425F.", "Rub the sweet potatoes with 1 tablespoon of the oil and season with 1/4 teaspoon salt. Place on a parchment-lined baking sheet, cut side down, and roast for 30-35 minutes, until very soft.", "While the sweet potatoes roast, make the salsa: put the remaining 3 tablespoons of oil in a small bowl with the basil, cilantro, garlic, lime zest, lime juice, and a good pinch of salt, and stir to combine.", "Once cool enough to handle, remove the skins from the sweet potatoes — they should slide off easily, or you can scoop the flesh out with a spoon. Mash the flesh with 1/8 teaspoon salt and plenty of black pepper until smooth.", "Transfer to a platter, make divots in the surface, and spoon the salsa evenly over the top. Serve hot."], "notes": "From a cookbook — serves 4 as a side. Good alongside grilled chops, grilled sausages, pan-fried pork loin, or tofu."}, {"title": "Roasted beets with yogurt and preserved lemon", "servings": 4, "time": "", "tags": ["sides", "vegetarian"], "ingredients": [{"amount": "2 lb 2", "unit": "oz", "name": "beets (1kg), unpeeled but scrubbed"}, {"amount": "2", "unit": "tbsp", "name": "olive oil"}, {"amount": "1 1/2", "unit": "tsp", "name": "cumin seeds"}, {"amount": "1", "unit": "", "name": "small red onion, very thinly sliced (mounded 1 cup/100g)"}, {"amount": "1", "unit": "", "name": "small preserved lemon, skin and flesh finely chopped, seeds discarded (1/4 cup/40g)"}, {"amount": "2", "unit": "tbsp", "name": "lemon juice"}, {"amount": "3/4", "unit": "cup", "name": "dill, roughly chopped, divided (15g total)"}, {"amount": "", "unit": "", "name": "salt and black pepper"}, {"amount": "1", "unit": "tbsp", "name": "tahini"}, {"amount": "1/2", "unit": "cup", "name": "Greek-style yogurt (150g)"}], "steps": ["Preheat the oven to 450F.", "Wrap the beets individually in foil, place on a baking sheet, and roast for 30-60 minutes depending on size, until a knife goes through smoothly. When cool enough to handle, peel off the skin and cut each beet into 1/4-inch (1/2cm) slices. Place in a large mixing bowl and set aside to cool.", "Put the olive oil in a small frying pan over medium heat. Add the cumin seeds and cook for about 3 minutes, until they start to pop. Pour the seeds and oil over the beets along with the onion, preserved lemon, lemon juice, 1/2 cup (10g) of the dill, 1 teaspoon salt, and a grind of black pepper. Mix everything together well, then transfer to a large serving plate.", "Stir the tahini into the yogurt and dot it over the beets in four or five places. Stir minimally — you want the yogurt and beets to mix only slightly — then sprinkle with the remaining 1/4 cup (5g) dill."], "notes": "From a cookbook — serves 4 as a side. Can be made a day ahead: hold back the dill and tahini yogurt and keep everything in the fridge until ready to serve. Great with oily fish (smoked mackerel or trout, steamed salmon) or over cooked lentils."}, {"title": "Carrot salad with yogurt and cinnamon", "servings": 4, "time": "", "tags": ["sides", "vegetarian"], "ingredients": [{"amount": "2 lb 2", "unit": "oz", "name": "long, thin baby carrots (1kg), unpeeled but scrubbed, stalk trimmed to about 1 1/4 inches (3cm)"}, {"amount": "3", "unit": "tbsp", "name": "olive oil"}, {"amount": "1 1/2", "unit": "tbsp", "name": "apple cider vinegar"}, {"amount": "1", "unit": "tsp", "name": "honey"}, {"amount": "1", "unit": "clove", "name": "garlic, crushed"}, {"amount": "1/8", "unit": "tsp", "name": "ground cinnamon"}, {"amount": "", "unit": "", "name": "salt and black pepper"}, {"amount": "1/2", "unit": "cup", "name": "Greek-style yogurt (120g)"}, {"amount": "1/4", "unit": "cup", "name": "crème fraîche (60g)"}, {"amount": "1/4", "unit": "cup", "name": "dill, roughly chopped (5g)"}, {"amount": "1/2", "unit": "cup", "name": "cilantro, roughly chopped (10g)"}], "steps": ["Steam the carrots for 8-12 minutes, depending on thickness, until cooked through but still with some bite.", "Meanwhile, whisk together the olive oil, vinegar, honey, garlic, cinnamon, 1/2 teaspoon salt, and lots of pepper in a large bowl. Once combined, add the carrots as soon as they're cooked. Mix well and set aside to cool.", "Mix together the yogurt and crème fraîche in a medium bowl with 1/4 teaspoon salt. Add this to the carrots, along with the dill and cilantro. Stir through gently — you don't want to overmix. Transfer carefully to a serving bowl and serve."], "notes": "From a cookbook — serves 4 as a side. Regular carrots, halved or quartered lengthwise, work fine if you don't have baby carrots. The carrots and dressing can be made 6 hours ahead, or up to a day ahead if refrigerated — bring back to room temperature and add the yogurt and herbs just before serving. Good alongside couscous and tomato salad or slow-cooked lamb."}, {"title": "Pizza bianca with potato, anchovy, and sage", "servings": 2, "time": "", "tags": ["dinner", "baking"], "ingredients": [{"amount": "1 cup plus 6", "unit": "tbsp", "name": "bread flour (200g), plus extra for dusting the worktop"}, {"amount": "1", "unit": "tsp", "name": "fast-acting instant dried yeast"}, {"amount": "1", "unit": "tbsp", "name": "olive oil, plus extra for greasing"}, {"amount": "", "unit": "", "name": "salt"}, {"amount": "1/2", "unit": "cup", "name": "lukewarm water (120ml)"}, {"amount": "6 1/3", "unit": "oz", "name": "new potatoes (180g), unpeeled and thinly sliced on a mandoline"}, {"amount": "3", "unit": "tbsp", "name": "olive oil, for the topping"}, {"amount": "", "unit": "", "name": "salt and black pepper"}, {"amount": "3/4 cup plus 1 1/2", "unit": "tbsp", "name": "mascarpone (200g)"}, {"amount": "1 1/2", "unit": "oz", "name": "pecorino romano, finely grated (40g)"}, {"amount": "4", "unit": "", "name": "anchovy fillets, drained and finely chopped"}, {"amount": "8", "unit": "", "name": "sage leaves, finely chopped"}, {"amount": "2", "unit": "", "name": "lemons: finely zest to get 2 tsp"}, {"amount": "5", "unit": "", "name": "green onions, thinly sliced at an angle (rounded 3/4 cup/50g)"}], "steps": ["Put the flour and yeast in a large bowl with the oil and 1/2 teaspoon salt. Stir to combine, then pour in the water and use a spatula to bring it together. Transfer to a lightly oiled surface and knead with lightly oiled hands for 5 minutes, until soft and elastic, adding more oil if it starts to stick. Divide the dough in half and transfer to a large parchment-lined baking sheet, spaced well apart. Cover with a slightly damp kitchen towel and let rise somewhere warm for 60-90 minutes, until doubled in size.", "Preheat the oven to 475F, or as high as it goes.", "While the dough rises, make the topping. In a small bowl, combine the potatoes with 1 tablespoon of oil, 1/8 teaspoon salt, and a good grind of pepper. Spread the potato slices on a parchment-lined baking sheet, big enough that they lie flat and spaced apart. Roast for 7 minutes, until golden brown, then set aside.", "In a small bowl, combine the mascarpone, pecorino, anchovies, sage, and lemon zest with a good grind of pepper, and set aside.", "Grease two large baking sheets with olive oil. Lightly flour your work surface. Working with one piece at a time, roll the dough into a 12 x 8 inch (30 x 20cm) rectangle. Carefully transfer to a baking sheet and repeat with the second ball of dough. Spread the mascarpone mixture evenly over both dough bases, leaving a 3/4 inch (2cm) border uncovered around the edge. Sprinkle the green onions on top, then layer on the potatoes. Drizzle each pizza with about 1 tablespoon of oil and bake for 9 minutes, until the edges are crisp and golden. Serve warm with a good grind of black pepper."], "notes": "From a cookbook — makes two pizzas, serving two as a main with a salad, or four as a snack. Dough can be made up to 3 days ahead and refrigerated; the potato and mascarpone topping can be made the day before."}, {"title": "Crispy smashed potatoes with fried onions and parsley", "servings": 4, "time": "", "tags": ["sides"], "ingredients": [{"amount": "", "unit": "", "name": "kosher salt"}, {"amount": "1 1/4", "unit": "lb", "name": "new potatoes (1 to 2 inches, about golf-ball size) or small fingerlings"}, {"amount": "1/3", "unit": "cup", "name": "chicken fat, olive oil, or peanut oil"}, {"amount": "", "unit": "", "name": "freshly ground black pepper"}, {"amount": "2", "unit": "tbsp", "name": "unsalted butter (1/4 stick)"}, {"amount": "1/2", "unit": "", "name": "small yellow onion, thinly sliced into rings"}, {"amount": "1", "unit": "tsp", "name": "Aleppo pepper (or 1/2 tsp crushed red pepper flakes)"}, {"amount": "", "unit": "", "name": "flaky sea salt"}, {"amount": "1/4", "unit": "cup", "name": "chopped fresh flat-leaf parsley"}], "steps": ["Bring 2 inches of salted water to a boil in a large pot fitted with a steamer basket. Add the potatoes and season with salt. Cover and steam until tender, 8-10 minutes (check a smaller one after 8 minutes — a fork should go in easily). If you don't have a steamer basket, just boil them in a large pot of salted water until tender, 10-15 minutes.", "Remove the potatoes and let them cool slightly. Using the bottom of a bowl or cup, or the palm of your hand, smash the potatoes until just crushed to expose the inside, but not so much that they fall apart.", "Heat the chicken fat (or oil) in a large skillet over medium-high heat. Add the potatoes in a single layer, working in batches if needed, and season with kosher salt and black pepper. Cook until both sides are deeply browned and crispy, about 5 minutes per side.", "Remove the potatoes with a slotted spoon and transfer to a serving bowl. Add the butter to the skillet and let it melt and foam. Add the onion rings in a single layer and season with salt and pepper. Cook, swirling the skillet occasionally, until the onions turn golden brown and start to crisp, 4-6 minutes.", "Take the skillet off the heat and stir in the red pepper flakes, swirling to combine. Pour the onions and any butter over the potatoes and finish with flaky sea salt and the parsley."], "notes": "From a cookbook — serves 4. Use small, waxy new potatoes; large Idaho/baking potatoes won't work here. Key tips: don't over- or under-steam, let the potatoes cool a bit before smashing so they hold together, and make sure the oil is properly hot before frying or it'll soak in instead of crisping up."}, {"title": "Fennel and grapefruit salad with honey and mint", "servings": 4, "time": "", "tags": ["salad"], "ingredients": [{"amount": "2", "unit": "tsp", "name": "fennel seed"}, {"amount": "1", "unit": "", "name": "small shallot, thinly sliced"}, {"amount": "2", "unit": "tbsp", "name": "fresh lime juice, plus more as needed"}, {"amount": "2", "unit": "tsp", "name": "honey"}, {"amount": "1", "unit": "tsp", "name": "ground sumac"}, {"amount": "", "unit": "", "name": "kosher salt and freshly ground black pepper"}, {"amount": "2", "unit": "", "name": "large red, pink, or pomelo grapefruits, peel and pith removed, sliced into 1/2-inch rounds and cut into bite-sized pieces"}, {"amount": "1", "unit": "", "name": "medium fennel bulb, thinly sliced crosswise"}, {"amount": "1", "unit": "cup", "name": "fresh mint leaves"}, {"amount": "1", "unit": "cup", "name": "fresh tender parsley, leaves and stems"}, {"amount": "2", "unit": "tbsp", "name": "olive oil"}], "steps": ["Toast the fennel seed in a small skillet over medium heat, swirling frequently, until light golden brown and very fragrant, about 2 minutes. Transfer to a cutting board to cool slightly, then crush with the side of a chef's knife (or chop). Combine the crushed seeds in a small bowl with the shallot, lime juice, honey, and sumac. Season with salt and pepper, toss to combine, and let sit a few minutes.", "Toss the grapefruit, fennel, mint, and parsley together in a medium bowl, then add the shallot mixture and any liquid. Mix well and season with salt and pepper. Drizzle with the olive oil just before serving."], "notes": "From a cookbook — serves 4. Pink or ruby red grapefruits give the best color and flavor; pomelos are a good alternative but tend to be less sweet and tangy, so adjust the honey and lime accordingly."}, {"title": "Coconut-crusted fish fingers", "servings": 4, "time": "", "tags": ["fish"], "ingredients": [{"amount": "1 lb 2", "unit": "oz", "name": "skinless and boneless haddock or other firm white fish (500g), cut into about 12 pieces, each roughly 1 1/4 x 4 inches (3x10cm)"}, {"amount": "2", "unit": "tbsp", "name": "lime juice"}, {"amount": "1/4", "unit": "cup", "name": "coconut cream (60ml)"}, {"amount": "", "unit": "", "name": "salt"}, {"amount": "7", "unit": "oz", "name": "fresh coconut flesh, coarsely grated (200g, from 1 medium coconut) — or 2 cups (150g) dried unsweetened shredded coconut"}, {"amount": "1/3", "unit": "cup", "name": "panko breadcrumbs (20g)"}, {"amount": "1", "unit": "tsp", "name": "crushed red pepper flakes"}, {"amount": "1/4", "unit": "cup", "name": "unsalted butter, melted (60g)"}, {"amount": "1", "unit": "", "name": "lime, quartered, to serve"}], "steps": ["Place the fish in a bowl with the lime juice, coconut cream, and 1/4 teaspoon salt. Mix, then refrigerate for about 1 hour to marinate — don't leave it much longer, or the fish will start to break down. Scrape off and discard as much of the cream as you can, then set the fish aside.", "Heat a large frying pan over medium-high heat and, once hot, add the coconut. Dry-fry for 6-7 minutes (or just 2-3 minutes if using dried coconut), stirring occasionally, until golden. Transfer to a medium shallow bowl and let cool, then mix in the panko, pepper flakes, and 1/2 teaspoon salt.", "When ready to cook, preheat your broiler to high.", "Working one piece at a time, dip a piece of fish into the melted butter, then into the coconut mixture, tossing to coat on all sides. Transfer to a wire rack set on a large parchment-lined baking sheet. Repeat with the remaining fish.", "Broil on the center oven rack (not too close to the heat, or it will burn) for 5-6 minutes, carefully turning the pieces after 2-3 minutes, until cooked through and golden brown. If the coating browns before the fish is cooked, turn off the broiler and leave the fish in the residual heat for 2-3 minutes to finish. Serve with the lime wedges."], "notes": "From a cookbook — serves 4, a fun alternative to classic fish fingers for kids. The pepper flakes aren't very hot, but reduce or skip them if that's a concern."}, {"title": "Pan-fried salmon with pine nut salsa", "servings": 4, "time": "", "tags": ["fish"], "ingredients": [{"amount": "3/4", "unit": "cup", "name": "currants (100g)"}, {"amount": "4", "unit": "", "name": "salmon fillets, skin on, pinbones removed (1 lb 2 oz/500g)"}, {"amount": "7", "unit": "tbsp", "name": "olive oil (100ml), divided"}, {"amount": "", "unit": "", "name": "salt and black pepper"}, {"amount": "4", "unit": "", "name": "medium celery stalks, cut into 1/2-inch dice (1 3/4 cups/180g); leaves removed but kept for garnish"}, {"amount": "1/4", "unit": "cup", "name": "pine nuts, roughly chopped (30g)"}, {"amount": "1/4", "unit": "cup", "name": "capers, plus 2 tbsp of their brine (40g)"}, {"amount": "1/3", "unit": "cup", "name": "large green olives, pitted and diced 1/2-inch (40g, about 8 olives)"}, {"amount": "1/4", "unit": "tsp", "name": "saffron threads (a good pinch), mixed with 1 tbsp hot water"}, {"amount": "1", "unit": "cup", "name": "parsley, roughly chopped (20g)"}, {"amount": "1", "unit": "", "name": "lemon: finely zest to get 1 tsp, then juice to get 1 tsp"}], "steps": ["Cover the currants with boiling water and set aside to soak for 20 minutes while you prep the salmon and make the salsa.", "Mix the salmon with 1 tablespoon of the oil, a rounded 1/4 teaspoon salt, and a good grind of pepper. Set aside while you make the salsa.", "Put 5 tablespoons (75ml) of the olive oil in a large sauté pan over high heat. Add the celery and pine nuts and fry for 4-5 minutes, stirring frequently, until the nuts start to brown (keep a close eye on them — they burn easily). Remove from the heat and stir in the capers and their brine, the olives, the saffron and its water, and a pinch of salt. Drain the currants and add those too, along with the parsley, lemon zest, and lemon juice. Set aside.", "Put the remaining tablespoon of oil in a large frying pan over medium-high heat. Once hot, add the salmon fillets skin side down and fry for 3 minutes, until the skin is crisp. Reduce the heat to medium, flip the fillets, and continue frying for 2-4 minutes depending on how well done you like it. Remove from the pan and set aside.", "Arrange the salmon on four plates and spoon the salsa over the top. Scatter the reserved celery leaves on top."], "notes": "From a cookbook, referenced in the film Bridget Jones's Baby. Serves 4 — halve the recipe for two."}, {"title": "Soba noodles with lime, cardamom, and avocado", "servings": 4, "time": "", "tags": ["salad", "vegetarian"], "ingredients": [{"amount": "7", "unit": "oz", "name": "buckwheat noodles or green tea soba (200g)"}, {"amount": "12", "unit": "", "name": "green cardamom pods"}, {"amount": "1 1/2", "unit": "cups", "name": "basil leaves, roughly chopped (30g)"}, {"amount": "1 1/2", "unit": "cups", "name": "cilantro leaves, roughly chopped (30g)"}, {"amount": "1/2", "unit": "cup", "name": "shelled pistachios, roughly chopped (70g)"}, {"amount": "3", "unit": "", "name": "limes: finely zest 2 to get 1 tsp, then juice to get 3 tbsp; slice the last lime into 4 wedges to serve"}, {"amount": "3", "unit": "tbsp", "name": "peanut oil"}, {"amount": "1", "unit": "", "name": "green chile, seeded and thinly sliced"}, {"amount": "2", "unit": "", "name": "ripe avocados, cut into 1/4-inch (1/2cm) slices"}, {"amount": "", "unit": "", "name": "salt"}, {"amount": "1/4", "unit": "tsp", "name": "nigella seeds or Urfa chile flakes, to sprinkle (optional)"}], "steps": ["Cook the noodles according to the package instructions (they vary by brand). Once cooked, refresh under cold running water and drain well in a colander.", "Using the flat side of a knife, crush the cardamom pods to open them up. Scrape the seeds into a pestle and mortar and discard the outer husks. Crush the seeds — you should get about 1/2 teaspoon — and add to a large bowl with the noodles. Add the basil, cilantro, pistachios, lime zest, lime juice, peanut oil, chile, avocado, and 1/2 teaspoon salt. Mix everything together well, then divide among four bowls. Spoon any avocado, nuts, and herbs left in the bowl on top. Sprinkle with the nigella seeds and serve with a lime wedge alongside."], "notes": "From a cookbook — serves 4. Good as is for a quick lunch, or with shrimp or tofu stirred in just before serving; also works alongside pan-fried salmon or topped with a soft-boiled egg."}, {"title": "Chocolate pecan scones", "servings": null, "time": "", "tags": ["dessert", "baking"], "ingredients": [{"amount": "3 tbsp plus 4", "unit": "cups", "name": "all-purpose flour, divided"}, {"amount": "1 1/2", "unit": "cups", "name": "medium-diced bittersweet chocolate, such as Lindt (8 oz)"}, {"amount": "1", "unit": "cup", "name": "chopped pecans"}, {"amount": "2", "unit": "tbsp", "name": "sugar, plus additional for sprinkling"}, {"amount": "2", "unit": "tbsp", "name": "baking powder"}, {"amount": "4", "unit": "tsp", "name": "kosher salt"}, {"amount": "3/4", "unit": "lb", "name": "cold unsalted butter, 1/2-inch diced"}, {"amount": "1", "unit": "cup", "name": "cold heavy cream"}, {"amount": "4", "unit": "", "name": "extra-large eggs, lightly beaten"}, {"amount": "1", "unit": "", "name": "egg beaten with 2 tbsp water or cream, for egg wash"}], "steps": ["Preheat the oven to 400F. Arrange two racks evenly spaced in the oven and line two sheet pans with parchment paper.", "In a small bowl, combine the 3 tablespoons of flour with the chocolate and pecans, and set aside.", "In the bowl of an electric mixer fitted with the paddle attachment, combine the 4 cups flour, sugar, baking powder, and salt. Add the butter and, with the mixer on low, blend until the butter is the size of peas.", "Measure the cream into a 2-cup glass measuring cup, add the eggs, and beat until combined. With the mixer still on low, pour the wet mixture into the dry mixture and mix just until blended. Add the chocolate and pecan mixture and mix just until combined — the dough will be very sticky.", "Turn the dough out onto a very well-floured surface and knead it a few times to distribute the chocolate and pecans evenly, adding a little flour so it doesn't stick to the board. Flour your hands and a rolling pin and roll the dough 3/4 to 1 inch thick — you should still see lumps of butter in the dough.", "Cut the dough with a 3-inch plain round cutter and place the scones on the prepared sheet pans. Reroll the scraps and cut out more scones.", "Brush the tops with the egg wash, sprinkle with sugar, and bake for 20 minutes, switching the pans halfway through, until the tops are lightly browned and the insides are fully baked. Serve warm or at room temperature."], "notes": "From a cookbook — makes 14 to 16 large scones. Use good bittersweet chocolate, diced by hand rather than chips, for melted pockets throughout. The full 4 teaspoons of kosher salt is intentional (Diamond Crystal brand) — cut back if using a denser salt like Morton's. Cold butter bits are key for flaky layers: as the dough bakes, steam from the butter's moisture is what makes it rise."}, {"title": "Popcorn chicken + rainbow root fries", "servings": 4, "time": "", "tags": ["chicken", "kids"], "ingredients": [{"amount": "400", "unit": "g", "name": "skin-on root vegetables, sliced into batons (carrot, parsnip, potato, sweet potato, or beetroot)"}, {"amount": "6", "unit": "tbsp", "name": "coconut oil"}, {"amount": "3", "unit": "", "name": "eggs, beaten"}, {"amount": "12", "unit": "tbsp", "name": "ground almonds"}, {"amount": "3", "unit": "", "name": "chicken breasts, diced into 4-5 small cubes each"}, {"amount": "", "unit": "", "name": "splash of olive oil"}], "steps": ["Preheat the oven to 200C/fan 180C/Gas mark 6 (400F).", "Place the baby-fist-sized slices of root veg in a roasting tray and add the coconut oil. Roast for 45-60 minutes.", "Meanwhile, line up three bowls. Crack the egg into the first one and whisk. Add the almonds to the second and leave the third empty.", "Take a cube of chicken and dunk it in the egg, then roll it in the almonds, coating on all sides. Place in the final bowl and do the rest.", "To cook, either bake for 7-8 minutes, turning once, or fry in a splash of olive oil for 3-4 minutes, moving the pieces around regularly to encourage even cooking. Once golden and toasty, cut one in half to check the meat is thoroughly cooked — you may need to cook in batches.", "Let cool slightly before serving alongside the fries."], "notes": "From a baby/toddler-led weaning cookbook — for 2 adults plus 2 little ones. A nutritious, finger-food-friendly take on chicken and chips."}, {"title": "Carne asada with chipotle cashew nut salsa", "servings": 4, "time": "", "tags": ["meat", "tacos"], "ingredients": [{"amount": "500", "unit": "g", "name": "bavette, onglet, or rump steak (1 lb 2 oz)"}, {"amount": "300", "unit": "ml", "name": "smoky steak marinade (store-bought, or a homemade smoky/spiced steak marinade of your choice)"}, {"amount": "16", "unit": "", "name": "corn tortillas"}, {"amount": "4", "unit": "tbsp", "name": "chipotle cashew nut salsa"}, {"amount": "4", "unit": "tbsp", "name": "pico de gallo"}, {"amount": "2", "unit": "", "name": "limes, quartered"}, {"amount": "100", "unit": "ml", "name": " const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TAG_COLORS = {}; // recipe.id-tag -> class, computed dynamically
const TAG_CLASS_LIST = ['tag-herb','tag-tomato','tag-mustard','tag-plum','tag-gray'];

let recipes = [];
let menu = {}; // { Mon: recipeId|null, ... }
let shoppingList = []; // [{id,name,amount,unit,checked,source}]
let importMsg = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function armConfirm(btn, confirmText, action){
  if(btn.dataset.armed === '1'){
    delete btn.dataset.armed;
    action();
    return;
  }
  btn.dataset.armed = '1';
  btn.dataset.originalText = btn.textContent;
  btn.textContent = confirmText;
  btn.classList.add('danger');
  clearTimeout(btn._armTimeout);
  btn._armTimeout = setTimeout(()=>{
    if(btn.dataset.armed==='1'){
      delete btn.dataset.armed;
      btn.textContent = btn.dataset.originalText;
      btn.classList.remove('danger');
    }
  }, 3000);
}

async function loadAll(){
  loadRecipes();
  try{
    const m = localStorage.getItem('recipe-box-weekly-menu');
    menu = m ? JSON.parse(m) : {};
  }catch(e){ menu = {}; }
  DAYS.forEach(d=>{
    if(!(d in menu) || menu[d] === null || menu[d] === undefined) menu[d] = [];
    else if(!Array.isArray(menu[d])) menu[d] = [menu[d]]; // migrate old single-value format
  });
  try{
    const s = localStorage.getItem('recipe-box-shopping-list');
    shoppingList = s ? JSON.parse(s) : [];
  }catch(e){ shoppingList = []; }
  await autoMergeNewRecipes();
}

function loadRecipes(){
  try{
    const r = localStorage.getItem('recipe-box-recipes');
    recipes = r ? JSON.parse(r) : [];
  }catch(e){ recipes = []; }
}

async function autoMergeNewRecipes(){
  const existingTitles = new Set(recipes.map(r=>r.title.trim().toLowerCase()));
  let added = 0;
  IMPORTED_RECIPES.forEach(rec=>{
    if(existingTitles.has(rec.title.trim().toLowerCase())) return;
    recipes.push({ ...rec, id: uid() });
    existingTitles.add(rec.title.trim().toLowerCase());
    added++;
  });
  if(added > 0){
    const ok = await saveRecipes();
    importMsg = ok
      ? { type:'ok', text: `Added ${added} new recipe${added===1?'':'s'} automatically.` }
      : { type:'error', text: `Added ${added} new recipe${added===1?'':'s'} here, but your browser's storage may be full — they might not stay after you close this tab.` };
  }
}

async function saveRecipes(){
  try{
    localStorage.setItem('recipe-box-recipes', JSON.stringify(recipes));
    return true;
  }catch(e){
    console.error('save recipes failed', e);
    return false;
  }
}
async function saveMenu(){
  try{
    localStorage.setItem('recipe-box-weekly-menu', JSON.stringify(menu));
    return true;
  }catch(e){
    console.error('save menu failed', e);
    return false;
  }
}
async function saveShoppingList(){
  try{
    localStorage.setItem('recipe-box-shopping-list', JSON.stringify(shoppingList));
    return true;
  }catch(e){
    console.error('save shopping list failed', e);
    return false;
  }
}

function tagClass(tag){
  let hash=0;
  for(let i=0;i<tag.length;i++) hash = (hash*31 + tag.charCodeAt(i))>>>0;
  return TAG_CLASS_LIST[hash % TAG_CLASS_LIST.length];
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- RECIPES TAB ---------------- */
let searchTerm = '';
let activeTagFilter = null;

function allTags(){
  const s = new Set();
  recipes.forEach(r => (r.tags||[]).forEach(t=>s.add(t)));
  return [...s];
}

function renderRecipesPanel(){
  const panel = document.getElementById('panel-recipes');
  const searchWasFocused = document.activeElement && document.activeElement.id === 'searchInput';
  const caretPos = searchWasFocused ? document.activeElement.selectionStart : null;

  const filtered = recipes.filter(r=>{
    const matchesSearch = !searchTerm || r.title.toLowerCase().includes(searchTerm.toLowerCase());
    const matchesTag = !activeTagFilter || (r.tags||[]).includes(activeTagFilter);
    return matchesSearch && matchesTag;
  });

  let tagFilterHtml = allTags().map(t=>
    `<button class="ghost small tagbtn" data-tag="${escapeHtml(t)}" style="${activeTagFilter===t?'background:var(--herb-pale);border-color:var(--herb);':''}">${escapeHtml(t)}</button>`
  ).join('');

  panel.innerHTML = `
    <div class="toolbar">
      <div class="search"><input type="text" id="searchInput" placeholder="Search your recipes" value="${escapeHtml(searchTerm)}"></div>
      <div class="row">
        <button id="addRecipeBtn">+ Add recipe</button>
      </div>
    </div>
    ${importMsg ? `<div style="background:${importMsg.type==='error' ? 'var(--tomato-pale)' : 'var(--herb-pale)'}; color:${importMsg.type==='error' ? '#8f3a20' : 'var(--herb-dark)'}; padding:8px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <span>${escapeHtml(importMsg.text)}</span>
      ${importMsg.type==='error' ? '<button class="ghost small" id="retryMergeBtn" style="flex-shrink:0;">Retry now</button>' : ''}
    </div>` : ''}
    ${allTags().length ? `<div class="row" style="margin-bottom:16px;">${tagFilterHtml}${activeTagFilter ? '<button class="ghost small" id="clearTagFilter">Clear filter</button>' : ''}</div>` : ''}
    ${filtered.length === 0 ? `
      <div class="empty">
        <div class="big">${recipes.length===0 ? "Your box is empty" : "No recipes match"}</div>
        <div>${recipes.length===0 ? "Add the first recipe you don't want to lose." : "Try a different search or tag."}</div>
      </div>
    ` : `<div class="grid">${filtered.map(cardHtml).join('')}</div>`}
  `;

  document.getElementById('addRecipeBtn').onclick = ()=>openRecipeForm(null);
  const retryBtn = document.getElementById('retryMergeBtn');
  if(retryBtn) retryBtn.onclick = async ()=>{
    retryBtn.textContent = 'Retrying...';
    const ok = await saveRecipes();
    importMsg = ok ? { type:'ok', text: 'Saved.' } : { type:'error', text: `Still couldn't save — your browser's storage may be full. Your recipes are visible for now but might not stay after you close this tab.` };
    renderRecipesPanel();
  };
  document.getElementById('searchInput').oninput = (e)=>{ searchTerm = e.target.value; renderRecipesPanel(); };
  if(searchWasFocused){
    const si = document.getElementById('searchInput');
    si.focus();
    const pos = caretPos===null ? si.value.length : caretPos;
    si.setSelectionRange(pos, pos);
  }
  document.querySelectorAll('.tagbtn').forEach(b=>{
    b.onclick = ()=>{ activeTagFilter = activeTagFilter===b.dataset.tag ? null : b.dataset.tag; renderRecipesPanel(); };
  });
  const clearBtn = document.getElementById('clearTagFilter');
  if(clearBtn) clearBtn.onclick = ()=>{ activeTagFilter=null; renderRecipesPanel(); };
  document.querySelectorAll('.recipe-card').forEach(el=>{
    el.onclick = ()=>openRecipeDetail(el.dataset.id);
  });
}

function cardHtml(r){
  const stripe = (r.tags && r.tags[0]) ? tagClass(r.tags[0]) : 'tag-gray';
  return `
    <div class="recipe-card ${stripe}" data-id="${r.id}">
      <h3>${escapeHtml(r.title)}</h3>
      <div class="meta-line">
        <span>${r.servings ? r.servings+' servings' : ''}</span>
        <span>${r.time ? escapeHtml(r.time) : ''}</span>
      </div>
      <div class="tags">${(r.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `;
}

/* ---------------- RECIPE FORM (add/edit) ---------------- */

      </div>
    `;
    renderIngList();
    renderStepList();

    document.getElementById('closeModal').onclick = closeModal;
    document.getElementById('cancelForm').onclick = closeModal;
    document.getElementById('addIng').onclick = ()=>{ draft.ingredients.push({amount:'',unit:'',name:''}); renderIngList(); };
    document.getElementById('addStep').onclick = ()=>{ draft.steps.push(''); renderStepList(); };
    document.getElementById('saveForm').onclick = async ()=>{
      draft.title = document.getElementById('f-title').value.trim() || 'Untitled recipe';
      draft.tags = document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
      draft.servings = parseInt(document.getElementById('f-servings').value) || null;
      draft.time = document.getElementById('f-time').value.trim();
      draft.notes = document.getElementById('f-notes').value;
      draft.ingredients = draft.ingredients.filter(i=>i.name && i.name.trim());
      draft.steps = draft.steps.filter(s=>s && s.trim());
      const idx = recipes.findIndex(r=>r.id===draft.id);
      if(idx>=0) recipes[idx] = draft; else recipes.push(draft);
      await saveRecipes();
      closeModal();
      renderRecipesPanel();
    };
  }

  function renderIngList(){
    const el = document.getElementById('ingList');
    el.innerHTML = draft.ingredients.map((ing,i)=>`
      <div class="ing-row">
        <input type="text" data-i="${i}" data-f="amount" class="ing-amount" placeholder="amt" value="${escapeHtml(ing.amount)}">
        <input type="text" data-i="${i}" data-f="unit" class="ing-unit" placeholder="unit" value="${escapeHtml(ing.unit)}">
        <input type="text" data-i="${i}" data-f="name" class="ing-name" placeholder="ingredient" value="${escapeHtml(ing.name)}">
        <button type="button" class="icon-btn ing-del" data-i="${i}" aria-label="Remove">✕</button>
      </div>
    `).join('');
    el.querySelectorAll('input').forEach(inp=>{
      inp.oninput = ()=>{ draft.ingredients[inp.dataset.i][inp.dataset.f] = inp.value; };
    });
    el.querySelectorAll('.ing-del').forEach(btn=>{
      btn.onclick = ()=>{ draft.ingredients.splice(btn.dataset.i,1); renderIngList(); };
    });
  }

  function renderStepList(){
    const el = document.getElementById('stepList');
    el.innerHTML = draft.steps.map((s,i)=>`
      <div class="step-row">
        <div class="step-num">${i+1}</div>
        <textarea data-i="${i}" class="step-text" rows="2">${escapeHtml(s)}</textarea>
        <button type="button" class="icon-btn step-del" data-i="${i}" aria-label="Remove">✕</button>
      </div>
    `).join('');
    el.querySelectorAll('.step-text').forEach(inp=>{
      inp.oninput = ()=>{ draft.steps[inp.dataset.i] = inp.value; };
    });
    el.querySelectorAll('.step-del').forEach(btn=>{
      btn.onclick = ()=>{ draft.steps.splice(btn.dataset.i,1); renderStepList(); };
    });
  }

  openModal();
  renderForm();
}

function buildRecipeText(r){
  const lines = [];
  lines.push(`*${r.title}*`);
  const meta = [];
  if(r.servings) meta.push(`Serves ${r.servings}`);
  if(r.time) meta.push(r.time);
  if(meta.length) lines.push(meta.join(' · '));
  lines.push('');
  if((r.ingredients||[]).length){
    lines.push('*Ingredients:*');
    r.ingredients.forEach(i=>{
      const amt = [i.amount, i.unit].filter(Boolean).join(' ').trim();
      lines.push(`• ${amt ? amt+' ' : ''}${i.name}`);
    });
    lines.push('');
  }
  if((r.steps||[]).length){
    lines.push('*Steps:*');
    r.steps.forEach((s,idx)=>{ lines.push(`${idx+1}. ${s}`); });
  }
  if(r.notes){
    lines.push('');
    lines.push(`*Notes:* ${r.notes}`);
  }
  return lines.join('\n');
}

function buildShoppingText(){
  const lines = ['*Shopping list*'];
  const recipeItems = shoppingList.filter(i=>i.source!=='manual');
  const manualItems = shoppingList.filter(i=>i.source==='manual');
  const fmt = it => {
    const amt = [it.amount, it.unit].filter(Boolean).join(' ').trim();
    return `${it.checked ? '✅' : '⬜'} ${amt ? amt+' ' : ''}${it.name}`;
  };
  if(recipeItems.length){
    lines.push('', '*From this week\'s menu:*');
    recipeItems.forEach(it=>lines.push(fmt(it)));
  }
  if(manualItems.length){
    lines.push('', '*Added by hand:*');
    manualItems.forEach(it=>lines.push(fmt(it)));
  }
  if(!recipeItems.length && !manualItems.length) lines.push('', '(nothing on the list yet)');
  return lines.join('\n');
}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}

function showCopyModal(titleText, text){
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `
    <div class="card-title-row">
      <h2 style="font-family:'Fraunces',serif; margin:0;">${escapeHtml(titleText)}</h2>
      <button class="icon-btn" id="closeModal" aria-label="Close">✕</button>
    </div>
    <div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Plain text, ready to paste into WhatsApp or anywhere else. Tap Copy, or select the text yourself.</div>
    <textarea id="copyText" rows="16" style="width:100%; font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1.5;" readonly></textarea>
    <div class="row" style="justify-content:flex-end; margin-top:14px;">
      <button class="ghost" id="closeTextModal">Close</button>
      <button id="copyBtn">Copy</button>
    </div>
  `;
  const ta = document.getElementById('copyText');
  ta.value = text;
  ta.focus();
  ta.select();
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('closeTextModal').onclick = closeModal;
  document.getElementById('copyBtn').onclick = async (e)=>{
    const ok = await copyToClipboard(text);
    e.target.textContent = ok ? 'Copied!' : 'Select text above';
    setTimeout(()=>{ e.target.textContent = 'Copy'; }, 2000);
  };
  openModal();
}

/* ---------------- RECIPE DETAIL ---------------- */

  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  const modal = document.getElementById('modalBody');
  modal.innerHTML = `
    <div class="card-title-row">
      <h2 style="font-family:'Fraunces',serif; margin:0;">${escapeHtml(r.title)}</h2>
      <button class="icon-btn" id="closeModal" aria-label="Close">✕</button>
    </div>
    <div class="meta-line" style="margin-bottom:8px;">
      <span>${r.servings ? r.servings+' servings' : ''}</span>
      <span>${r.time ? escapeHtml(r.time) : ''}</span>
    </div>
    <div class="tags" style="margin-bottom:14px;">${(r.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</div>

    <div class="section-label">Ingredients</div>
    ${(r.ingredients||[]).map(i=>`
      <div class="detail-ing">
        <span class="qty">${escapeHtml(i.amount||'')} ${escapeHtml(i.unit||'')}</span>
        <span>${escapeHtml(i.name)}</span>
      </div>
    `).join('')}

    <div class="section-label">Steps</div>
    <ol class="detail-steps">${(r.steps||[]).map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>

    ${r.notes ? `<div class="section-label">Notes</div><div style="font-size:14px; line-height:1.55;">${escapeHtml(r.notes)}</div>` : ''}

    <div class="row" style="justify-content:flex-end; margin-top:20px;">
      <button class="danger" id="deleteRecipe">Delete</button>
      <button class="ghost" id="editRecipe">Edit</button>
      <button class="ghost" id="copyRecipe">Copy</button>
      <button id="closeDetail">Close</button>
    </div>
  `;
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('closeDetail').onclick = closeModal;
  document.getElementById('editRecipe').onclick = ()=>{ closeModal(); openRecipeForm(r.id); };
  document.getElementById('copyRecipe').onclick = ()=>{ showCopyModal(r.title, buildRecipeText(r)); };
  document.getElementById('deleteRecipe').onclick = (e)=>{
    armConfirm(e.target, 'Click again to delete', async ()=>{
      recipes = recipes.filter(x=>x.id!==r.id);
      await saveRecipes();
      DAYS.forEach(d=>{ if(Array.isArray(menu[d])) menu[d] = menu[d].filter(id=>id!==r.id); });
      await saveMenu();
      closeModal();
      renderRecipesPanel();
    });
  };
  openModal();
}

function openModal(){ document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };

/* ---------------- MENU TAB ---------------- */
function renderMenuPanel(){
  const panel = document.getElementById('panel-menu');
  panel.innerHTML = `
    <div class="row" style="justify-content:space-between; margin-bottom:16px;">
      <div class="tagline" style="margin:0;">Add a main, sides, whatever you're making — then build your shopping list.</div>
      <button id="genList">Generate shopping list</button>
    </div>
    <div class="week-strip">
      ${DAYS.map(day=>{
        const ids = (menu[day] && menu[day].length) ? menu[day] : [null];
        return `
          <div class="day-card">
            <div class="day-label">${day}</div>
            <div class="day-slots" data-day="${day}">
              ${ids.map((rId, idx)=>`
                <div class="day-slot">
                  <select data-day="${day}" data-idx="${idx}" class="day-select">
                    <option value="">— pick —</option>
                    ${recipes.map(rec=>`<option value="${rec.id}" ${rec.id===rId?'selected':''}>${escapeHtml(rec.title)}</option>`).join('')}
                  </select>
                  <button class="icon-btn slot-remove" data-day="${day}" data-idx="${idx}" aria-label="Remove">✕</button>
                </div>
              `).join('')}
            </div>
            <button class="ghost small add-slot" data-day="${day}">+ add dish</button>
          </div>
        `;
      }).join('')}
    </div>
    ${recipes.length===0 ? `<div class="empty"><div class="big">No recipes yet</div><div>Add recipes first, then plan your week.</div></div>` : ''}
  `;
  panel.querySelectorAll('.day-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const day = sel.dataset.day, idx = parseInt(sel.dataset.idx, 10);
      if(!Array.isArray(menu[day])) menu[day] = [];
      menu[day][idx] = sel.value || null;
      await saveMenu();
      renderMenuPanel();
    };
  });
  panel.querySelectorAll('.slot-remove').forEach(btn=>{
    btn.onclick = async ()=>{
      const day = btn.dataset.day, idx = parseInt(btn.dataset.idx, 10);
      if(Array.isArray(menu[day])) menu[day].splice(idx, 1);
      await saveMenu();
      renderMenuPanel();
    };
  });
  panel.querySelectorAll('.add-slot').forEach(btn=>{
    btn.onclick = async ()=>{
      const day = btn.dataset.day;
      if(!Array.isArray(menu[day])) menu[day] = [];
      menu[day].push(null);
      await saveMenu();
      renderMenuPanel();
    };
  });
  document.getElementById('genList').onclick = generateShoppingList;
}

/* ---------------- SHOPPING LIST GENERATION ---------------- */
function normName(n){ return n.trim().toLowerCase(); }

async function generateShoppingList(){
  const aggregated = {}; // key: name+unit -> {name, unit, amount, sources:Set}
  DAYS.forEach(day=>{
    const ids = (menu[day] || []).filter(Boolean);
    ids.forEach(rId=>{
      const r = recipes.find(x=>x.id===rId);
      if(!r) return;
      (r.ingredients||[]).forEach(ing=>{
        const key = normName(ing.name) + '::' + (ing.unit||'').trim().toLowerCase();
        const amtNum = parseFloat(ing.amount);
        if(!aggregated[key]){
          aggregated[key] = { name: ing.name.trim(), unit: (ing.unit||'').trim(), amount: isNaN(amtNum)?null:amtNum, rawAmounts: isNaN(amtNum)?[ing.amount]:[], sources:new Set() };
        }else{
          if(!isNaN(amtNum) && aggregated[key].amount!==null){
            aggregated[key].amount += amtNum;
          }else if(!isNaN(amtNum) && aggregated[key].amount===null){
            aggregated[key].amount = amtNum;
          }else if(ing.amount){
            aggregated[key].rawAmounts.push(ing.amount);
          }
        }
        aggregated[key].sources.add(r.title);
      });
    });
  });

  // preserve manual items (not tied to a recipe) and their checked state; preserve checked state of matching recipe items by name
  const priorChecked = {};
  shoppingList.forEach(it=>{ priorChecked[normName(it.name)+'::'+((it.unit||'').toLowerCase())] = it.checked; });
  const manualItems = shoppingList.filter(it=>it.source==='manual');

  const newList = Object.entries(aggregated).map(([key,v])=>({
    id: uid(),
    name: v.name,
    amount: v.amount!==null ? (Math.round(v.amount*100)/100) : (v.rawAmounts.join(' + ')||''),
    unit: v.unit,
    source: [...v.sources].join(', '),
    checked: priorChecked[key] || false
  }));

  shoppingList = [...newList, ...manualItems];
  await saveShoppingList();
  switchTab('shopping');
}

/* ---------------- SHOPPING TAB ---------------- */
function renderShoppingPanel(){
  const panel = document.getElementById('panel-shopping');
  const recipeItems = shoppingList.filter(i=>i.source!=='manual');
  const manualItems = shoppingList.filter(i=>i.source==='manual');

  panel.innerHTML = `
    <div class="row" style="justify-content:space-between; margin-bottom:16px;">
      <div class="tagline" style="margin:0;">${shoppingList.length} item${shoppingList.length===1?'':'s'}</div>
      <div class="row">
        <button class="ghost small" id="copyList">Copy list</button>
        <button class="ghost small" id="clearChecked">Clear checked</button>
        <button class="ghost small" id="clearAll">Clear all</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:16px;">
      <input type="text" id="manualItemInput" placeholder="Add an item (e.g. paper towels)" style="flex:1;">
      <button id="addManualItem">Add</button>
    </div>
    ${shoppingList.length===0 ? `
      <div class="empty">
        <div class="big">Nothing on the list yet</div>
        <div>Plan your week, then generate a list — or add items by hand.</div>
      </div>
    ` : `
      <div class="notepad">
        ${recipeItems.length ? `<div class="section-head">From this week's menu</div>` : ''}
        ${recipeItems.map(itemHtml).join('')}
        ${manualItems.length ? `<div class="section-head">Added by hand</div>` : ''}
        ${manualItems.map(itemHtml).join('')}
      </div>
    `}
  `;

  panel.querySelectorAll('.list-item input[type=checkbox]').forEach(cb=>{
    cb.onchange = async ()=>{
      const item = shoppingList.find(i=>i.id===cb.dataset.id);
      item.checked = cb.checked;
      await saveShoppingList();
      renderShoppingPanel();
    };
  });
  panel.querySelectorAll('.item-del').forEach(btn=>{
    btn.onclick = async ()=>{
      shoppingList = shoppingList.filter(i=>i.id!==btn.dataset.id);
      await saveShoppingList();
      renderShoppingPanel();
    };
  });
  const addBtn = document.getElementById('addManualItem');
  const input = document.getElementById('manualItemInput');
  const addFn = async ()=>{
    const val = input.value.trim();
    if(!val) return;
    shoppingList.push({ id: uid(), name: val, amount:'', unit:'', source:'manual', checked:false });
    await saveShoppingList();
    renderShoppingPanel();
  };
  addBtn.onclick = addFn;
  input.onkeydown = (e)=>{ if(e.key==='Enter') addFn(); };

  const copyListBtn = document.getElementById('copyList');
  if(copyListBtn) copyListBtn.onclick = ()=>{ showCopyModal('Shopping list', buildShoppingText()); };

  const clearChecked = document.getElementById('clearChecked');
  if(clearChecked) clearChecked.onclick = async ()=>{
    shoppingList = shoppingList.filter(i=>!i.checked);
    await saveShoppingList();
    renderShoppingPanel();
  };
  const clearAll = document.getElementById('clearAll');
  if(clearAll) clearAll.onclick = (e)=>{
    armConfirm(e.target, 'Click again to clear all', async ()=>{
      shoppingList = [];
      await saveShoppingList();
      renderShoppingPanel();
    });
  };
}

function itemHtml(it){
  return `
    <div class="list-item ${it.checked?'checked':''}">
      <input type="checkbox" data-id="${it.id}" ${it.checked?'checked':''}>
      <span class="item-name">${escapeHtml(it.name)}</span>
      ${(it.amount || it.unit) ? `<span class="item-amt">${escapeHtml(String(it.amount||''))} ${escapeHtml(it.unit||'')}</span>` : ''}
      <button class="icon-btn item-del" data-id="${it.id}" aria-label="Remove">✕</button>
    </div>
  `;
}

/* ---------------- TABS ---------------- */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('panel-recipes').style.display = name==='recipes' ? 'block':'none';
  document.getElementById('panel-menu').style.display = name==='menu' ? 'block':'none';
  document.getElementById('panel-shopping').style.display = name==='shopping' ? 'block':'none';
  if(name==='recipes') renderRecipesPanel();
  if(name==='menu') renderMenuPanel();
  if(name==='shopping') renderShoppingPanel();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>switchTab(t.dataset.tab);
});

/* ---------------- INIT ---------------- */
(async function init(){
  await loadAll();
  renderRecipesPanel();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
